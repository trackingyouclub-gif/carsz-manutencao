  const headerTextX=logoDataUrl?margin+logoSize+8:margin;
  doc.setFontSize(9); doc.setTextColor(150); doc.text(`Nº OS: ${o.id}`,pageW-margin,14,{align:'right'}); doc.setTextColor(0);
  if(logoDataUrl){ try{ doc.addImage(logoDataUrl,'JPEG',margin,14,logoSize,logoSize); }catch(e){ console.warn(e); } }
  let hy=22;
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(...BRAND);
  doc.text(marcaTxt,headerTextX,hy); hy+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(120);
  doc.text('Ordem de Serviço',headerTextX,hy); hy+=6;
  doc.setTextColor(0);
  // placa do serviço ainda em andamento — avisa já no cabeçalho que o valor é parcial, pra não
  // confundir o cliente com um "fechamento" que ainda pode mudar até a conclusão
  if(o.status==='Aberta'){
    // fonte padrão do PDF (helvetica) não tem o glifo "⚠" (vira "&" impresso) — usa só texto; e
    // quebra a linha pela largura disponível (que varia com o tamanho da logo), senão a frase
    // passa da borda da página e é cortada, sem aviso nenhum na tela
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(217,119,6);
    const avisoLinhas=doc.splitTextToSize('AVISO: serviço em andamento — valores parciais, sujeitos a alteração até a conclusão.',pageW-margin-headerTextX);
    doc.text(avisoLinhas,headerTextX,hy); hy+=avisoLinhas.length*4.2+1.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(0);
  }
  const infoOficina=[ofDados&&ofDados.endereco,ofDados&&ofDados.telefoneOficina?`Tel: ${ofDados.telefoneOficina}`:null,ofDados&&ofDados.documento?`CNPJ/CPF: ${ofDados.documento}`:null].filter(Boolean);
  doc.setFontSize(9); doc.setTextColor(110);
  for(const l of infoOficina){ doc.text(l,headerTextX,hy); hy+=4.5; }
  doc.setTextColor(0); doc.setFontSize(12);
  y=Math.max(hy+3, 14+logoSize+6);
  doc.setFillColor(...BRAND); doc.rect(margin,y,pageW-margin*2,1,'F'); y+=8;

  // ---- dados do veículo / cliente ----
  tituloSecao('DADOS DO VEÍCULO');
  doc.text(`Placa: ${o.placa}`,margin,y); doc.text(`Km: ${fmtKm(o.km)}`,120,y); y+=lh;
  doc.text(`Veículo: ${v.modelo||'—'} ${v.ano||''}`,margin,y); y+=lh;
  doc.text(`Data do serviço: ${fmtD(o.data||o.concluidaEm)}`,margin,y); y+=lh;
  doc.text(`Oficina: ${o.oficina||(S.oficina&&S.oficina.nome)||''}`,margin,y); y+=lh;
  y+=1; linha();

  // ---- peças e serviços ----
  quebraSeNecessario(20);
  tituloSecao('PEÇAS E SERVIÇOS');
  if((o.itens||[]).length){
    // "bonequinho" (cabeça + corpo) desenhado em vetor — ícone simbolizando "peça trazida pelo
    // cliente", ao lado do valor real da peça (fonte padrão do PDF não tem emoji/glifos unicode)
    const bonequinho=(xDireita,yBase)=>{
      doc.setFillColor(130,130,130);
      doc.circle(xDireita,yBase-3.1,0.85,'F');
      doc.roundedRect(xDireita-1.6,yBase-2.1,3.2,2.3,0.9,0.9,'F');
      doc.setFillColor(0,0,0);
    };
    for(const i of o.itens){
      quebraSeNecessario();
      const qtd=+i.qtd||1;
      const valTxt=i.custo?fmtBRL((+i.custo)*qtd):'—';
      doc.text(`${i.nome}${qtd>1?' ×'+qtd:''}`,margin,y);
      const xIcone=i.pecaCliente?pageW-margin-doc.getTextWidth(valTxt)-5:0;
      doc.text(valTxt,pageW-margin,y,{align:'right'});
      if(i.pecaCliente) bonequinho(xIcone,y);
      y+=lh;
      if(i.obs){ doc.setFontSize(9); doc.setTextColor(110); quebraSeNecessario(); doc.text(String(i.obs),margin+4,y); doc.setFontSize(12); doc.setTextColor(0); y+=lh-2; }
    }
  } else { doc.text('Nenhuma peça registrada.',margin,y); y+=lh; }
  y+=1; linha(); quebraSeNecessario(18);
  const emAndamento=o.status==='Aberta';
  const pecasCliT=valorPecasCliente(o);
  doc.setFont('helvetica','normal'); doc.setTextColor(110);
  if(pecasCliT>0){ doc.text('Peças do cliente (abatido):',margin,y); doc.text(fmtBRL(pecasCliT),pageW-margin,y,{align:'right'}); y+=lh; }
  doc.setTextColor(0); doc.setFont('helvetica','bold');
  doc.text('Peças da oficina:',margin,y); doc.text(fmtBRL(pecasTotal(o)),pageW-margin,y,{align:'right'}); y+=lh;
  if(podeMo){
    doc.setFont('helvetica','normal');
    doc.text(emAndamento&&!o.maoObra?'Mão de obra: ainda não informada':'Mão de obra:',margin,y); if(!(emAndamento&&!o.maoObra)) doc.text(fmtBRL(o.maoObra||0),pageW-margin,y,{align:'right'}); y+=lh;
    // desconto: aparece negativo, com o motivo escrito (o PDF é o que o cliente recebe)
    const descPdf=descontoOs(o);
    if(descPdf>0){
      quebraSeNecessario(12);
      const linhasDesc=doc.splitTextToSize('Desconto'+(o.descontoMotivo?' ('+o.descontoMotivo+')':'')+':',pageW-margin*2-45);
      doc.setTextColor(185,28,28);
      doc.text(linhasDesc,margin,y); doc.text('- '+fmtBRL(descPdf),pageW-margin,y,{align:'right'});
      doc.setTextColor(0);
      y+=(linhasDesc.length-1)*5+lh;
    }
    y+=2;
    quebraSeNecessario(12);
    // total em destaque, com uma faixa clara atrás — é o número que mais importa no papel; em
    // andamento usa cor de alerta e deixa claro que é parcial, não o fechamento da OS
    doc.setFillColor(...(emAndamento?[254,243,199]:[238,242,247]));
    doc.rect(margin,y-6,pageW-margin*2,9.5,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...(emAndamento?[180,83,9]:BRAND));
    doc.text(emAndamento?'TOTAL PARCIAL:':'TOTAL:',margin+2,y); doc.text(fmtBRL(osTotal(o)),pageW-margin-2,y,{align:'right'});
    doc.setTextColor(0); doc.setFontSize(12); y+=lh+3;
  }
  doc.setFont('helvetica','normal');

  // ---- relato ----
  if(o.relato){ quebraSeNecessario(20); linha(); tituloSecao('RELATO');
    const linhasRelato=doc.splitTextToSize(o.relato,pageW-margin*2); quebraSeNecessario(linhasRelato.length*5);
    doc.text(linhasRelato,margin,y); y+=linhasRelato.length*5+2;

  // ---- rodapé: dados de pagamento (Pix), se a oficina tiver chave cadastrada — fica por último,
  // como fecho do documento. O nome do mecânico responsável não aparece mais no papel impresso

  const ofPdf=ofDados;
  if(ofPdf&&ofPdf.pixChave){
    const valorPdf=podeMo?osTotal(o):pecasTotal(o);
    const pixPayload=montarPixPayload(ofPdf.pixChave,ofPdf.pixNome||ofPdf.nome||ofPdf.responsavel||'',ofPdf.pixCidade,valorPdf,('OS'+o.id).slice(0,25));
    const qrUrl=pixPayload?await qrCodeDataUrl(pixPayload,220):null;
    if(qrUrl){
      quebraSeNecessario(40); y+=2; linha(); y+=1;
      tituloSecao('PAGAMENTO VIA PIX');
      try{
        doc.addImage(qrUrl,'PNG',margin,y-4,30,30);
        doc.setFont('helvetica','normal'); doc.setFontSize(9);
        doc.text(`Valor: ${fmtBRL(valorPdf)}`,margin+36,y+2);

        doc.text('Escaneie com o app do seu banco para pagar',margin+36,y+20);
      }catch(e){ console.warn('qr pix no pdf indisponível:',e); }
      doc.setFontSize(12); y+=30;
    }
  }

  if(emAndamento){ doc.setFontSize(8); doc.setTextColor(180,83,9); doc.text('Serviço ainda em andamento — valores parciais, sujeitos a alteração até a conclusão.',margin,284); }
  doc.setFontSize(8); doc.setTextColor(150);
  doc.text(`Gerado em ${fmtD(agoraIso())} · Carsz · Controle de Manutenção`,margin,290);
  const nomeArq=`OS-${o.placa}-${(o.data||o.concluidaEm||'').slice(0,10)}.pdf`;
  return {doc,nomeArq,o};
}
// ---- gera o PDF da OS e baixa/envia (para enviar por WhatsApp) ----
async function imprimirOs(id){
  const r=await montarOsPdf(id); if(!r) return;
  const {doc,nomeArq,o}=r;
  const blob=doc.output('blob'); const file=new File([blob],nomeArq,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:'OS '+o.placa,text:`OS ${o.placa} — ${fmtD(o.data||o.concluidaEm)}`}); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  doc.save(nomeArq);
  toast('PDF baixado — anexe no WhatsApp pelo seletor de arquivos');
}

// ---- abre o diálogo de impressão do navegador direto no PDF, pra escolher a impressora (em vez
// de precisar baixar o arquivo primeiro e abrir noutro programa) — usa uma aba nova porque o
// visualizador de PDF embutido no iframe nem sempre responde a print() de dentro da própria página ----
function imprimirDireto(url){
  const w=window.open(url,'_blank');
  if(!w){ toast('O navegador bloqueou a nova aba — permita pop-ups pra este site, ou use "Baixar / Enviar"'); return; }
  const tentarImprimir=()=>{ try{ w.focus(); w.print(); }catch(e){} };
  try{ w.addEventListener('load',tentarImprimir); }catch(e){}
  setTimeout(tentarImprimir,600);
}
// agrupa os veículos que têm nome de cliente cadastrado, filtrando pelo texto digitado (sem
// acento/maiúscula) — usado na busca por cliente de "Histórico por placa": útil pra quem atende
// cliente com mais de um carro (revenda, cliente com frota própria etc.), não só a frota Carsz
function clientesParecidos(busca){
  const q=slug(busca);
  const porCliente={};
  for(const v of S.veic){
    if(!v.clienteNome) continue;
    if(q&&!slug(v.clienteNome).includes(q)) continue;
    (porCliente[v.clienteNome]=porCliente[v.clienteNome]||[]).push(v);
  }
  return Object.entries(porCliente).sort((a,b)=>a[0].localeCompare(b[0]));
}

  ${corpoPlaca}${corpoCliente}`;

// aba do mecânico chefe: mesmos alertas de "Atenção agora" do painel do administrador, só da
// frota Carsz (clientes particulares do mecânico não entram aqui), para ele acompanhar junto com o gestor
function matencao(m){
  // oficina PARCEIRA (não a Matriz): só mostra alerta de placa da FROTA que ela já atendeu
  // alguma vez (abriu OS) — senão ela veria avisos da frota inteira da Carsz, não só do que é dela
  const souParceira=!!(S.perfil&&S.perfil.oficinaId&&S.perfil.oficinaId!=='matriz');
  const placasAtendidas=souParceira?new Set(S.os.map(o=>o.veiculoId)):null;
  const veicFrota=S.veic.filter(isFrota).filter(v=>!souParceira||placasAtendidas.has(v.id));
  // clientes particulares (não-frota) já visíveis aqui — pelo próprio cadastro, ou por estar
  // envolvida num encaminhamento — também entram nos alertas: o histórico é geral em toda a
  // base, então uma manutenção vencida registrada por OUTRA oficina aparece aqui também
  const veicParticulares=S.veic.filter(v=>!isFrota(v));
  const veicAlerta=[...veicFrota,...veicParticulares];
  const venc=[],prox=[];
  for(const v of veicAlerta) for(const a of alertasVeic(v)){ if(a.lvl==='bad')venc.push(a); else if(a.lvl==='warn')prox.push(a); }
  let h=`<div class="bar"><h2>Atenção agora</h2></div><p class="hint" style="margin:-4px 0 10px">${souParceira?'Veículos da frota Carsz que sua oficina já atendeu, mais seus clientes particulares — considerando também manutenções registradas em outras oficinas.':'Frota Carsz e clientes particulares — considerando também manutenções registradas em outras oficinas.'}</p><div class="cards">
    <div class="card bad"><div class="v">${venc.length}</div><div class="l">manutenções vencidas</div></div>
    <div class="card warn"><div class="v">${prox.length}</div><div class="l">vencendo em breve</div></div>
  </div>`;
  const lista=[...venc,...prox].sort((a,b)=>(b.p.critico?1:0)-(a.p.critico?1:0));
  h+='<h4>Itens para verificar</h4><div class="alertlist">';
  if(!lista.length) h+='<div class="empty">Nenhuma manutenção vencida ou próxima.</div>';
  for(const a of lista) h+=`<div class="al ${a.lvl}"><span class="plate">${esc(a.v.placa)}</span><span>${esc(a.v.modelo)}</span><span class="sp">${a.p.critico?'<span class="tag bad">SENSÍVEL</span> ':''}<b>${esc(a.p.nome)}</b> — ${a.txt}</span></div>`;
  h+='</div>';
  m.innerHTML=h;
}

// ---- período corrente (mês/trimestre/bimestre/ano) para o gráfico de custo por veículo do painel ----
const NOMES_MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function periodoRange(tipo){
  const now=new Date(), y=now.getFullYear(), mes=now.getMonth();
  if(tipo==='ano') return {inicio:new Date(y,0,1),fim:new Date(y+1,0,1)};
  if(tipo==='trimestre'){ const q=Math.floor(mes/3); return {inicio:new Date(y,q*3,1),fim:new Date(y,q*3+3,1)}; }
  if(tipo==='bimestre'){ const b=Math.floor(mes/2); return {inicio:new Date(y,b*2,1),fim:new Date(y,b*2+2,1)}; }
  return {inicio:new Date(y,mes,1),fim:new Date(y,mes+1,1)};
}
function periodoLabel(tipo){
  const now=new Date(), y=now.getFullYear(), mes=now.getMonth();
  if(tipo==='ano') return `Ano de ${y}`;
  if(tipo==='trimestre') return `${Math.floor(mes/3)+1}º trimestre de ${y}`;
  if(tipo==='bimestre') return `${Math.floor(mes/2)+1}º bimestre de ${y}`;
  return `${NOMES_MES[mes]} de ${y}`;
}
const MESES_ABREV=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
// gasto por mês desde a OS mais antiga conhecida (não um período fixo de 12 meses) — usado em
// Relatórios e no Painel. Agrupa pela data da intervenção (o.data), não pela data de conclusão
// no sistema, senão OS antigas lançadas hoje aparecem todas concentradas no mês atual.
function gastoPorMesDesdeInicio(osConcluidas){
  const porMes={};
  for(const o of osConcluidas){ const d=(o.data||o.concluidaEm||'').slice(0,7); if(d) porMes[d]=(porMes[d]||0)+osTotal(o); }
  const datas=osConcluidas.map(o=>o.data||o.concluidaEm).filter(Boolean).sort();
  if(!datas.length) return {meses:[],porMes};
  const ini=new Date(datas[0]); const agora=new Date();
  const totalMeses=Math.max(1,(agora.getFullYear()-ini.getFullYear())*12+(agora.getMonth()-ini.getMonth())+1);
  const meses=[...Array(totalMeses)].map((_,i)=>{ const d=new Date(ini.getFullYear(),ini.getMonth()+i,1); return d.toISOString().slice(0,7); });
  return {meses,porMes};
}
// ---- relatórios: métricas por veículo (paradas, gasto, km rodado, dias acompanhados) ----
function metricasVeic(v,osList){
  const os=osList.filter(o=>o.veiculoId===v.id);
  const paradas=os.length;
  const gasto=os.reduce((s,o)=>s+osTotal(o),0);
  const kms=os.map(o=>+o.km||0).filter(k=>k>0);
  // km rodado = desde a primeira OS conhecida até o último km registrado do veículo — usa o maior
  // entre o km das OS e o km atual do veículo (v.km), pois o odômetro pode ter sido atualizado
  // depois da última OS (botão "Atualizar km" na Frota) sem lançar uma OS nova
  const kmIni=kms.length?Math.min(...kms):null;
  const kmFim=Math.max(+v.km||0,...(kms.length?kms:[0]));
  const kmRodado=(kmIni!=null&&kmFim>kmIni)?kmFim-kmIni:0;
  const datas=os.map(o=>o.data||o.concluidaEm).filter(Boolean).sort();
  // dias acompanhados = desde a 1ª OS registrada até hoje (não só o intervalo entre OS) — evita projeção mensal
  // distorcida quando há poucas OS muito próximas no tempo (ex.: histórico antigo lançado tudo de uma vez)
  const dias=datas.length?Math.max(1,Math.round((Date.now()-new Date(datas[0]))/864e5)):null;
  // só projeta custo/dia (e por consequência custo mensal) com pelo menos ~15 dias de histórico acompanhado,
  // senão poucas OS muito próximas geram uma taxa diária irreal quando multiplicada por 30
  const diasConfiaveis=dias&&dias>=15?dias:null;
  return {v,paradas,gasto,kmRodado,dias,
    custoPorParada:paradas?gasto/paradas:0,
    custoPorKm:kmRodado?gasto/kmRodado:null,
    custoPorDia:diasConfiaveis?gasto/diasConfiaveis:null};
}
function relView(m){

  const totalGasto=porVeic.reduce((s,x)=>s+x.gasto,0);
  const totalParadas=porVeic.reduce((s,x)=>s+x.paradas,0);

  const mediaPorVeic=porVeic.length?totalGasto/porVeic.length:0;
  const mediaPorParada=totalParadas?totalGasto/totalParadas:0;
  const custoPorKmGeral=totalKm?totalGasto/totalKm:null;
  // gasto por mês — desde a 1ª OS conhecida da frota (não um período fixo), independente do
  // filtro de período acima, para ver a tendência completa

  const maxGasto=Math.max(1,...rankGasto.map(x=>x.gasto));
  const ordens={paradas:(a,b)=>b.paradas-a.paradas,gasto:(a,b)=>b.gasto-a.gasto,km:(a,b)=>b.kmRodado-a.kmRodado,custoKm:(a,b)=>(b.custoPorKm||0)-(a.custoPorKm||0),custoDia:(a,b)=>(b.custoPorDia||0)-(a.custoPorDia||0)};
  const tabela=[...porVeic].sort(ordens[ordem]||ordens.paradas);
  let h=`<div class="bar"><h2>Relatórios</h2><span class="sp"></span><select id="rel_periodo" onchange="S.relPeriodo=this.value==='tudo'?'tudo':+this.value;render()" style="max-width:190px">${[['3','Últimos 3 meses'],['6','Últimos 6 meses'],['12','Últimos 12 meses'],['tudo','Desde o início']].map(([v,l])=>`<option value="${v}" ${String(periodo)===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <p class="hint" style="margin:-4px 0 10px">Somente frota Carsz. Veículos de clientes particulares do mecânico não entram nestes números.</p>`;
  h+=`<div class="cards">
    <div class="card"><div class="v" style="font-size:22px">${fmtBRL(totalGasto)}</div><div class="l">gasto no período</div></div>
    <div class="card"><div class="v">${totalParadas}</div><div class="l">paradas (OS concluídas)</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(mediaPorVeic)}</div><div class="l">média por veículo</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(mediaPorParada)}</div><div class="l">média por parada</div></div>
    <div class="card"><div class="v" style="font-size:20px">${custoPorKmGeral!=null?fmtBRL(custoPorKmGeral):'—'}</div><div class="l">custo médio por km rodado</div></div>
  </div>`;
  h+=`<h4>Gasto por mês (desde a 1ª OS registrada)</h4><div class="barchart">`+(mesesHist.length?mesesHist.map(mm=>{
    const val=porMes[mm]||0, pct=Math.round(val/maxMes*100), [yy,mo]=mm.split('-');
    return `<div class="brow"><span class="blabel">${MESES_ABREV[+mo-1]}/${yy.slice(2)}</span><div class="btrack"><div class="bfill" style="width:${pct}%"></div></div><span class="bval">${fmtBRL(val)}</span></div>`;
  }).join(''):'<div class="empty">Nenhuma OS concluída registrada ainda.</div>')+`</div>`;
  h+=`<div class="grid" style="gap:20px">
    <div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div><h4>Ranking · mais paradas</h4><div class="barchart">${ranking.length?ranking.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.v.placa)}</span><div class="btrack"><div class="bfill warn" style="width:${Math.round(x.paradas/maxParadas*100)}%"></div></div><span class="bval">${x.paradas}</span></div>`).join(''):'<div class="empty">Sem dados no período.</div>'}</div></div>
      <div><h4>Ranking · maior gasto</h4><div class="barchart">${rankGasto.length?rankGasto.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.v.placa)}</span><div class="btrack"><div class="bfill" style="width:${Math.round(x.gasto/maxGasto*100)}%"></div></div><span class="bval">${fmtBRL(x.gasto)}</span></div>`).join(''):'<div class="empty">Sem dados no período.</div>'}</div></div>
    </div></div>`;
  h+=`<div class="bar" style="margin-top:6px"><h2 style="font-size:16px">Detalhe por veículo</h2><span class="sp"></span><select id="rel_ordem" onchange="S.relOrdem=this.value;render()" style="max-width:230px">${[['paradas','Ordenar por: mais paradas'],['gasto','Ordenar por: maior gasto'],['km','Ordenar por: mais km rodado'],['custoKm','Ordenar por: maior R$/km'],['custoDia','Ordenar por: maior R$/dia']].map(([v,l])=>`<option value="${v}" ${ordem===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
  h+=tabela.length?`<div class="tbl"><table><tr><th>Placa</th><th>Modelo</th><th class="num">Paradas</th><th class="num">Km rodado</th><th class="num">Gasto total</th><th class="num">R$/parada</th><th class="num">R$/km</th><th class="num">Dias acompanhados</th><th class="num">R$/dia</th></tr>`+

    :'<div class="empty">Nenhuma OS concluída no período selecionado.</div>';
  m.innerHTML=h;
}
function painel(m){
  // painel é só da frota própria (nossos carros) — carros de clientes particulares do mecânico
  // (fora da frota) continuam com OS/histórico normais, mas não entram nestas contas
  const veicFrota=S.veic.filter(isFrota);
  const frotaIds=new Set(veicFrota.map(v=>v.id));
  const venc=[],prox=[];
  for(const v of veicFrota) for(const a of alertasVeic(v)){ if(a.lvl==='bad')venc.push(a); else if(a.lvl==='warn')prox.push(a); }
  const osConcluidas=S.os.filter(o=>o.status==='Concluída'&&frotaIds.has(o.veiculoId));
  const porVeic=veicFrota.map(v=>metricasVeic(v,osConcluidas)).filter(x=>x.paradas>0);
  const custoTotal=porVeic.reduce((s,x)=>s+x.gasto,0);
  const kmTotal=porVeic.reduce((s,x)=>s+x.kmRodado,0);
  const custoMedioVeic=porVeic.length?custoTotal/porVeic.length:0;
  const custoPorKmGeral=kmTotal?custoTotal/kmTotal:null;
  const abertas=S.os.filter(x=>x.status==='Aberta'&&frotaIds.has(x.veiculoId)).length;
  let h=`<p class="hint" style="margin:0 0 10px">Somente frota Carsz. Veículos de clientes particulares do mecânico não entram aqui — acompanhe-os normalmente em Frota, OS e Histórico.</p><div class="cards">
    <div class="card bad"><div class="v">${venc.length}</div><div class="l">manutenções vencidas</div></div>
    <div class="card warn"><div class="v">${prox.length}</div><div class="l">vencendo em breve</div></div>
    <div class="card ${abertas?'warn':''}"><div class="v">${abertas}</div><div class="l">OS abertas na oficina</div></div>
    <div class="card"><div class="v">${veicFrota.length}</div><div class="l">veículos na frota</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(custoTotal)}</div><div class="l">custo total de manutenção</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(custoMedioVeic)}</div><div class="l">custo médio por veículo</div></div>
    <div class="card"><div class="v" style="font-size:20px">${custoPorKmGeral!=null?fmtBRL(custoPorKmGeral):'—'}</div><div class="l">custo médio por km rodado</div></div>
  </div>`;
  const lista=[...venc,...prox].sort((a,b)=>(b.p.critico?1:0)-(a.p.critico?1:0));
  h+='<h4>Atenção agora</h4><div class="alertlist">';
  if(!lista.length) h+='<div class="empty">Nenhuma manutenção vencida ou próxima.</div>';
  for(const a of lista) h+=`<div class="al ${a.lvl}"><span class="plate">${esc(a.v.placa)}</span><span>${esc(a.v.modelo)}</span><span class="sp">${a.p.critico?'<span class="tag bad">SENSÍVEL</span> ':''}<b>${esc(a.p.nome)}</b> — ${a.txt}</span></div>`;
  h+='</div>';
  if(porVeic.length){
    // evolução gasto x km rodado: km desde a 1ª OS conhecida de cada veículo até o último km
    // registrado (metricasVeic já calcula isso), rankeado do pior (mais R$/km) para o melhor
    const rankCusto=[...porVeic].filter(x=>x.custoPorKm!=null).sort((a,b)=>(b.custoPorKm||0)-(a.custoPorKm||0));
    const maxCustoKm=Math.max(1,...rankCusto.map(x=>x.custoPorKm||0));
    h+='<h4>Evolução gasto × km rodado — R$/km desde a 1ª OS de cada veículo</h4><p class="hint" style="margin:-4px 0 8px">Km rodado = do km da OS mais antiga até o último km conhecido do veículo (odômetro atual, se mais recente). Gasto realizado, sem projeção. Do mais caro para o mais barato por km.</p>';
    h+=rankCusto.length?`<div class="barchart">${rankCusto.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.v.placa)}</span><div class="btrack"><div class="bfill warn" style="width:${Math.round((x.custoPorKm||0)/maxCustoKm*100)}%"></div></div><span class="bval">${fmtBRL(x.custoPorKm)}/km</span></div>`).join('')}</div>`:'<div class="empty">Ainda sem km suficiente para calcular R$/km.</div>';
    h+='<div class="tbl" style="margin-top:8px"><table><tr><th>Placa</th><th>Modelo</th><th class="num">Km rodado (desde a 1ª OS)</th><th class="num">Gasto total (realizado)</th><th class="num">R$/km</th></tr>'+
      [...porVeic].sort((a,b)=>(b.custoPorKm||0)-(a.custoPorKm||0)).map(x=>`<tr><td><span class="plate">${esc(x.v.placa)}</span></td><td>${esc(x.v.modelo)}</td><td class="num">${x.kmRodado?fmtKm(x.kmRodado):'—'}</td><td class="num">${fmtBRL(x.gasto)}</td><td class="num">${x.custoPorKm!=null?fmtBRL(x.custoPorKm):'—'}</td></tr>`).join('')+
      '</table></div>';
  }
  // gasto médio de manutenção por veículo, mês a mês, desde o mês da OS mais antiga conhecida da
  // frota (não um período fixo) — mostra a evolução do gasto no tempo
  const {meses:mesesHist,porMes:porMesHist}=gastoPorMesDesdeInicio(osConcluidas);
  if(mesesHist.length&&veicFrota.length){
    const [yyIni,moIni]=mesesHist[0].split('-');
    const mediaMes=mesesHist.map(mm=>(porMesHist[mm]||0)/veicFrota.length);
    const maxMediaMes=Math.max(1,...mediaMes);
    h+=`<h4 style="margin-top:18px">Gasto médio de manutenção por veículo — mês a mês</h4><p class="hint" style="margin:-4px 0 8px">Gasto do mês ÷ ${veicFrota.length} veículo${veicFrota.length===1?'':'s'} da frota. Começa em ${MESES_ABREV[+moIni-1]}/${yyIni}, mês da OS mais antiga registrada.</p>`;
    h+=`<div class="barchart">${mesesHist.map((mm,i)=>{ const [yy,mo]=mm.split('-'); const val=mediaMes[i];
      return `<div class="brow"><span class="blabel">${MESES_ABREV[+mo-1]}/${yy.slice(2)}</span><div class="btrack"><div class="bfill" style="width:${Math.round(val/maxMediaMes*100)}%"></div></div><span class="bval">${fmtBRL(val)}</span></div>`;
    }).join('')}</div>`;
  }
  const tipoPer=S.custoPeriodo||'mes';
  const {inicio,fim}=periodoRange(tipoPer);
  const osPer=osConcluidas.filter(o=>{ const d=new Date(o.data||o.concluidaEm); return d>=inicio&&d<fim; });
  const porVeicPer=veicFrota.map(v=>({v,gasto:osPer.filter(o=>o.veiculoId===v.id).reduce((s,o)=>s+osTotal(o),0)})).filter(x=>x.gasto>0).sort((a,b)=>b.gasto-a.gasto);
  const maxPer=Math.max(1,...porVeicPer.map(x=>x.gasto));
  h+=`<div class="bar" style="margin-top:6px"><h4 style="margin:0">Custo de manutenção por veículo — ${esc(periodoLabel(tipoPer))}</h4><span class="sp"></span><select onchange="S.custoPeriodo=this.value;render()" style="max-width:170px">${[['mes','Mensal'],['bimestre','Bimestral'],['trimestre','Trimestral'],['ano','Anual']].map(([v,l])=>`<option value="${v}" ${tipoPer===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <p class="hint" style="margin:2px 0 8px">Gasto realizado no período atual, do pior (mais caro) para o melhor (mais barato).</p>`;
  h+=porVeicPer.length?`<div class="barchart">${porVeicPer.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.v.placa)}</span><div class="btrack"><div class="bfill warn" style="width:${Math.round(x.gasto/maxPer*100)}%"></div></div><span class="bval">${fmtBRL(x.gasto)}</span></div>`).join('')}</div>`:'<div class="empty">Nenhuma OS concluída neste período.</div>';
  m.innerHTML=h;
}

async function excluirOsMec(id){
  if(!ehChefe()&&!ehGestor()){ toast('Somente o mecânico chefe ou a gestão pode excluir uma OS'); return; }

}

async function importarJson(inp){
  const f=inp.files[0]; if(!f) return; let d; try{ d=JSON.parse(await f.text()); }catch(e){ toast('Arquivo inválido'); return; }
  const n=(d.veiculos||[]).length+(d.os||[]).length+(d.sinistros||[]).length+(d.pecas||[]).length;
  if(!confirm(`Importar ${n} registros? Registros com o mesmo id são sobrescritos. Fotos não são importadas.`)) return;
  const limpa=o=>{ const c={...o}; delete c.id; return c; };
  for(const [col,arr] of [['veiculos',d.veiculos],['os',d.os],['sinistros',d.sinistros],['pecas',d.pecas]]) for(const r of (arr||[])){ const c=limpa(r); if(col==='os'){ c.fotoPlaca=null; c.fotoKm=null; c.fotos=[]; } await S.db.doc(col+'/'+r.id).set(c); }
  if(d.config) await S.db.doc('config/geral').set(d.config);
  toast('Importação concluída');
}
function exportarJson(){
  const dump={exportadoEm:agoraIso(),origem:'claude-artifact',veiculos:S.veic,os:S.os,pecas:S.pecas,sinistros:S.sin,usuarios:S.mecs,config:S.cfg};
  const b=new Blob([JSON.stringify(dump,null,1)],{type:'application/json'}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download='carsz-manutencao-backup-'+hoje()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('Se o download não iniciar, copie pelo botão abaixo'); const ta=document.createElement('textarea'); ta.value=JSON.stringify(dump); ta.style.cssText='width:100%;height:120px;margin-top:8px'; ta.readOnly=true; ta.onclick=()=>ta.select(); document.getElementById('seed_st').parentElement.parentElement.appendChild(ta);
}

async function salvarOficina(){
  const nome=val('of_nome'), resp=val('of_resp'), tel=val('of_tel'), email=val('of_email').toLowerCase();
  if(!nome){toast('Informe o nome da oficina');return;}
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('E-mail inválido');return;}
  const oid=genId();
  let userId=null;
  if(email){
    // senha aleatória, de uso único e descartável: ninguém a usa — o responsável define a própria
    // senha pelo e-mail de acesso disparado logo abaixo (reaproveita o fluxo de recuperação de senha)
    const senhaTemp=genId()+genId()+genId();
    const tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const {data,error}=await tmp.auth.signUp({email,password:senhaTemp});
    if(error){toast('Erro: '+error.message);return;}
    if(!data.user){toast('Não foi possível criar o acesso');return;}
    if(data.user.identities&&!data.user.identities.length){toast('Este e-mail já está cadastrado — deixe o e-mail em branco e depois mova o usuário existente pra esta oficina em "Oficina" → Editar');return;}
    userId=data.user.id;
  }
  await S.db.doc('oficinas/'+oid).set({nome,responsavel:resp,telefone:tel,email:email||null,logo:logoTemp||null,telefoneOficina:val('of_telofi').trim(),documento:val('of_doc').trim(),endereco:val('of_end').trim(),pixChave:val('of_pixchave').trim(),pixNome:val('of_pixnome').trim(),pixCidade:val('of_pixcidade').trim(),status:'pendente',criadoEm:agoraIso()});
  if(!userId){ fechar(); toast('Oficina cadastrada. Agora mova os usuários dela em "Oficina" (menu) → Editar → campo "Oficina".'); return; }
  await sb.from('perfis').upsert({id:userId,data:{nome:resp||nome,email,papel:'gestor',oficinaId:oid,ativo:true,criadoEm:agoraIso()}});
  const {error:eReset}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  toast('Oficina cadastrada — marque como "ativa" quando quiser liberar o acesso');
  avisoAcessoOficina(nome,resp,tel,email,!eReset);
}
// mostra a confirmação de envio do e-mail de acesso + botão para reenviar o mesmo aviso por
// WhatsApp (o link de senha em si só pode ser enviado por e-mail pelo Supabase; o WhatsApp leva
// o link do site e o login, pedindo pra conferir o e-mail ou usar "Esqueci a senha")
function avisoAcessoOficina(nome,resp,tel,email,emailOk){

// ---- WhatsApp: o número que ENVIA é o do WhatsApp conectado no aparelho/navegador (links wa.me não escolhem o remetente).
// O sistema avisa e pede conferência: tem que ser o (11) 96316-6971.
const WA_SAIDA_NUM='11963166971', WA_SAIDA_TXT='(11) 96316-6971'; let waSaidaOk=false;
const waAndroid=/android/i.test(navigator.userAgent);
const waCelular=waAndroid||/iphone|ipad|ipod/i.test(navigator.userAgent);
// qual WhatsApp abrir no celular: o número de saída é WhatsApp BUSINESS (app separado), então o padrão é o Business
function waModo(){ try{ return localStorage.getItem('wa_app')==='std'?'std':'biz'; }catch(e){ return 'biz'; } }
function waSetModo(m){ try{ localStorage.setItem('wa_app',m); }catch(e){} }
// converte o link wa.me no link que abre o app certo (Android: força o pacote do WhatsApp Business; iPhone: esquema do Business)
function waLinkApp(url,android=waAndroid,celular=waCelular,modo=waModo()){
  const m=String(url).match(/^https:\/\/wa\.me\/(\d*)(?:\?text=(.*))?$/); if(!m||!celular||modo!=='biz') return {url,app:false};
  const ph=m[1], tx=m[2]?'&text='+m[2]:'';
  if(android) return {app:true,url:`intent://send/?phone=${ph}${tx}#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=${encodeURIComponent(url)};end`};
  return {app:true,fb:url,url:`whatsapp-business://send?phone=${ph}${tx}`};
}
function waIr(url){
  const l=waLinkApp(url);
  if(!l.app){ window.open(url,'_blank'); return; }
  if(l.fb){ location.href=l.url; setTimeout(()=>{ if(document.visibilityState==='visible') location.href=l.fb; },1600); return; }
  location.href=l.url;
}
function waAbrir(url){
  if(waSaidaOk){ waIr(url); return; }
  waDialogo(url);
}
function waDialogo(url){
  const old=document.getElementById('wa_conf'); if(old) old.remove();
  const modo=waModo();
  const d=document.createElement('div'); d.id='wa_conf'; d.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML=`<div role="dialog" aria-modal="true" style="background:var(--card,#fff);color:var(--ink,#111);border-radius:14px;max-width:420px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)"><h3 style="margin:0 0 8px">📲 Enviar pelo número da Carsz</h3>
    <p style="margin:0 0 8px">As mensagens precisam sair do número <b style="font-size:18px">${WA_SAIDA_TXT}</b> (WhatsApp Business).</p>
    ${waCelular?`<div style="margin:0 0 10px"><label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="radio" name="wa_modo" value="biz" style="width:auto" ${modo==='biz'?'checked':''}> <span><b>WhatsApp Business</b> (o do ${WA_SAIDA_TXT})</span></label>
      <label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="radio" name="wa_modo" value="std" style="width:auto" ${modo==='std'?'checked':''}> <span>WhatsApp comum</span></label></div>`
    :`<p class="muted" style="margin:0 0 12px;font-size:13px">No computador, abre o WhatsApp Web: ele precisa estar conectado ao ${WA_SAIDA_TXT}. Se aparecer outro número, <b>não envie</b> — saia e conecte o ${WA_SAIDA_TXT}.</p>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="sec" id="wa_conf_nao" style="min-height:44px">${url?'Cancelar':'Fechar'}</button><button class="pri" id="wa_conf_ok" style="min-height:44px">${url?'✔ Abrir no '+WA_SAIDA_TXT:'Salvar'}</button></div></div>`;
  document.body.appendChild(d);
  document.getElementById('wa_conf_nao').onclick=()=>d.remove();
  document.getElementById('wa_conf_ok').onclick=()=>{ const r=d.querySelector('input[name=wa_modo]:checked'); if(r) waSetModo(r.value); waSaidaOk=true; d.remove(); if(url) waIr(url); else toast('WhatsApp: '+(waModo()==='biz'?'Business':'comum')); };
}

let cr=[{placa:'',ano:'',modelo:''}];

function formCadastroRapido(){
  let h='<h3>Cadastro rápido de frota</h3><div class="hint">Preencha placa, ano e modelo de cada veículo — os outros dados (km, empresa, tipo de veículo, situação) você completa depois em Editar. Placas já cadastradas são atualizadas, sem apagar o resto do cadastro. Veículos novos criados aqui entram como frota própria (relatórios/painel); se for carro de cliente particular do mecânico, marque isso em Editar.</div>';

  h+='</table></div>';

function crAdd(){ crSync(); cr.push({placa:'',ano:'',modelo:''}); formCadastroRapido(); }
function crRemover(i){ crSync(); cr.splice(i,1); if(!cr.length) cr.push({placa:'',ano:'',modelo:''}); formCadastroRapido(); }
async function crSalvar(){
  crSync();
  const linhas=cr.map(r=>({placa:normPlaca(r.placa),ano:(r.ano||'').trim(),modelo:(r.modelo||'').trim()})).filter(r=>r.placa);
  if(!linhas.length){ toast('Preencha ao menos uma placa'); return; }
  let criados=0, atualizados=0;
  for(const r of linhas){
    const modelo=r.modelo||'(a definir)';
    const existente=S.veic.find(v=>v.placa===r.placa);
    if(existente){ await S.db.doc('veiculos/'+existente.id).update({modelo,ano:r.ano,pendente:false}); atualizados++; }

  }
  cr=[{placa:'',ano:'',modelo:''}];
  fechar(); toast(`Frota atualizada: ${criados} criado(s), ${atualizados} atualizado(s)`);
}

Object.assign(S,{mots:[],motMsgs:[],motPromessas:[],motAgend:[],motAvisos:[],motVerif:[],motFotos:[],motAtrasos:[],motComp:[],motRank:[],motAtual:null,motOpen:{},motOk:true,motBusca:'',motFiltro:'',cands:[],candMsgs:[],candDocs:[],candAtual:null,candFiltro:'ativos'});

// ---- verificações diárias (água/óleo) e fotos semanais (painel + etiqueta de óleo, segundas-feiras) ----
const motHojeSP = () => new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});
const motSegunda = () => { const d=new Date(motHojeSP()+'T12:00:00'); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.toLocaleDateString('sv-SE'); };
const motHoraSP = iso => { try{ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'}); }catch(e){ return ''; } };
const motDiaHoraSP = iso => { try{ const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'})+' '+motHoraSP(iso); }catch(e){ return ''; } };
const motVerifHoje = id => { const h=motHojeSP(), o={}; for(const v of S.motVerif) if(v.motoristaId===id&&v.dia===h) o[v.tipo]=v.em; return o; };
const motDispensado = x => x.ativo===false||!x.veiculoId||(x.bloqueio||{}).status==='bloqueado';
function motFotoSemana(id,semana){ const o={}; for(const f of S.motFotos) if(f.motoristaId===id&&f.semana===semana&&!f.excluida) o[f.tipo]=f; return o; }
// foto recebida que a equipe ainda não conferiu (a conferência vale só para aquela foto: se o motorista reenviar, volta a ficar pendente)
const motFotoExpirada = f => !!(f.expirada||(f.expiraEm&&new Date(f.expiraEm)<new Date()));
const motFotoPend = f => !f.recusada&&!f.excluida&&!motFotoExpirada(f)&&f.conferidaFotoId!==f.fotoId;
const motFotosPend = id => S.motFotos.filter(f=>f.motoristaId===id&&motFotoPend(f));
// ok | pendente (é segunda e falta) | atrasada (passou a segunda e falta) | opcional (cadastrado depois da segunda) | dispensado
function motFotoStatus(x){
  if(motDispensado(x)) return 'dispensado';
  const sem=motSegunda(), f=motFotoSemana(x.id,sem);
  const valida=t=>f[t]&&!f[t].recusada, recusada=t=>f[t]&&f[t].recusada;
  if(valida('painel')&&valida('etiqueta')) return 'ok';
  const criado=x.criadoEm?new Date(x.criadoEm).toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}):''; const novo=criado&&criado>sem;
  const faltando=!f.painel||!f.etiqueta; // alguma foto que nem foi enviada (diferente de recusada)
  if(motHojeSP()>sem&&faltando&&!novo) return 'atrasada';
  if(recusada('painel')||recusada('etiqueta')) return 'refazer';
  if(novo) return 'opcional';
  return motHojeSP()===sem?'pendente':'atrasada';
}
// só cobra "não verificou hoje" depois do meio-dia (de manhã é normal ainda não ter feito)
const motSemVerifHoje = x => { if(motDispensado(x)) return false; const h=+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'}); if(h<12) return false; const v=motVerifHoje(x.id); return !v.agua||!v.oleo||!v.lanternas||!v.farois; };
// ---- presença: último acesso e uso diário do app ----
const motDiaSP = iso => { try{ return new Date(iso).toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}); }catch(e){ return ''; } };
function motPresenca(x){
  const t=Date.parse(x.ultimoAcesso||''); if(isNaN(t)) return {k:'nunca',dias:999,txt:'Nunca abriu o app',cls:'bad',ico:'⚪'};
  if((Date.now()-t)/60000<=3) return {k:'online',dias:0,txt:'Online agora',cls:'ok',ico:'🟢'};
  const dias=Math.round((Date.parse(motHojeSP())-Date.parse(motDiaSP(x.ultimoAcesso)))/864e5);
  if(dias<=0) return {k:'hoje',dias:0,txt:'Hoje às '+motHoraSP(x.ultimoAcesso),cls:'ok',ico:'🕒'};
  if(dias===1) return {k:'ontem',dias:1,txt:'Ontem às '+motHoraSP(x.ultimoAcesso),cls:'neu',ico:'🕒'};
  return {k:'sumido',dias,txt:'Há '+dias+' dias ('+fmtD(motDiaSP(x.ultimoAcesso))+')',cls:dias>=3?'bad':'warn',ico:'📵'};
}

function motCobrarVerif(id){
  const x=S.mots.find(y=>y.id===id); if(!x) return; const wa=telWa(x.telefone); if(!wa){ toast('Motorista sem telefone'); return; }
  const st=motFotoStatus(x), v=motVerifHoje(id); const falta=[]; if(!v.agua) falta.push('água'); if(!v.oleo) falta.push('óleo'); if(!v.lanternas) falta.push('lanternas'); if(!v.farois) falta.push('faróis');
  const partes=[]; if(falta.length) partes.push('a verificação de '+falta.join(' e ')+' de hoje');
  if(st==='pendente'||st==='atrasada'||st==='refazer') partes.push('as fotos da semana (painel de instrumentos e etiqueta de óleo)');

}

// conferir: a foto passa a valer 30 dias a partir da conferência; na etiqueta a equipe pode corrigir o km digitado e atualizar a próxima troca do veículo
async function motConferirFoto(fid){
  const f=S.motFotos.find(y=>y.id===fid); if(!f) return;
  const num=id=>{ const e=document.getElementById(id); return e?(parseInt(String(e.value).replace(/\D/g,''),10)||null):undefined; };
  let kt=null, kp=null;
  if(f.tipo==='etiqueta'){ const v=num('kt_'+fid); kt=v===undefined?(f.kmTrocaConferido||f.kmTroca||null):v; }
  if(f.tipo==='painel'){ const v=num('kp_'+fid); kp=v===undefined?(f.kmConferido||f.km||null):v; }
  const ck=document.getElementById('ku_'+fid), atualizar=ck?!!ck.checked:true;
  try{
    const d={conferidaFotoId:f.fotoId,conferidaEm:agoraIso(),conferidaPor:(S.perfil&&S.perfil.nome)||'',expiraEm:new Date(Date.now()+30*864e5).toISOString(),...(kt?{kmTrocaConferido:kt}:{}),...(kp?{kmConferido:kp}:{})};
    await S.db.doc('mot_fotos/'+fid).update(d); Object.assign(f,d);
    const extra=await motOleoAuto(f,atualizar);
    toast('Foto conferida'+(extra?' · '+extra:'')); render(); motRecarregar();
  }catch(e){ erroSalvar('conferir a foto',e); }
}
// automatiza o controle de óleo a partir das fotos conferidas (sem ir na área Veículo): com o painel (km) e a etiqueta (próxima troca) conferidos
// inicia o controle; se já estiver iniciado, atualiza a próxima troca (etiqueta) ou corrige o km (painel) quando a equipe mudou o número digitado
async function motOleoAuto(f,atualizar){
  if(!atualizar) return '';
  const x=S.mots.find(y=>y.id===f.motoristaId)||{}, vid=(x.reserva&&x.reserva.veiculoId)||x.veiculoId; if(!vid) return '';
  const v=S.veic.find(y=>y.id===vid)||{}; let base=!!(v.oleo&&v.oleo.base);
  const ult=t=>S.motFotos.filter(y=>y.motoristaId===f.motoristaId&&y.tipo===t&&!y.excluida&&y.conferidaEm&&y.semana===f.semana).sort((a,b)=>String(b.em||'').localeCompare(String(a.em||'')))[0];
  const p=ult('painel'), e=ult('etiqueta'), kmP=p&&(p.kmConferido||p.km), kmE=e&&(e.kmTrocaConferido||e.kmTroca);
  const rpc=async(acao,args)=>{ const {data,error}=await sb.rpc('mot_oleo_staff',{p_veiculo_id:vid,p_acao:acao,...args}); return error?{erro:error.message||'erro'}:(data||{}); };
  try{
    if(!base){
      if(!(kmP&&kmE)) return kmP||kmE?'falta conferir a outra foto para iniciar o controle de óleo':'';
      const r=await rpc('iniciar',{p_km:kmP,p_proxima:kmE});
      if(!r.erro) return 'controle de óleo iniciado: '+fmtKm(kmP)+' km · próxima troca em '+fmtKm(kmE)+' km';
      if(!/já foi iniciado/i.test(r.erro)) return 'não iniciei o controle de óleo: '+r.erro;
      base=true; // a tela estava desatualizada: já estava iniciado
    }
    if(f.tipo==='etiqueta'&&kmE){ const r=await rpc('etiqueta',{p_proxima:kmE}); return r.erro?'não atualizei a troca de óleo: '+r.erro:'próxima troca do veículo: '+fmtKm(kmE)+' km'; }
    if(f.tipo==='painel'&&kmP){
      if(kmP!==(+f.km||0)){ const r=await rpc('corrigir',{p_km:kmP,p_motivo:'Corrigido pela equipe na conferência da foto do painel'}); return r.erro?'não corrigi o km: '+r.erro:'km do veículo corrigido para '+fmtKm(kmP); }
      await rpc('conferido',{}); return '';
    }
  }catch(err){ console.warn(err); return 'não consegui atualizar o controle de óleo'; }
  return '';

// ---- pontuação dos motoristas = SALDO (positivos − negativos), quanto MAIOR melhor. Positivos: água/óleo no dia +0,1 cada; foto do painel/etiqueta enviada na segunda +10 cada. Atraso = dias com "Bloqueio programado"/"Bloqueado"
// (registrado sozinho quando você muda a situação do veículo). 1 dia = -20 · 2 dias = -50 · 3+ dias = -100; cada promessa = -10.
// Vale o mês de calendário (zera todo dia 1º). Empate: mais semanas seguidas sem atraso e sem promessa. Os motoristas veem a placa do 1º colocado.
const motPts = n => { n=Math.round((+n||0)*100)/100; return n===0?'0':(n<0?'−':'+')+Math.abs(n).toLocaleString('pt-BR',{maximumFractionDigits:2}); };
const motRotGanho = g => ({agua:'💧 Água verificada no dia',oleo:'🛢 Óleo verificado no dia',lanternas:'🔴 Lanternas verificadas no dia',farois:'💡 Faróis verificados no dia',painel:'📷 Foto do painel na segunda',etiqueta:'📷 Foto da etiqueta na segunda'})[g.tipo]||g.tipo;

const motMsgAuto2 = t => motMsgsAuto(t)||/^(🧾|🚗)/.test(t.texto||''); // avisos automáticos (comprovante, reserva) não pedem resposta
function motPendencias(id){
  const msgs=S.motMsgs.filter(t=>t.motoristaId===id);
  const ultEq=msgs.filter(t=>t.de==='equipe').map(t=>t.em||'').sort().pop()||'';
  const msg=msgs.filter(t=>t.de==='motorista'&&t.tipo!=='bloqueio'&&!motMsgAuto2(t)&&(t.em||'')>ultEq).length;
  const prom=motPromPend(id), comp=motCompPend(id), ped=motAgPend(id), bloq=motBloqPend(id).length;
  return {msg,prom,comp,ped,bloq,total:msg+prom+comp+ped+bloq};
}
function motPodeSair(){
  const x=S.motAtual&&S.mots.find(y=>y.id===S.motAtual); if(!x) return true;
  const p=motPendencias(x.id); if(!p.total) return true;
  const partes=[]; if(p.msg) partes.push(p.msg+' mensagem'+(p.msg>1?'s':'')+' sem resposta'); if(p.prom) partes.push(p.prom+' promessa'+(p.prom>1?'s':'')); if(p.comp) partes.push(p.comp+' comprovante'+(p.comp>1?'s':'')); if(p.ped) partes.push(p.ped+' pedido'+(p.ped>1?'s':'')+' de manutenção'); if(p.bloq) partes.push(p.bloq+' pedido'+(p.bloq>1?'s':'')+' de bloqueio');
  toast('Antes de sair, resolva ou responda: '+partes.join(', '));
  const el=document.getElementById('mot_precisa'); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.outline='3px solid var(--bad)'; setTimeout(()=>{ el.style.outline=''; },1500); }

}

// ---- km do painel e troca de óleo (Kwid/Sandero: 7.000 km · demais: 10.000 km); só a equipe inicia a base, dá baixa e corrige ----
const motOleoIntervalo = modelo => /kwid|sandero/i.test(modelo||'')?7000:10000;
const motVeic = x => S.veic.find(v=>v.id===((x.reserva&&x.reserva.veiculoId)||x.veiculoId));
const motKmDe = vid => (S.motKm||[]).filter(k=>k.veiculoId===vid&&k.status!=='descartado').sort((a,c)=>(c.em||'').localeCompare(a.em||''));
const motKmConferir = x => { const v=motVeic(x); return v?(S.motKm||[]).filter(k=>k.veiculoId===v.id&&k.status==='conferir').length:0; };
function motOleoInfo(x){
  const v=motVeic(x); if(!v) return null; const o=v.oleo||{}; const inter=motOleoIntervalo(v.modelo);
  if(o.base!==true) return {v,o,base:false,inter};
  const prox=+o.proximaKm, atual=+o.kmAtual, faltam=prox-atual;
  return {v,o,base:true,inter,prox,atual,faltam,nivel:faltam<=0?'vencida':faltam<=100?'vermelho':faltam<=300?'laranja':faltam<=500?'amarelo':'ok'};
}
function motOleoTag(x){
  const i=motOleoInfo(x); if(!i||!i.base||i.faltam>500) return '';
  return i.faltam<=0?`<span class="tag bad">🛢 vencida há ${fmtKm(-i.faltam)}</span>`:`<span class="tag ${i.faltam<=100?'bad':'warn'}">🛢 faltam ${fmtKm(i.faltam)}</span>`;
}
function motOleoHtml(x){

  const row=(a,b)=>`<div class="row" style="padding:3px 0;border-bottom:1px solid var(--line)"><span class="muted">${a}</span><span class="sp"></span><b>${b}</b></div>`;
  const tag=!i.base?'<span class="tag neu">sem base de troca</span>':i.faltam<=0?`<span class="tag bad">vencida há ${fmtKm(-i.faltam)}</span>`:`<span class="tag ${i.faltam<=100?'bad':i.faltam<=500?'warn':'ok'}">faltam ${fmtKm(i.faltam)}</span>`;
  const conf=motKmConferir(x);
  let h=`<div class="step${i.base&&i.faltam<=500?' hot':''}" id="sec_oleo"><div class="row" style="flex-wrap:wrap"><h3 style="margin:0">🛢 Troca de óleo</h3>${tag}<span class="sp"></span></div>
    ${row('Veículo',esc((v.placa||'')+' · '+(v.modelo||''))+' · intervalo '+fmtKm(i.inter))}`;
  if(i.base){
    h+=row('Km atual (último informado'+(i.o.kmEm?', '+fmtD(motDiaSP(i.o.kmEm)).slice(0,5):'')+')',fmtKm(i.atual))+row('Próxima troca (etiqueta)',fmtKm(i.prox))+row('Última troca',i.o.ultimaTrocaKm?fmtKm(i.o.ultimaTrocaKm)+((i.o.baixas||[])[0]?' · '+fmtD((i.o.baixas[0].data||'')):''):'—');
    h+=`<div class="row" style="flex-wrap:wrap;gap:8px;margin-top:10px"><button class="pri" onclick="motOleoModal('${x.id}','baixa')">✔ Dar baixa na troca de óleo</button><button class="sec" onclick="motOleoModal('${x.id}','etiqueta')">✎ Informar etiqueta</button><button class="ghost" onclick="motOleoModal('${x.id}','corrigir')">Corrigir km</button>${conf?`<button class="ghost" onclick="motOleoConferido('${x.id}')">✓ Marcar km como conferido</button>`:''}</div>`;
  } else {
    const pend=ks.find(k=>k.status==='confirmar');
    h+=row('Km no cadastro do veículo',v.km?fmtKm(v.km):'—')+(pend?row('Km informado pelo motorista (a confirmar)',fmtKm(pend.km)):'');

  h+=`<div class="muted" style="font-weight:700;margin:10px 0 2px">Histórico de km</div>${hist||'<div class="muted">Nenhum km informado ainda.</div>'}</div>`;
  return h;
}

function motOleoPrev(inter,acao){
  const n=v=>{ const t=String(val(v)).replace(/\D/g,''); return t?+t:0; }; const el=document.getElementById('ol_prev'); if(!el) return;
  if(acao==='baixa'){ const k=n('ol_km'); el.innerHTML=k?`Próxima troca será em <b>${fmtKm(k+inter)}</b> (+${fmtKm(inter).replace(' km','')}).`:''; }
  else if(acao==='iniciar'||acao==='etiqueta'){ const p=n('ol_prox'); el.innerHTML=p?`Última troca (calculada): <b>${fmtKm(Math.max(p-inter,0))}</b> · intervalo ${fmtKm(inter)}.`:''; }
  else el.innerHTML='';
}

function motTarefas(id){
  const T=[]; const lista=id?S.mots.filter(y=>y.id===id):S.mots.filter(y=>y.ativo!==false);

    for(const g of S.motAgend.filter(t=>t.motoristaId===i&&t.status==='solicitado')) T.push({k:'ag',pr:6,x,em:g.criadoEm,g});

async function motEnviarMsg(id){
  const t=document.getElementById('mot_txt'); const txt=(t&&t.value||'').trim(); if(!txt) return;
  try{ const sel=document.getElementById('mot_ass'); await motMsgEquipe(id,txt,sel&&sel.value); t.value=''; motRecarregar(); }
  catch(e){ erroSalvar('enviar a mensagem',e); }
}
// assuntos do chat do motorista (cada mensagem leva uma etiqueta; mensagens antigas sem etiqueta são deduzidas)
const MOT_ASSUNTOS={pagamento:['Pagamento','warn'],bloqueio:['Bloqueio','bad'],monitoramento:['Monitoramento','neu'],manutencao:['Manutenção','neu'],sinistro:['Sinistro','bad'],documentos:['Documentos','neu'],outros:['Outros','neu'],reserva:['Reserva','neu']};
function motAssuntoMsg(t){ if(t.assunto&&MOT_ASSUNTOS[t.assunto]) return t.assunto; if(t.tipo==='bloqueio') return 'bloqueio'; if(t.tipo==='promessa') return 'pagamento'; if(t.tipo==='agendamento') return 'manutencao'; const x=String(t.texto||''); if(x.startsWith('🧾')) return 'pagamento'; if(x.startsWith('🚗')) return 'reserva'; return ''; }
function motAssuntoPadrao(id){ const ms=(S.motMsgs||[]).filter(t=>t.motoristaId===id&&t.de==='motorista').sort((a,c)=>(c.em||'').localeCompare(a.em||'')); for(const t of ms){ const a=motAssuntoMsg(t); if(a&&a!=='reserva') return a; } return 'outros'; }
// ---- atendentes por setor: o motorista só vê o nome do setor do assunto, não importa quem responde de verdade ----
const MOT_SETORES={cobranca:'Cobrança',bloqueio:'Bloqueio',monitoramento:'Monitoramento',operacoes:'Operações'};
const MOT_SETOR_DE={pagamento:'cobranca',bloqueio:'bloqueio',monitoramento:'monitoramento',manutencao:'operacoes',sinistro:'operacoes',documentos:'operacoes',outros:'operacoes',reserva:'operacoes'};
const MOT_ATEND_PADRAO={cobranca:['Deivid','Rafaela'],bloqueio:['Jeferson','Camilo'],monitoramento:['Jeferson','Camilo'],operacoes:['Flávio']};
function motAtendentes(){ const c=S.motAtendCfg||{}; const o={}; for(const k of Object.keys(MOT_ATEND_PADRAO)){ const l=Array.isArray(c[k])?c[k].map(v=>String(v).trim()).filter(Boolean):[]; o[k]=l.length?l:MOT_ATEND_PADRAO[k]; } return o; }
function motHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }
function motAlias(id,assunto){ const setor=MOT_SETOR_DE[assunto]||'operacoes'; const l=motAtendentes()[setor]; return l[motHash(id+'|'+motDiaSP(agoraIso())+'|'+setor)%l.length]; }
function motAliasPrev(id){ const sel=document.getElementById('mot_ass'), el=document.getElementById('mot_alias_prev'); if(!sel||!el) return; el.innerHTML='Será enviado como: <b>'+esc(motAlias(id,sel.value))+'</b> · '+esc(MOT_SETORES[MOT_SETOR_DE[sel.value]||'operacoes']); }
async function motMsgEquipe(id,texto,assunto){
  const ass=assunto||motAssuntoPadrao(id); const setor=MOT_SETOR_DE[ass]||'operacoes';
  await S.db.collection('mot_mensagens').add({motoristaId:id,de:'equipe',autor:motAlias(id,ass),setor,enviadoPor:(S.perfil&&S.perfil.nome)||'',texto,assunto:ass,em:agoraIso(),lidaMotorista:false});
}
function motAtendModal(){

  abrir(`<h3>👥 Atendentes por setor</h3><p class="muted">O motorista vê só o nome do setor do assunto, não importa quem responde de verdade. Separe os nomes por vírgula; cada motorista fica com um nome por dia. Manutenção, Sinistro, Documentos e Outros usam o setor Operações.</p><div class="grid">
    ${Object.keys(MOT_SETORES).map(k=>`<div class="full"><label>${MOT_SETORES[k]}</label><input id="at_${k}" value="${esc(a[k].join(', '))}"></div>`).join('')}</div>
    <div class="act"><button class="sec" onclick="fechar()">Cancelar</button><button class="pri" onclick="motAtendSalvar()">Salvar</button></div>`);
}
async function motAtendSalvar(){
  const o={}; for(const k of Object.keys(MOT_SETORES)){ o[k]=val('at_'+k).split(',').map(v=>v.trim()).filter(Boolean); if(!o[k].length) o[k]=MOT_ATEND_PADRAO[k]; }
  try{ await S.db.doc('config/atendentes').set(o); S.motAtendCfg=o; fechar(); toast('Atendentes salvos'); render(); }catch(e){ erroSalvar('salvar os atendentes',e); }

// ---- pedidos do assunto Bloqueio ----
const MOT_PEDBLOQ={desbloqueio:'Já paguei: pediu desbloqueio',contestar:'Não concorda com o bloqueio',roubo:'🚨 VEÍCULO ROUBADO OU FURTADO',duvida:'Dúvida sobre bloqueio'};
const motBloqPend = id => (S.motMsgs||[]).filter(t=>t.motoristaId===id&&t.tipo==='bloqueio'&&t.status==='pendente');
function motPedBloqHtml(x){
  const ps=(S.motMsgs||[]).filter(t=>t.motoristaId===x.id&&t.tipo==='bloqueio').sort((a,c)=>(c.em||'').localeCompare(a.em||''));
  const st=(x.bloqueio||{}).status||'normal';
  if(!ps.length) return `<div class="step" id="sec_pedbloq" style="padding:10px 16px"><h3 style="margin:0;font-size:15px">🔒 Pedidos de bloqueio <span class="muted" style="font-weight:400">· nenhum</span></h3></div>`;
  const tagS={pendente:['Aguardando','warn'],atendido:['Atendido','ok'],recusado:['Recusado','bad'],respondido:['Respondido','ok']};
  return `<div class="step${motBloqPend(x.id).length?' hot':''}" id="sec_pedbloq"><h3>🔒 Pedidos de bloqueio</h3>${ps.map(p=>{ const s=tagS[p.status]||['—','neu']; const rb=p.pedidoTipo==='roubo';
    return `<div class="osrow" style="cursor:default;flex-wrap:wrap;${rb&&p.status==='pendente'?'border:2px solid var(--bad);':''}"><div style="flex:1;min-width:220px"><b${rb?' style="color:var(--bad)"':''}>${esc(MOT_PEDBLOQ[p.pedidoTipo]||'Pedido')}</b> <span class="tag ${s[1]}">${s[0]}</span> <span class="muted">${esc(motHora(p.em))}${p.placa?' · '+esc(p.placa):''}</span><div style="white-space:pre-wrap">${esc(String(p.texto||'').split('\n').slice(1).join('\n'))}</div>${p.resposta?`<div class="muted">Resposta: ${esc(p.resposta)}${p.respondidoPor?' (por '+esc(p.respondidoPor)+')':''}</div>`:''}</div>
      ${p.status==='pendente'?`<div class="row" style="flex-wrap:wrap">${rb?`<button class="pri" style="background:var(--bad)" onclick="motPedBloqAcao('${p.id}','bloquear')">Bloquear veículo agora</button>`:(st!=='normal'?`<button class="pri" onclick="motPedBloqAcao('${p.id}','liberar')">Liberar veículo</button>`:'')}<button class="sec" onclick="motPedBloqAcao('${p.id}','responder')">Responder</button>${rb?'':`<button class="ghost danger" onclick="motPedBloqAcao('${p.id}','recusar')">Recusar com motivo</button>`}</div>`:''}</div>`; }).join('')}</div>`;
}
function motPedBloqAcao(pid,acao){
  const p=S.motMsgs.find(t=>t.id===pid); if(!p) return;
  if(acao==='liberar') return motPedBloqFinal(pid,'liberar','');
  if(acao==='bloquear') return motPedBloqFinal(pid,'bloquear','');
  const tit=acao==='recusar'?'Recusar pedido (o motorista vê o motivo)':'Responder ao pedido';
  abrir(`<h3>${tit}</h3><div class="muted" style="margin-bottom:8px">${esc(MOT_PEDBLOQ[p.pedidoTipo]||'')}</div><label>${acao==='recusar'?'Motivo':'Resposta'}</label><textarea id="pb_txt" placeholder="${acao==='recusar'?'Ex.: Não identificamos o pagamento. Envie o comprovante.':'Escreva a resposta'}"></textarea>
    <div class="act"><button class="sec" onclick="fechar()">Cancelar</button><button class="pri" onclick="motPedBloqFinal('${pid}','${acao}',document.getElementById('pb_txt').value)">Enviar</button></div>`);
}
async function motPedBloqFinal(pid,acao,txt){
  const p=S.motMsgs.find(t=>t.id===pid); if(!p) return; txt=String(txt||'').trim();
  if((acao==='responder'||acao==='recusar')&&!txt){ toast('Escreva o texto'); return; }
  const por=(S.perfil&&S.perfil.nome)||''; const id=p.motoristaId; const x=S.mots.find(y=>y.id===id)||{};
  try{
    let msg='', status='atendido';
    if(acao==='liberar'){ await S.db.doc('motoristas/'+id).update({bloqueio:{status:'normal',motivo:'',data:'',em:agoraIso(),por}}); msg='Seu veículo foi liberado. Obrigado!'; }
    else if(acao==='bloquear'){ await S.db.doc('motoristas/'+id).update({bloqueio:{status:'bloqueado',motivo:'Bloqueio de emergência: veículo roubado ou furtado',data:'',em:agoraIso(),por}}); msg='Recebemos o seu aviso. O bloqueio de emergência foi solicitado. Se ainda não fez, ligue 190 e registre o B.O., depois envie o número por aqui.'; }
    else if(acao==='recusar'){ msg='Pedido não aceito. '+txt; status='recusado'; }

async function motAplicarBloqueio(id,o){

async function motSalvar(id){
  if(!id&&!motPodeCriar()){ toast('Só o administrador cadastra motorista novo.'); return; }
  const nome=val('mf_nome'), cpf=val('mf_cpf').replace(/\D/g,''), tel=val('mf_tel').replace(/\D/g,''), veicId=val('mf_veic'), ativo=document.getElementById('mf_ativo').checked;
  if(!nome){ toast('Informe o nome'); return; }
  if(!cpfValido(cpf)){ toast('CPF inválido'); return; }
  if(!veicId){ toast('Escolha o veículo: a senha do app é a placa'); return; }
  const ocupa=ativo?S.mots.find(m=>m.id!==id&&m.ativo!==false&&(m.veiculoId===veicId||(m.reserva&&m.reserva.veiculoId===veicId))):null;
  if(ocupa){ toast('Esta placa já está com '+ocupa.nome+(ocupa.veiculoId===veicId?'':' (carro reserva)')); return; }
  const v=S.veic.find(y=>y.id===veicId);
  const base=id?{...(S.mots.find(m=>m.id===id)||{})}:{criadoEm:agoraIso(),criadoPor:S.mecNome};
  const d={...base,nome,cpf,telefone:tel,veiculoId:veicId||'',placa:v?v.placa:'',ativo}; delete d.id;
  let docId=id;
  try{
    if(id) await S.db.doc('motoristas/'+id).set(d); else { const ref=await S.db.collection('motoristas').add(d); docId=ref.id; }
    const {data,error}=await sb.rpc('mot_salvar_acesso',{p_id:docId,p_cpf:cpf,p_senha:null});
    if(error) throw error;
    if(data&&data.erro){ toast(data.erro); if(!id) await S.db.doc('motoristas/'+docId).delete(); return; }
    if(!id&&S.candVirar){ try{ await candAtualizar(S.candVirar,{status:'virou',motoristaId:docId,viradoEm:agoraIso(),viradoPor:(S.perfil&&S.perfil.nome)||''}); }catch(e){ console.warn('candidato não marcado como motorista',e); } S.candVirar=''; S.candAtual=null; S.motAba='todos'; }
    fechar(); motRecarregar();
    if(!id) motAcessoWhats(nome,tel,cpf,v?v.placa:''); else toast('Motorista salvo');
  }catch(e){ erroSalvar('salvar o motorista',e); }
}

async function motEnviarAcesso(id){
  const x=S.mots.find(m=>m.id===id); if(!x) return;
  const wa=telWa(x.telefone);
  if(!wa){ toast('Cadastre o WhatsApp deste motorista para enviar o acesso.'); motForm(id); return; }
  if(!x.cpf){ toast('Este motorista está sem CPF cadastrado.'); motForm(id); return; }
  if(!x.placa){ toast('Escolha o veículo do motorista: a senha do app é a placa.'); motForm(id); return; }
  waAbrir('https://wa.me/'+wa+'?text='+encodeURIComponent(motMsgAcesso(x.nome,x.cpf,x.placa)),'_blank');
  try{ const em=agoraIso(); await S.db.doc('motoristas/'+id).update({acessoEnviadoEm:em}); x.acessoEnviadoEm=em; render(); }catch(e){ console.warn('não marcou o acesso como enviado',e); }

}
// ============ importar planilha (motoristas + placas) ============
// Lê o .xlsx (ou .csv) com as colunas: Nome, CPF, WhatsApp, Placa, Modelo, Ano, Km atual do painel,
// Km da próxima troca (etiqueta), Situação. Mostra uma prévia e só grava depois da confirmação.
let impLinhas=[], impRes=[];
const impNorm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function impCsv(txt){
  txt=String(txt).replace(/^﻿/,''); const l1=txt.split(/\r?\n/)[0]||'';
  const sep=(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?';':',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function impCarregarXlsx(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((ok,err)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=ok;
    s.onerror=()=>err(new Error('Não consegui carregar o leitor de Excel. Baixe a planilha como CSV e tente de novo.')); document.head.appendChild(s); });
}
function impMapa(cab){
  const m={};
  cab.forEach((c,i)=>{ const t=impNorm(c);
    if(t==='nome') m.nome=i; else if(t==='cpf') m.cpf=i;
    else if(t==='whatsapp'||t==='telefone'||t==='celular') m.tel=i;
    else if(t==='placa') m.placa=i; else if(t==='modelo'||t==='veiculo') m.modelo=i; else if(t==='ano') m.ano=i;
    else if(t.startsWith('km atual')) m.km=i;
    else if(t.startsWith('km da proxima')||t.startsWith('km proxima')||t.includes('proxima troca')) m.prox=i;
    else if(t==='situacao'||t==='status') m.sit=i; });
  return m;
}
const impStatus = (sit,temMot) => { const t=impNorm(sit);
  if(/alug|locad/.test(t)) return 'Locado'; if(/vag|dispon/.test(t)) return 'Disponível'; if(/manut/.test(t)) return 'Em manutenção';
  if(/sinistr/.test(t)) return 'Sinistrado'; if(/baix/.test(t)) return 'Baixado'; return temMot?'Locado':''; };
function impMontar(tab){
  const h=tab.findIndex(r=>(r||[]).some(c=>impNorm(c)==='placa')); if(h<0) return null;
  const m=impMapa(tab[h]); const linhas=[]; const cpfVisto={}, placaVista={};
  for(let i=h+1;i<tab.length;i++){
    const r=tab[i]||[]; const g=k=>m[k]==null?'':String(r[m[k]]==null?'':r[m[k]]).trim();
    const placa=normPlaca(g('placa')), nome=g('nome'); if(!placa&&!nome) continue;
    const num=k=>{ const t=g(k).replace(/\D/g,''); return t?+t:0; };
    const l={n:i+1,nome,cpf:g('cpf').replace(/\D/g,''),tel:g('tel').replace(/\D/g,''),placa,modelo:g('modelo'),ano:g('ano'),km:num('km'),prox:num('prox'),sit:g('sit'),erros:[],avisos:[],acoes:[],principal:true,padrao:true};
    if(!placa) l.erros.push('Sem placa');
    else if(!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(placa)) l.erros.push('Placa inválida');
    else if(placaVista[placa]) l.erros.push('Placa repetida na planilha (linha '+placaVista[placa]+')');
    else placaVista[placa]=l.n;
    if(nome||l.cpf){
      if(!nome) l.erros.push('Sem nome'); else if(!cpfValido(l.cpf)) l.erros.push('CPF inválido');
      else if(cpfVisto[l.cpf]){ l.principal=false; l.avisos.push('2ª placa deste motorista: só o veículo é cadastrado (a placa principal é a da linha '+cpfVisto[l.cpf]+')'); }
      else cpfVisto[l.cpf]=l.n;
    }
    linhas.push(l);
  }
  return linhas;
}
function impAnalisar(linhas){
  for(const l of linhas){
    if(l.erros.length) continue;
    const v=S.veic.find(x=>x.placa===l.placa); l.v=v||null;
    const temMot=!!l.nome; l.status=impStatus(l.sit,temMot);
    if(!v) l.acoes.push('Criar veículo'); else { const mud=[]; if(l.modelo&&l.modelo!==v.modelo) mud.push('modelo'); if(l.ano&&l.ano!==String(v.ano||'')) mud.push('ano'); if(l.status&&l.status!==v.status) mud.push('situação'); if(mud.length) l.acoes.push('Atualizar '+mud.join(', ')); }
    if(temMot&&l.principal){
      const ex=S.mots.find(m=>m.cpf===l.cpf); l.ex=ex||null;
      const ocupa=v?S.mots.find(m=>m.cpf!==l.cpf&&m.ativo!==false&&(m.veiculoId===v.id||(m.reserva&&m.reserva.veiculoId===v.id))):null;
      if(ocupa) l.erros.push('Esta placa já está com '+ocupa.nome);
      else if(!ex) l.acoes.push('Criar motorista + acesso');
      else if(ex.veiculoId&&v&&ex.veiculoId!==v.id){ const antes=S.veic.find(x=>x.id===ex.veiculoId); l.padrao=false; l.acoes.push('Trocar a placa principal de '+ex.nome+(antes?' ('+antes.placa+')':'')); }
      else if(!ex.veiculoId||!v||ex.veiculoId===v.id){ if(ex.veiculoId!==(v&&v.id)) l.acoes.push('Vincular placa ao motorista existente'); else l.acoes.push('Motorista já cadastrado'); }
    }
    if(l.km||l.prox){
      const base=v&&v.oleo&&v.oleo.base===true;
      if(base) l.avisos.push('Km e etiqueta deste veículo já foram iniciados: ignorados');
      else if(l.km&&l.prox){ l.acoes.push('Iniciar km e etiqueta'); l.iniciar=true; }
      else if(l.km){ l.acoes.push('Atualizar km'); }
      else l.avisos.push('Falta o km atual para iniciar a etiqueta: ignorado');
    }
    if(!l.acoes.length) l.acoes.push('Sem mudança');
  }
  return linhas;
}
function impAbrir(){
  if(!motPodeCriar()){ toast('Só o administrador importa motoristas.'); return; }
  impLinhas=[]; impRes=[];
  abrir(`<h3>📥 Importar planilha</h3>
    <p class="muted">Escolha a planilha (.xlsx ou .csv) com as colunas <b>Nome, CPF, WhatsApp, Placa, Modelo, Ano, Km atual do painel, Km da próxima troca (etiqueta), Situação</b>. Antes de gravar, você vê uma prévia de tudo que vai ser criado ou alterado.</p>
    <input type="file" id="imp_file" accept=".xlsx,.xls,.xlsm,.csv,text/csv" onchange="impLer(this)">
    <div id="imp_prev"><div class="act"><button class="sec" onclick="fechar()">Cancelar</button></div></div>`);
  document.getElementById('md').style.maxWidth='980px';
}
async function impLer(inp){
  const f=inp.files&&inp.files[0]; if(!f) return; const box=document.getElementById('imp_prev'); box.innerHTML='<div class="muted" style="margin:10px 0">Lendo a planilha…</div>';
  try{
    let tab;
    if(/\.(xlsx|xlsm|xls)$/i.test(f.name)){ await impCarregarXlsx(); const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}); tab=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}); }
    else tab=impCsv(await f.text());
    const linhas=impMontar(tab);
    if(!linhas){ box.innerHTML='<div class="alert warn" style="margin:10px 0">Não achei a coluna <b>Placa</b>. Confira se a primeira linha da planilha é o cabeçalho.</div>'; return; }
    if(!linhas.length){ box.innerHTML='<div class="alert warn" style="margin:10px 0">A planilha não tem nenhuma linha com placa ou nome.</div>'; return; }
    impLinhas=impAnalisar(linhas); impPrevia();
  }catch(e){ box.innerHTML='<div class="alert warn" style="margin:10px 0">'+esc(e.message||String(e))+'</div>'; }
}
function impPrevia(){
  const L=impLinhas, ok=L.filter(l=>!l.erros.length), err=L.length-ok.length;
  const novosM=ok.filter(l=>l.acoes.includes('Criar motorista + acesso')).length, novosV=ok.filter(l=>l.acoes.includes('Criar veículo')).length;
  let h=`<div class="muted" style="margin:10px 0"><b>${L.length}</b> linha(s): ${novosM} motorista(s) novo(s), ${novosV} veículo(s) novo(s)${err?`, <span style="color:var(--bad,#c0392b)"><b>${err}</b> com erro (não serão importadas)</span>`:''}.</div>
  <div class="tbl" style="max-height:52vh;overflow:auto"><table style="font-size:13px"><tr><th></th><th>Motorista</th><th>Placa e veículo</th><th>O que vai acontecer</th></tr>`;
  for(const l of L){
    const chk=l.erros.length?'disabled':(l.padrao?'checked':'');
    const acoes=l.acoes.map(a=>`<span class="tag ${/Criar|Iniciar|Trocar|Vincular/.test(a)?'ok':'neu'}" style="white-space:normal;margin:1px 2px 1px 0">${esc(a)}</span>`).join(' ');
    const msgs=[...l.erros.map(e=>`<div style="color:var(--bad,#c0392b);font-size:12px">⛔ ${esc(e)}</div>`),...l.avisos.map(a=>`<div class="muted" style="font-size:12px">⚠ ${esc(a)}</div>`)].join('');
    h+=`<tr><td style="width:28px"><input type="checkbox" id="imp_${l.n}" ${chk} style="width:auto"></td>
      <td>${l.nome?`<b>${esc(l.nome)}</b><div class="muted" style="font-size:12px">${esc(l.cpf?mascaraCpf(l.cpf):'')}${l.tel?' · '+esc(l.tel):''}</div>`:'<span class="muted">— sem motorista (vago) —</span>'}</td>
      <td><b>${esc(l.placa||'—')}</b><div class="muted" style="font-size:12px">${esc([l.modelo,l.ano].filter(Boolean).join(' · ')||'—')}${l.sit?' · '+esc(l.sit):''}</div></td>
      <td>${l.erros.length?'':acoes}${msgs}<div class="muted" style="font-size:11px">linha ${l.n}</div></td></tr>`;
  }
  h+=`</table></div><div class="muted sm" style="margin-top:6px">A senha de cada motorista novo é a placa principal dele. Linhas sem nome criam só o veículo (vago). Linhas desmarcadas são ignoradas.</div>
  <div class="act"><button class="sec" onclick="fechar()">Cancelar</button><button class="pri" id="imp_go" onclick="impExecutar()">Importar</button></div>`;
  document.getElementById('imp_prev').innerHTML=h;
}
async function impExecutar(){
  if(!motPodeCriar()){ toast('Só o administrador importa motoristas.'); return; }
  const sel=impLinhas.filter(l=>!l.erros.length&&(document.getElementById('imp_'+l.n)||{}).checked);
  if(!sel.length){ toast('Nenhuma linha marcada'); return; }
  const go=document.getElementById('imp_go'); if(go){ go.disabled=true; go.textContent='Importando…'; }
  const res={veic:0,atu:0,novos:[],vinc:0,km:0,falhas:[],avisos:[]}; impRes=res.novos;
  for(const l of sel){
    try{
      let v=S.veic.find(x=>x.placa===l.placa);
      if(!v){
        const nv={placa:l.placa,modelo:l.modelo||'(a definir)',ano:l.ano,empresa:'',km:l.km||0,status:l.status||'Disponível'};
        const ref=await S.db.collection('veiculos').add(nv); v={id:ref.id,...nv}; S.veic.push(v); res.veic++;
      } else {
        const up={}; if(l.modelo&&l.modelo!==v.modelo) up.modelo=l.modelo; if(l.ano&&l.ano!==String(v.ano||'')) up.ano=l.ano; if(l.status&&l.status!==v.status) up.status=l.status;
        const base=v.oleo&&v.oleo.base===true; if(l.km&&!l.iniciar&&!base&&l.km!==v.km) up.km=l.km;
        if(Object.keys(up).length){ await S.db.doc('veiculos/'+v.id).update(up); Object.assign(v,up); res.atu++; }
      }
      if(l.nome&&l.principal){
        const ex=S.mots.find(m=>m.cpf===l.cpf);
        if(!ex){
          const d={nome:l.nome,cpf:l.cpf,telefone:l.tel,veiculoId:v.id,placa:v.placa,ativo:true,criadoEm:agoraIso(),criadoPor:S.mecNome};
          const ref=await S.db.collection('motoristas').add(d);
          const {data,error}=await sb.rpc('mot_salvar_acesso',{p_id:ref.id,p_cpf:l.cpf,p_senha:null});
          if(error||(data&&data.erro)){ await S.db.doc('motoristas/'+ref.id).delete(); throw (error||new Error(data.erro)); }
          res.novos.push({nome:l.nome,cpf:l.cpf,tel:l.tel,placa:v.placa});
        } else if(ex.veiculoId!==v.id){
          const d={...ex,telefone:ex.telefone||l.tel,veiculoId:v.id,placa:v.placa}; delete d.id;
          await S.db.doc('motoristas/'+ex.id).set(d); res.vinc++;
        }
      }
      if(l.iniciar){
        const {data,error}=await sb.rpc('mot_oleo_staff',{p_veiculo_id:v.id,p_acao:'iniciar',p_km:l.km,p_proxima:l.prox,p_data:null,p_motivo:null});
        if(error) throw error; if(data&&data.erro) res.avisos.push(l.placa+': '+data.erro); else res.km++;
      }
    }catch(e){ res.falhas.push((l.nome||l.placa)+' (linha '+l.n+'): '+((e&&e.message)||e)); }
  }
  try{ await motRecarregar(); }catch(e){}
  impResultado(res);
}
function impMsgAcesso(m){ return motMsgAcesso(m.nome,m.cpf,m.placa); }
function impWa(i){ const m=impRes[i]; const wa=m&&telWa(m.tel); if(wa) waAbrir('https://wa.me/'+wa+'?text='+encodeURIComponent(impMsgAcesso(m)),'_blank'); }
function impResultado(r){
  const linhas=[`${r.novos.length} motorista(s) criado(s)`,`${r.veic} veículo(s) novo(s)`,r.atu?`${r.atu} veículo(s) atualizado(s)`:'',r.vinc?`${r.vinc} placa(s) trocada(s)/vinculada(s)`:'',r.km?`${r.km} veículo(s) com km e etiqueta iniciados`:''].filter(Boolean);
  abrir(`<h3>Importação concluída</h3><p>${linhas.map(esc).join(' · ')}.</p>
    ${r.falhas.length?`<div class="alert warn" style="margin:8px 0"><b>Não deu certo:</b><br>${r.falhas.map(esc).join('<br>')}</div>`:''}
    ${r.avisos.length?`<div class="muted" style="margin:8px 0">⚠ ${r.avisos.map(esc).join('<br>⚠ ')}</div>`:''}
    ${r.novos.length?`<div class="muted" style="margin:10px 0 4px"><b>Enviar o acesso por WhatsApp</b> (login = CPF, senha = placa):</div>${r.novos.map((m,i)=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><span>${esc(m.nome)} · <b>${esc(m.placa)}</b></span><span class="sp"></span>${telWa(m.tel)?`<button class="sec" onclick="impWa(${i})">💬 Enviar</button>`:'<span class="muted sm">sem WhatsApp</span>'}</div>`).join('')}`:''}
    <div class="act"><button class="pri" onclick="fechar()">Fechar</button></div>`);
}

async function motApagar(id){
  if(!motPodeExcluir()){ toast('Só o administrador geral (master) exclui motorista.'); return; }
  const x=S.mots.find(m=>m.id===id); if(!x) return;
  if(!confirm(`Excluir o motorista ${x.nome}? O acesso dele ao app é removido (as mensagens antigas ficam no banco).`)) return;
  try{ await S.db.doc('motoristas/'+id).delete(); S.motAtual=null; S.mots=S.mots.filter(m=>m.id!==id); fechar(); toast('Motorista excluído'); motRecarregar(); render(); }catch(e){ erroSalvar('excluir o motorista',e); }
}
// excluir a PLACA (veículo da frota) a partir da ficha do motorista: só o master; as OS e o histórico ficam
async function motApagarPlaca(id){
  if(!motPodeExcluir()){ toast('Só o administrador geral (master) exclui placa.'); return; }
  const x=S.mots.find(m=>m.id===id); const v=x&&S.veic.find(y=>y.id===x.veiculoId); if(!x||!v){ toast('Este motorista não tem placa principal.'); return; }
  const outro=motEmUso(v,x.id); if(outro){ toast('A placa '+v.placa+' também está com '+outro.nome+(outro.veiculoId===v.id?'':' (carro reserva)')+'. Troque a placa dele antes.'); return; }
  if(!confirm(`Excluir a placa ${v.placa} (${v.modelo||''}) da frota?\n\n${x.nome} fica sem veículo e sem acesso ao app até você escolher outra placa. As OS e o histórico da placa ficam guardados. Isso não pode ser desfeito.`)) return;
  try{
    await S.db.doc('motoristas/'+id).update({veiculoId:'',placa:'',reserva:null});
    await S.db.doc('veiculos/'+v.id).delete();
    S.veic=S.veic.filter(y=>y.id!==v.id); toast('Placa '+v.placa+' excluída'); motRecarregar(); render();
  }catch(e){ erroSalvar('excluir a placa',e); }
}

// ============ boot ============
function subCol(col,key){ S.db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>{ document.getElementById('status').textContent='Erro: '+e.code; }); }
// busca, pra todas as placas conhecidas, o histórico técnico registrado em OUTRAS oficinas (via
// RPC historico_compartilhado do banco — nunca traz valor nem quem atendeu). Se a migração do
// banco ainda não foi aplicada, falha em silêncio e o app continua funcionando sem esse extra.
async function carregarHistoricoCompartilhado(){
  const placas=[...new Set(S.veic.map(v=>v.placa).filter(Boolean))];
  if(!placas.length){ S.histCompartilhado=[]; render(); return; }
  try{
    const {data,error}=await sb.rpc('historico_compartilhado',{p_placas:placas});
    if(error) throw error;
    S.histCompartilhado=(data||[]).map(r=>({id:r.id,placa:r.placa,veiculoId:r.veiculo_id,data:r.data_intervencao,km:+r.km||0,itens:r.itens||[],status:r.status,oficina:r.oficina||'',externo:true}));
  }catch(e){ console.warn('historico_compartilhado indisponível (rode a migração do banco):',e); }
  render();
}
// placa nova (ainda sem veículo cadastrado aqui) digitada na tela de Nova OS: consulta avulsa,
// na hora, pra ver se já existe histórico técnico dessa placa vindo de outra oficina — sem isso,
// só placas já cadastradas localmente entrariam na busca em lote de carregarHistoricoCompartilhado
let placaChecada=null;
async function checarPlacaExterna(p){
  if(placaChecada===p) return;
  placaChecada=p;
  try{
    const {data,error}=await sb.rpc('historico_compartilhado',{p_placas:[p]});
    if(error) throw error;
    const novos=(data||[]).map(r=>({id:r.id,placa:r.placa,veiculoId:r.veiculo_id,data:r.data_intervencao,km:+r.km||0,itens:r.itens||[],status:r.status,oficina:r.oficina||'',externo:true}));
    if(novos.length){
      const idsExistentes=new Set(S.histCompartilhado.map(h=>h.id));
      S.histCompartilhado=[...S.histCompartilhado,...novos.filter(n=>!idsExistentes.has(n.id))];
      if(normPlaca(nova.placa)===p) chkPlaca();
    }
  }catch(e){ console.warn('consulta de placa externa indisponível:',e); }
}
if(location.hash.startsWith('#mecanico')){ S.mec=true; S.view='mnova'; }
S.db=mkDb(); S.assets=mkAssets(); S.cfg=JSON.parse(JSON.stringify(DEF_CFG)); S.mecsOk=true;
render();
// (o ícone padrão já está fixo no <head> deste HTML — aplicarIconeApp() só roda depois do login,
// pra trocar pelo personalizado da oficina quando ela tiver logo próprio)
// registra o service worker (arquivo sw.js, precisa estar na mesma pasta deste index.html no
// repositório) — é o que faz o Chrome/Android reconhecer o site como instalável de verdade e criar
// um ícone de app no celular, em vez de só um atalho de navegador. Se o arquivo não existir ainda
// (ex: versão antiga do repositório, upload do sw.js esquecido), falha em silêncio e o sistema
// continua funcionando normalmente, só sem a instalação "completa".
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('service worker não registrado (confira se sw.js foi enviado junto):',e));
  });
}
(async()=>{
  const st=document.getElementById('status');
  if(SUPABASE_URL.startsWith('COLE_')){ st.textContent='Configure SUPABASE_URL e SUPABASE_ANON_KEY no index.html'; return; }
  st.textContent='Sincronizado';
  const {data:{session}}=await sb.auth.getSession();
  S.db.doc('config/geral').onSnapshot(s=>{ S.cfg=s.exists?{...DEF_CFG,...s.data()}:JSON.parse(JSON.stringify(DEF_CFG)); render(); });
  S.db.collection('veiculos').onSnapshot(snap=>{ S.veic=snap.docs.map(d=>({id:d.id,...d.data()})); render(); carregarHistoricoCompartilhado(); }, e=>{ document.getElementById('status').textContent='Erro: '+e.code; });
  subCol('os','os'); subCol('sinistros','sin'); subCol('pecas','pecas'); subCol('perfis','mecs');
  // "oficinas" só existe depois da migração do banco — falha em silêncio até lá, sem derrubar o status
  S.db.collection('oficinas').onSnapshot(snap=>{ S.oficinas=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>{ console.warn('tabela "oficinas" indisponível (rode a migração do banco):',e); });
  // se for link de recuperação de senha, o listener registrado logo após criar o "sb" (acima, no
  // topo do arquivo) já capturou o evento PASSWORD_RECOVERY e está tratando a troca de senha —
  // não chamamos carregarSessao aqui de novo para não duplicar o fluxo.
  if(!S_recuperando) await carregarSessao(session);
})();
