<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carsz · Controle de Manutenção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f3f4f0; --panel:#ffffff; --ink:#1b1f24; --muted:#5d6570; --line:#d9dcd6;
  --brand:#2563eb; --brand-ink:#ffffff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --ok-bg:#dcfce7; --warn-bg:#fef3c7; --bad-bg:#fde2e2; --soft:#eef0f2; --mec:#0d9488; --gestao:#7c3aed;
  --whats:#1fae5a; --pix:#db2777;
  --btn-sh:0 1px 0 rgba(255,255,255,.5) inset,0 2px 0 rgba(0,0,0,.12),0 3px 6px rgba(0,0,0,.16);
  --btn-sh-sm:0 1px 0 rgba(255,255,255,.5) inset,0 1px 0 rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --panel:#1e2228; --ink:#e8eaed; --muted:#9aa3ad; --line:#333a42;
    --brand:#3b82f6; --brand-ink:#ffffff; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --ok-bg:#153a2a; --warn-bg:#3a2d10; --bad-bg:#3a1b1b; --soft:#262b32; --mec:#14b8a6; --gestao:#9d5fe0;
    --whats:#30d874; --pix:#ec4899;
    --btn-sh:0 1px 0 rgba(255,255,255,.08) inset,0 2px 0 rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.4);
    --btn-sh-sm:0 1px 0 rgba(255,255,255,.06) inset,0 1px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1e2228; --ink:#e8eaed; --muted:#9aa3ad; --line:#333a42;
  --brand:#3b82f6; --brand-ink:#ffffff; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --ok-bg:#153a2a; --warn-bg:#3a2d10; --bad-bg:#3a1b1b; --soft:#262b32; --mec:#14b8a6; --gestao:#9d5fe0;
  --whats:#30d874; --pix:#ec4899;
  --btn-sh:0 1px 0 rgba(255,255,255,.08) inset,0 2px 0 rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.4);
  --btn-sh-sm:0 1px 0 rgba(255,255,255,.06) inset,0 1px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--brand);color:var(--brand-ink);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header #hdrLogo{height:32px;width:32px;object-fit:contain;border-radius:6px;background:#fff;padding:2px;display:none}
body.mec header{background:var(--mec)}
body.ofgestao header{background:var(--gestao)}
header h1{margin:0;font:700 21px/1 "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;letter-spacing:.3px}
header .sub{opacity:.8;font-size:13px}
#status{margin-left:auto;font-size:12px;opacity:.85}
header .lnk{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:9px 14px;min-height:40px;font:600 13px "IBM Plex Sans";cursor:pointer;transition:background .12s ease,transform .06s ease}
header .lnk:hover{background:rgba(255,255,255,.34)}
header .lnk:active{transform:translateY(1px)}
header .lnk.on{background:#fff;color:var(--gestao);font-weight:700;border-color:#fff}
nav{display:flex;gap:4px;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;overflow-x:auto}
nav button{background:none;border:0;border-radius:8px;padding:12px 16px;min-height:44px;font:600 14px "IBM Plex Sans";color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .12s ease,color .12s ease}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{color:var(--brand);background:var(--soft);box-shadow:inset 0 -3px 0 var(--brand)}
body.mec nav button.on{color:var(--mec);box-shadow:inset 0 -3px 0 var(--mec)}
body.ofgestao nav button.on{color:var(--gestao);box-shadow:inset 0 -3px 0 var(--gestao)}
nav button .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-left:6px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
main{padding:18px 20px;max-width:1200px;margin:0 auto}
body.mec main{max-width:720px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0;font:600 18px "IBM Plex Sans"}
.sp{flex:1}
button.pri,button.sec,button.ghost,button.big,button.whats,button.pix,button.warnbtn{border-radius:8px;padding:11px 18px;min-height:44px;font:600 14px "IBM Plex Sans";cursor:pointer;border:1px solid transparent;transition:transform .06s ease,box-shadow .06s ease,background .12s ease,filter .12s ease}
button.pri,button.big,button.whats,button.pix{box-shadow:var(--btn-sh)}
button.pri:hover,button.big:hover,button.whats:hover,button.pix:hover{filter:brightness(1.08)}
button.pri:active,button.big:active,button.whats:active,button.pix:active{transform:translateY(2px);box-shadow:none}
button.pri{background:var(--brand);color:var(--brand-ink)}
body.mec button.pri{background:var(--mec)}
body.ofgestao button.pri{background:var(--gestao)}
button.sec{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:var(--btn-sh-sm)}
button.sec:hover{background:var(--soft)}
button.sec:active{transform:translateY(1px);box-shadow:none}
button.ghost{background:var(--soft);color:var(--muted);padding:9px 14px;min-height:40px}
button.ghost:hover{background:var(--line);color:var(--ink)}
button.ghost:active{transform:translateY(1px)}
button.danger{color:var(--bad)}
button.ghost.danger:hover{background:var(--bad-bg);color:var(--bad)}
/* botões de intenção: qualquer ação que abre o WhatsApp é verde; Pix é rosa/magenta (não se confunde
   com mais nada); "sair" usa o mesmo âmbar já usado na tag de "OS Aberta", avisando que ainda está em andamento */
button.whats{background:var(--whats);color:#fff}
button.pix{background:var(--pix);color:#fff}
button.warnbtn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);box-shadow:none}
button.warnbtn:hover{filter:brightness(1.1)}
button.warnbtn:active{transform:translateY(1px)}
button.big{width:100%;padding:18px;font-size:18px;font-weight:700;background:var(--mec);color:#fff;border-radius:10px;margin-bottom:10px}
body.mec button.big{background:var(--mec)}
body.ofgestao button.big{background:var(--gestao)}
button.big.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default;filter:none!important;box-shadow:none!important;transform:none!important}
@media (max-width:600px){button.pri,button.sec,button.ghost{padding:12px 16px}}
input,select,textarea{font:15px "IBM Plex Sans";padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
input.xl{font-size:26px;font-weight:600;text-align:center;letter-spacing:2px;padding:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card .v{font:700 30px/1 "IBM Plex Sans Condensed",sans-serif}
.card .l{color:var(--muted);font-size:13px;margin-top:6px}
.card.bad .v{color:var(--bad)} .card.warn .v{color:var(--warn)} .card.ok .v{color:var(--ok)}
.tbl{width:100%;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.neu{background:var(--soft);color:var(--muted)}
.plate{font:600 14px "IBM Plex Sans Condensed",monospace;letter-spacing:1px;background:var(--soft);padding:2px 6px;border-radius:4px;white-space:nowrap}
.plate.lg{font-size:17px;padding:3px 8px}
.cliente-badge{font:600 13px "IBM Plex Sans",system-ui,sans-serif;background:var(--soft);color:var(--ink);padding:3px 8px;border-radius:4px;white-space:nowrap}
.empty{padding:36px;text-align:center;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
.ov.on{display:flex}
.md{background:var(--panel);border-radius:10px;width:100%;max-width:680px;padding:20px;border:1px solid var(--line)}
.md h3{margin:0 0 14px;font:600 18px "IBM Plex Sans"}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.act{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.calc{background:var(--soft);padding:10px 12px;border-radius:6px;font-size:13px;margin-top:8px}
@media (max-width:600px){
  .grid{grid-template-columns:1fr} main{padding:12px}
  /* celular: ações viram uma lista vertical, sempre na mesma ordem — texto informativo em cima,
     ação principal (concluir/reabrir), depois sair, e a destrutiva (excluir) isolada por último */
  .act{flex-direction:column;align-items:stretch;gap:8px}
  .act .muted{order:-1;text-align:left;margin-bottom:2px}
  .act .sp{display:none}
  .act button{width:100%;order:1;margin:0}
  .act button.pri,.act button.big,.act button.whats,.act button.pix{order:0}
  .act button.ghost.danger{order:2;margin-top:4px}
}
.alertlist{display:grid;gap:8px;margin-bottom:18px}
.al{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.al.bad{border-left-color:var(--bad)}
h4{margin:18px 0 8px;font:600 15px "IBM Plex Sans"}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;display:none;z-index:30}
.plan-item{display:grid;grid-template-columns:1fr 100px 100px 40px;gap:8px;align-items:center;margin-bottom:6px}
.tier-item{display:grid;grid-template-columns:110px 110px 1fr;gap:8px;align-items:center;margin-bottom:6px}
/* timeline (histórico por placa) */
.tl{position:relative;padding-left:22px;margin-top:6px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ev{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.ev:before{content:"";position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--bg)}
.ev.open:before{background:var(--warn)}
.ev.sin:before{background:var(--bad)}
.ev .hd{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.ev .hd b{font-size:15px}
.ev ul{margin:8px 0 0;padding-left:18px}
.ev li{margin:2px 0}
.ev .rel{margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:6px;font-size:14px;white-space:pre-wrap}
.ph{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ph img{height:64px;border-radius:8px;border:2px solid var(--line);object-fit:cover;cursor:pointer;transition:border-color .12s ease,transform .06s ease}
.ph img:hover{border-color:var(--brand)}
.ph img:active{transform:scale(.96)}
/* mecânico */
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.step h3{margin:0 0 10px;font:600 17px "IBM Plex Sans"}
/* zona clara: a parte onde a OS é montada (peças + mão de obra) fica sempre com fundo claro, mesmo
   com o app no modo escuro — destaca visualmente a OS que está sendo construída */
.step.zona-clara{
  --bg:#f3f4f0; --panel:#ffffff; --ink:#1b1f24; --muted:#5d6570; --line:#d9dcd6; --soft:#eef0f2;
  --ok-bg:#dcfce7; --ok:#16a34a; --warn-bg:#fef3c7; --warn:#d97706;
  background:#fff; color:#1b1f24; border:2px solid #2563eb55; box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.shot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:520px){.shot{grid-template-columns:1fr}}
.shot label.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:10px;padding:16px 8px;cursor:pointer;color:var(--ink);font-size:15px;text-align:center;min-height:110px;background:var(--bg);transition:border-color .12s ease,background .12s ease}
.shot label.btn:hover{border-color:var(--brand);background:var(--soft)}
.shot label.btn.done{border-style:solid;border-color:var(--ok)}
.shot label.btn img{max-height:90px;max-width:100%;border-radius:6px}
.shot label.btn input{display:none}
.sug{position:relative}
.sug .list{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:0 0 8px 8px;z-index:5;max-height:220px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.sug .list div{padding:12px 14px;min-height:44px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .1s ease}
.sug .list div:hover,.sug .list div.hl{background:var(--soft)}
.sug .list div:active{background:var(--line)}
.sug .list small{display:block;color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px}
.item .nm{flex:1}
.item .nm b{font-size:15px}
.item .qt{background:var(--soft);color:var(--ink);font-weight:700;font-size:13px;padding:3px 9px;border-radius:12px;white-space:nowrap}
.item .vl{font-weight:700;color:var(--ok);font-size:15px;white-space:nowrap;min-width:64px;text-align:right}
.lastinfo{padding:8px 10px;border-radius:6px;font-size:13px;margin:6px 0;background:var(--warn-bg);color:var(--warn)}
.lastinfo.ok{background:var(--ok-bg);color:var(--ok)}
.lastinfo.neu{background:var(--soft);color:var(--muted)}
.osrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease,transform .06s ease}
.osrow:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.osrow:active{transform:translateY(1px)}
.osrow .osactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.osrow .tag{font-size:12px}
/* botões de ação da OS (Imprimir, Cobrar, Marcar como pago): relevo nítido para não parecerem texto */
.osactions button{font-size:13px;font-weight:700;padding:9px 14px;min-height:40px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  box-shadow:var(--btn-sh-sm);
  transition:transform .06s ease,box-shadow .06s ease,filter .12s ease}
.osactions button:hover{filter:brightness(1.06)}
.osactions button:active{transform:translateY(2px);box-shadow:none}
.osactions button.cobrar{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.osactions button.pago-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.osactions button.pago-pend{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
@media (max-width:640px){.osrow .osactions{margin-left:0;width:100%;justify-content:flex-start;padding-top:8px;border-top:1px solid var(--line)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:40;cursor:pointer}
.lightbox.on{display:flex}.lightbox img{max-width:96vw;max-height:94vh;border-radius:8px}
/* relatórios: mini gráficos de barra em CSS puro */
.barchart{display:grid;gap:8px;margin-bottom:18px}
.brow{display:grid;grid-template-columns:74px 1fr 96px;gap:8px;align-items:center}
.brow .blabel{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .blabel.plate{font:600 13px "IBM Plex Sans Condensed",monospace;color:var(--ink);background:none;padding:0;letter-spacing:1px}
.btrack{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.bfill{background:var(--brand);height:100%;border-radius:4px;min-width:2px}
.bfill.warn{background:var(--warn)}
.bval{font-size:12px;text-align:right;white-space:nowrap;color:var(--ink)}
@media (max-width:520px){.brow{grid-template-columns:56px 1fr 76px}}
</style>
</head>
<body>
<header>
  <img id="hdrLogo" alt="Logo da oficina">
  <h1 id="ttl">CARSZ · Manutenção da frota</h1>
  <span class="sub" id="subttl">Controle de revisões, custos e sinistros</span>
  <span id="status">Conectando…</span>
  <button class="lnk" id="qrBtn" onclick="abrirQrAcesso()" title="Abrir esta oficina no celular">📱</button>
  <button class="lnk" id="gBtn" onclick="toggleGestaoOficina()">Modo gestão</button>
  <button class="lnk" id="modeBtn" onclick="toggleMode()">Modo mecânico</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="ov" id="ov" onclick="if(event.target===this)fechar()"><div class="md" id="md"></div></div>
<div class="lightbox" id="lb" onclick="this.classList.remove('on')"><img id="lbimg"></div>
<div class="toast" id="toast"></div>

<script>
// ============ estado ============
// ===================== CONFIGURAÇÃO (preencher) =====================
const SUPABASE_URL = 'https://otbkqfeeduljwegafhcy.supabase.co';      // ex: https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_Ffa53jlirD451vuribGEiw_O9D_cMH2';        // Project Settings → API → anon public
// ======================================================================
const LINK_MEC = location.origin+location.pathname+'#mecanico';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Registrado AQUI (logo após criar o client) e não depois de getSession(): o Supabase detecta o
// token "type=recovery" da URL e dispara o evento PASSWORD_RECOVERY durante a própria inicialização
// do client, antes de qualquer await nosso. Se o listener só for registrado depois, esse evento é
// perdido e o link de recuperação acaba logando o usuário direto no sistema, sem pedir nova senha.
let S_recuperando=false;
sb.auth.onAuthStateChange((ev,sess)=>{
  if(ev==='SIGNED_OUT'){ S.user=null; S.perfil=null; render(); }
  if(ev==='PASSWORD_RECOVERY'&&sess){ S_recuperando=true; trocarSenhaRecuperacao(sess); }
});
async function trocarSenhaRecuperacao(session){
  let np=prompt('Redefinição de senha.\n\nDigite a nova senha (mín. 6 caracteres):');
  while(np&&np.length<6){ np=prompt('A senha precisa ter ao menos 6 caracteres. Digite novamente (ou cancele):'); }
  if(np){ const {error}=await sb.auth.updateUser({password:np}); toast(error?'Erro ao trocar senha: '+error.message:'Senha alterada com sucesso'); }
  else toast('Senha não foi alterada');
  if(location.hash.includes('type=recovery')) location.hash=(S.mec?'#mecanico':'');
  await carregarSessao(session);
}
// Adaptador: mesma interface do app (collection/doc/onSnapshot) sobre tabelas Supabase (id text, data jsonb)
const genId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function mkDb(){
  const tbl=(col)=>({
    path:col,
    async get(){ const {data,error}=await sb.from(col).select('id,data'); if(error) throw error; return {docs:(data||[]).map(r=>({id:r.id,exists:true,data:()=>r.data})),size:(data||[]).length,empty:!(data||[]).length}; },
    async add(d){ const id=genId(); const {error}=await sb.from(col).insert({id,data:d}); if(error) throw error; return docRef(col,id); },
    doc(id){ return docRef(col,id||genId()); },
    onSnapshot(next,err){
      const refetch=async()=>{ try{ const {data,error}=await sb.from(col).select('id,data'); if(error) throw error; next({docs:(data||[]).map(r=>({id:r.id,exists:true,data:()=>r.data})),size:(data||[]).length,empty:!(data||[]).length}); }catch(e){ if(err) err({code:'unavailable',message:String(e.message||e)}); } };
      refetch();
      const ch=sb.channel('rt-'+col+'-'+genId()).on('postgres_changes',{event:'*',schema:'public',table:col},()=>refetch()).subscribe();
      const iv=setInterval(refetch,60000);
      return ()=>{ sb.removeChannel(ch); clearInterval(iv); };
    }
  });
  const docRef=(col,id)=>({
    id, path:col+'/'+id,
    async get(){ const {data,error}=await sb.from(col).select('id,data').eq('id',id).maybeSingle(); if(error) throw error; return {id,exists:!!data,data:()=>data?data.data:undefined}; },
    async set(d){ const {error}=await sb.from(col).upsert({id,data:d}); if(error) throw error; },
    async update(d){ const cur=await this.get(); const base=cur.exists?cur.data():{}; const {error}=await sb.from(col).upsert({id,data:{...base,...d}}); if(error) throw error; },
    async delete(){ const {error}=await sb.from(col).delete().eq('id',id); if(error) throw error; },
    onSnapshot(next,err){
      const refetch=async()=>{ try{ next(await this.get()); }catch(e){ if(err) err({code:'unavailable',message:String(e.message||e)}); } };
      refetch();
      const ch=sb.channel('rt-'+col+'-'+id+'-'+genId()).on('postgres_changes',{event:'*',schema:'public',table:col,filter:'id=eq.'+id},()=>refetch()).subscribe();
      return ()=>sb.removeChannel(ch);
    }
  });
  return { collection:tbl, doc:(path)=>{ const [c,i]=path.split('/'); return docRef(c,i); } };
}

function levDist(a,b){
  if(Math.abs(a.length-b.length)>2) return 99;
  const dp=[]; for(let i=0;i<=a.length;i++){ dp[i]=[i]; }
  for(let j=1;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[a.length][b.length];
}

function historicoPorPlaca(placa){

  return S.histCompartilhado.filter(h=>h.placa===placa&&h.status!=='Agendada').sort((a,b)=>(b.data||'').localeCompare(a.data||''));

function osDoVeic(vId){
  const v=S.veic.find(x=>x.id===vId);
  // "Agendada" ainda não é uma intervenção de verdade (o carro nem voltou pra ser atendido) — fica
  // de fora do histórico/contagens/alertas, senão contaria como serviço feito sem ter sido feito
  const proprias=S.os.filter(o=>o.veiculoId===vId&&o.status!=='Agendada');
  const idsProprias=new Set(proprias.map(o=>o.id));
  const externas=v?historicoPorPlaca(v.placa).filter(h=>!idsProprias.has(h.id)&&h.status!=='Agendada'):[];
  return [...proprias,...externas].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
function ultimaTroca(vId,pecaId){

function trocaInfo(o,pecaId){ const it=(o.itens||[]).find(i=>i.pecaId===pecaId)||{}; return {km:it.kmTroca?+it.kmTroca:(+o.km||0),data:it.dataTroca||o.data}; }
// eventosOverride: usado quando ainda não existe veículo cadastrado aqui (placa nova, mas com
// histórico técnico vindo de outra oficina) — nesse caso v.id não existe, então os eventos vêm
// prontos (de historicoPorPlaca) em vez de ir buscar por id
function alertasVeic(v,kmRef,eventosOverride){
  const out=[]; const kmAtual=kmRef!=null?+kmRef:(+v.km||0);
  const eventos=eventosOverride||osDoVeic(v.id);
  for(const p of catalogo()){
    if(!p.km&&!p.dias) continue;
    const ult=eventos.find(o=>(o.itens||[]).some(i=>i.pecaId===p.id))||null;
    if(!ult){ out.push({v,p,lvl:'neu',txt:'sem registro'}); continue; }
    let lvl=null,txt='';
    const avisoKm=p.critico?Math.max(S.cfg.avisoKm,5000):p.id===OLEO?Math.max(S.cfg.avisoKm,1000):S.cfg.avisoKm;
    const ti=trocaInfo(ult,p.id);
    if(p.km>0){ const prox=ti.km+p.km, falta=prox-kmAtual;
      if(falta<=0){lvl='bad';txt=`vencida há ${fmtKm(-falta)} (troca aos ${fmtKm(prox)}, feita a ${fmtKm(ti.km)} em ${fmtD(ti.data)})`;} else if(falta<=avisoKm){lvl='warn';txt=`vence em ${fmtKm(falta)} (troca aos ${fmtKm(prox)}, feita a ${fmtKm(ti.km)} em ${fmtD(ti.data)})`;} else txt=`próx. ${fmtKm(prox)}`; }
    if(p.dias>0){ const d=new Date(ti.data.slice(0,10)); d.setDate(d.getDate()+p.dias); const dias=Math.round((d-new Date())/864e5); let l2=null,t2;
      if(dias<0){l2='bad';t2=`vencida há ${-dias} dias`;} else if(dias<=S.cfg.avisoDias){l2='warn';t2=`vence em ${dias} dias`;} else t2=`próx. ${fmtD(d.toISOString())}`;
      if(l2==='bad'||(l2==='warn'&&lvl!=='bad')){lvl=l2;txt=t2;} else if(!txt) txt=t2; else if(!lvl) txt+=` · ${t2}`; }
    out.push({v,p,lvl:lvl||'ok',txt,ult});
  }
  return out;
}
function statusVeic(v){ const al=alertasVeic(v); return al.some(a=>a.lvl==='bad')?'bad':al.some(a=>a.lvl==='warn')?'warn':'ok'; }

const NAV_ADM=[['painel','Painel'],['rel','Relatórios'],['frota','Frota'],['os','Ordens de serviço'],['sin','Sinistros'],['pecas','Peças'],['oficina','Oficina'],['cfg','Configurações']];
// aba "Oficinas" (rede de oficinas parceiras) só aparece para o administrador geral
function navAdm(){ return ehSuperadmin()?[...NAV_ADM,['oficinas','Oficinas']]:NAV_ADM; }
const NAV_MEC=[['mnova','Nova OS'],['mabertas','OS abertas'],['magenda','Agendamentos'],['mconc','OS concluídas'],['mhist','Histórico por placa']];
// "Atenção" é uma cópia dos alertas do painel do administrador (manutenções vencidas/próximas),
// só da frota Carsz — visível pro mecânico chefe e pro responsável de oficina parceira, não pro
// ajudante. "Oficina" (gerenciar a própria equipe, inclusive criar cargos de auxiliar/ajudante)
// aparece pro mecânico chefe e pro responsável de oficina parceira (dono da própria oficina) — a
// gestão geral da Carsz já gerencia equipes por "Oficinas" > Editar
function navMec(){
  const donoOficina=!!(S.perfil&&S.perfil.papel==='gestor'&&!ehAdminGeral());
  // chefe/gestor da própria oficina (fora do administrador geral): enquanto a "modo gestão da
  // oficina" estiver ligada (S.oficMgestao, via o botão no cabeçalho), mostra só as abas de gestão;
  // senão, só as operacionais — igual ao alternador do administrador geral, nunca as duas juntas
  if(podeAlternarGestaoOficina()&&S.oficMgestao){
    let nav=[];
    if(ehChefe()||donoOficina) nav.push(['matencao','Atenção']);
    nav.push(['mrel','Relatórios'],['mfat','Faturamento']);
    if(ehChefe()||donoOficina) nav.push(['oficina','Oficina']);
    return nav;
  }
  // auxiliar administrativo não vê "OS concluídas" — só abre OS e preenche peças, não precisa (nem
  // deve) folhear o que já foi fechado/cobrado
  let nav=ehAuxiliar()?NAV_MEC.filter(([k])=>k!=='mconc'):[...NAV_MEC];
  // administrador geral em modo mecânico não tem o alternador acima — continua vendo tudo junto,
  // como sempre foi
  if(ehAdminGeral()){
    if(ehChefe()||donoOficina) nav.push(['matencao','Atenção']);
    if(ehChefe()||ehGestor()) nav.push(['mrel','Relatórios'],['mfat','Faturamento']);
    if(ehChefe()||donoOficina) nav.push(['oficina','Oficina']);
  }
  return nav;
}
const PRESERVE=['lg_user','lg_pass','it_nome','it_qtd','it_custo','it_obs','os_rel','os_mo','os_of','n_placa','n_km','n_modelo'];
function preservar(root){ const k={vals:{},focus:null,sel:null}; for(const id of PRESERVE){ const e=document.getElementById(id); if(e&&e.value!=='') k.vals[id]=e.value; } const a=document.activeElement; if(a&&a.id&&root.contains(a)){ k.focus=a.id; try{k.sel=[a.selectionStart,a.selectionEnd];}catch(e){} } return k; }
function restaurar(k){ for(const [id,v] of Object.entries(k.vals)){ const e=document.getElementById(id); if(e&&!e.disabled&&e.value!==v) e.value=v; } if(k.focus){ const e=document.getElementById(k.focus); if(e){ e.focus(); if(k.sel&&k.sel[0]!=null){ try{e.setSelectionRange(k.sel[0],k.sel[1]);}catch(x){} } } } }
function toggleMode(){ S.mec=!S.mec; location.hash=S.mec?'#mecanico':''; S.view=S.mec?'mnova':'painel'; S.osAtual=null; render(); }
// alternador "modo gestão da oficina" (chefe/gestor da própria oficina) — entre as abas
// operacionais (Nova OS, OS abertas…) e as de gestão (Atenção, Relatórios, Faturamento, Oficina)
function toggleGestaoOficina(){ S.oficMgestao=!S.oficMgestao; S.view=S.oficMgestao?'mrel':'mnova'; render(); }
async function sairMec(){ await sb.auth.signOut(); S.user=null; S.perfil=null; S.mecNome=''; S.osAtual=null; S.view='mnova'; render(); }
// ---- aviso automático de agendamento próximo: dispara no máximo uma vez por dia (guardado no
// localStorage deste aparelho), avisando com antecedência — pula fim de semana, então um
// agendamento de segunda já avisa na sexta anterior (ver diaUtilAnterior) ----
let avisoAgendaChecadoNestaSessao=false;
function checarAvisosAgendamento(){
  if(avisoAgendaChecadoNestaSessao) return;
  const oficId=S.perfil&&S.perfil.oficinaId; if(!oficId) return;
  const hj=hoje();
  const chaveLS='avisoAgenda_'+oficId+'_'+hj;
  let jaMostrado=false; try{ jaMostrado=localStorage.getItem(chaveLS)==='1'; }catch(e){}
  if(jaMostrado){ avisoAgendaChecadoNestaSessao=true; return; }
  const hjD=new Date(hj+'T12:00:00');
  const pendentes=S.os.filter(o=>o.status==='Agendada'&&o.oficinaId===oficId&&o.agendamento).filter(o=>{
    const dataAg=new Date(o.agendamento+'T12:00:00');
    if(dataAg<hjD) return false; // já passou — some do aviso, mas continua aparecendo em Agendamentos
    return hjD>=diaUtilAnterior(o.agendamento);
  }).sort((a,b)=>a.agendamento.localeCompare(b.agendamento));
  if(!pendentes.length) return; // sem nada pra avisar ainda — tenta de novo no próximo render até ter
  avisoAgendaChecadoNestaSessao=true;
  try{ localStorage.setItem(chaveLS,'1'); }catch(e){}
  abrir(`<h3>🗓 Agendamento${pendentes.length>1?'s':''} chegando</h3>
    <p class="muted">Confirme com o cliente ou prepare peças antes da data.</p>
    ${pendentes.map(o=>{
      const v=S.veic.find(x=>x.id===o.veiculoId);
      const ehHoje=o.agendamento===hj;
      return `<div class="lastinfo" style="margin-bottom:8px"><span class="plate">${esc(o.placa)}</span>${v?` <b>${esc(v.modelo||'')}</b>`:''} — agendado para <b>${fmtD(o.agendamento)}</b>${ehHoje?' <span class="tag warn">é hoje</span>':''}${o.relato?`<br><span class="muted">${esc(o.relato)}</span>`:''}</div>`;
    }).join('')}
    <div class="act"><button class="sec" onclick="fechar();S.view='magenda';render()">Ver Agendamentos</button><button class="pri" onclick="fechar()">Entendi</button></div>`);
}
function render(){
  document.body.classList.toggle('mec',S.mec);
  document.body.classList.toggle('ofgestao',!!(S.mec&&podeAlternarGestaoOficina()&&S.oficMgestao));
  document.getElementById('ttl').textContent=S.mec?'CARSZ · Oficina':'CARSZ · Manutenção da frota';
  document.getElementById('subttl').textContent=S.mec?(S.mecNome?'Mecânico: '+S.mecNome:'Registro rápido de serviços'):'Controle de revisões, custos e sinistros';
  const mb=document.getElementById('modeBtn');
  const qb=document.getElementById('qrBtn');
  const gb=document.getElementById('gBtn');
  if(!S.user){ document.getElementById('nav').innerHTML=''; mb.style.display='none'; qb.style.display='none'; gb.style.display='none'; const mm=document.getElementById('main'); if(!document.getElementById('lg_user')){ const k=preservar(mm); loginMec(mm); restaurar(k); } return; }
  mb.style.display='';
  // "gestor" aqui = administrador geral do negócio (vê Painel/Relatórios/Frota/Sinistros/
  // Configurações e o botão de trocar "Modo gestão"/"Modo mecânico"). O responsável de uma oficina
  // parceira NÃO entra nessa conta — fica sempre em modo mecânico, com a aba extra "Oficina"
  const gestor=ehAdminGeral();
  if(!gestor&&!S.mec){ S.mec=true; S.view='mnova'; }
  if(gestor){ mb.textContent=S.mec?'Modo gestão':'Modo mecânico'; mb.onclick=toggleMode; }
  else { mb.textContent='Sair'; mb.onclick=sairMec; }
  qb.style.display=S.mec?'':'none';
  // botão de gestão da própria oficina: só pro chefe/gestor de oficina (não o administrador geral,
  // que tem o seu alternador na linha acima) — ajudante nunca vê este botão
  if(S.mec&&podeAlternarGestaoOficina()){ gb.style.display=''; gb.textContent=S.oficMgestao?'Modo mecânico':'Modo gestão'; gb.classList.toggle('on',!!S.oficMgestao); }
  else { gb.style.display='none'; gb.classList.remove('on'); }
  const nomeOficina=S.oficina?S.oficina.nome:(ehSuperadmin()?'Administração geral':'');
  document.getElementById('subttl').textContent=S.mec?('Mecânico: '+S.mecNome+(nomeOficina?' · '+nomeOficina:'')+(gestor?' · ':'')):('Logado como '+(S.perfil?S.perfil.nome:'')+(nomeOficina?' · '+nomeOficina:''));
  if(gestor&&S.mec){ const sub=document.getElementById('subttl'); sub.innerHTML+='<a href="#" onclick="sairMec();return false" style="color:inherit">sair</a>'; }
  // marca no cabeçalho: oficinas parceiras (fora da Oficina Matriz) veem o próprio nome/logo no
  // lugar de "CARSZ" — cada uma com a sua marca, não um nome genérico compartilhado
  const marca=(S.oficina&&S.oficina.id!=='matriz')?S.oficina.nome:'CARSZ';
  document.getElementById('ttl').textContent=S.mec?(marca+' · Oficina'):(marca+' · Manutenção da frota');
  const hdrLogo=document.getElementById('hdrLogo');
  if(S.oficina&&S.oficina.logo&&S.oficina.logo.url){ hdrLogo.src=S.oficina.logo.url; hdrLogo.style.display='inline-block'; } else hdrLogo.style.display='none';
  const nav=(S.mec?navMec():navAdm());
  document.getElementById('nav').innerHTML=nav.map(([k,l])=>`<button data-v="${k}" class="${k===S.view?'on':''}">${l}</button>`).join('');
  // clicar em "Nova OS" no menu sempre começa uma OS do zero — antes, se já tivesse uma OS aberta
  // em edição (S.osAtual), a tela "Nova OS" continuava mostrando ela em vez do formulário de
  // identificar o veículo (a OS anterior já está salva, cada campo grava sozinho; só faltava
  // limpar o "em edição" pra liberar o formulário novo)
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
    if(b.dataset.v==='mnova'&&S.osAtual){ S.osAtual=null; nova={placa:'',km:'',fotoPlaca:null,fotoKm:null,lendo:false,data:hoje(),oficinaId:'',mecanicoNome:'',agendamento:'',agendaObs:'',clienteNome:'',clienteTel:'',confirmaNaoFrota:false}; }
    S.view=b.dataset.v;S.filtro='';render();
  });
  const m=document.getElementById('main');
  if(!S.cfg){ m.innerHTML='<div class="empty">Carregando dados…</div>'; return; }
  const keep=preservar(m);
  ({painel,rel:relView,frota,os:osView,sin,pecas:pecasView,oficina:oficinaView,cfg,mnova,mabertas,magenda,mconc,mhist,matencao,mfat,mrel:mrelView,oficinas:oficinasView})[S.view](m);
  restaurar(keep);
  if(!S.mec){ const nb=S.veic.filter(v=>statusVeic(v)==='bad').length; const b=document.querySelector('nav [data-v=painel]'); if(b) b.innerHTML='Painel'+(nb?`<span class="n">${nb}</span>`:''); }
  else {
    const na=S.os.filter(o=>o.status==='Aberta').length; const b=document.querySelector('nav [data-v=mabertas]'); if(b) b.innerHTML='OS abertas'+(na?`<span class="n">${na}</span>`:'');
    // badge de Agendamentos: total de agendamentos pendentes da oficina, igual ao badge de OS abertas
    const naAg=S.os.filter(o=>o.status==='Agendada'&&o.oficinaId===(S.perfil&&S.perfil.oficinaId)).length;
    const bAg=document.querySelector('nav [data-v=magenda]'); if(bAg) bAg.innerHTML='Agendamentos'+(naAg?`<span class="n">${naAg}</span>`:'');
    checarAvisosAgendamento();
    // mesmo filtro usado na tela matencao(): frota só conta placa já atendida por esta oficina
    // parceira; clientes particulares (já visíveis aqui) contam sempre
    const souParceiraNav=!!(S.perfil&&S.perfil.oficinaId&&S.perfil.oficinaId!=='matriz');
    const placasAtendidasNav=souParceiraNav?new Set(S.os.map(o=>o.veiculoId)):null;
    const nb2=S.veic.filter(v=>statusVeic(v)==='bad'&&(!isFrota(v)||!souParceiraNav||placasAtendidasNav.has(v.id))).length; const b2=document.querySelector('nav [data-v=matencao]'); if(b2) b2.innerHTML='Atenção'+(nb2?`<span class="n">${nb2}</span>`:'');
  }
}

// ============ histórico visual por placa ============
function timelineHtml(v, opts={}){
  const podeMo=podeFinalizarOs();
  const lst=osDoVeic(v.id); const sins=S.sin.filter(s=>s.veiculoId===v.id);
  const evs=[...lst.map(o=>({t:'os',d:o.data||'',o})),...sins.map(s=>({t:'sin',d:s.data||'',s}))].sort((a,b)=>b.d.localeCompare(a.d));
  if(!evs.length) return '<div class="empty">Nenhuma intervenção registrada para esta placa ainda.</div>';
  let h='<div class="tl">';
  for(const e of evs){
    if(e.t==='sin'){ h+=`<div class="ev sin"><div class="hd"><b>${fmtD(e.d)}</b><span class="tag bad">Sinistro</span><span class="muted">${esc(e.s.status)}</span></div><div>${esc(e.s.desc)}</div></div>`; continue; }
    const o=e.o;
    if(o.externo){
      // histórico técnico de OUTRA oficina: itens/km/data + nome de quem atendeu, nunca o valor cobrado
      h+=`<div class="ev ${o.status==='Aberta'?'open':''}"><div class="hd"><b>${fmtD(o.data)}</b><span class="plate">${fmtKm(o.km)}</span><span class="tag neu">${o.oficina?esc(o.oficina):'Atendido em outra oficina'}</span></div>`;
      if((o.itens||[]).length){ h+='<ul>'; for(const i of o.itens) h+=`<li>${esc(i.nome)}${i.retroativo?` <span class="tag neu">informado · ${fmtKm(i.kmTroca)}</span>`:''}</li>`; h+='</ul>'; }
      h+='</div>';
      continue;
    }
    const tot=podeMo?osTotal(o):pecasTotal(o);
    h+=`<div class="ev ${o.status==='Aberta'?'open':''}"><div class="hd"><b>${fmtD(o.data)}</b><span class="plate">${fmtKm(o.km)}</span><span class="tag ${o.status==='Aberta'?'warn':'ok'}">${esc(o.status)}</span><span class="muted">${esc(o.mecanico||'')}${o.oficina?' · '+esc(o.oficina):''}</span><span class="sp"></span><b>${fmtBRL(tot)}</b>${opts.edit?`<button class="sec" onclick="abrirOs('${o.id}')">Abrir OS</button>`:''}</div>`;
    if((o.itens||[]).length){ h+='<ul>'; for(const i of o.itens) h+=`<li>${esc(i.nome)}${(+i.qtd||1)>1?' ×'+i.qtd:''}${i.custo?` — ${fmtBRL((+i.custo)*(+i.qtd||1))}`:''}${i.obs?` <span class="muted">(${esc(i.obs)})</span>`:''}${i.retroativo?` <span class="tag neu">informado · ${fmtKm(i.kmTroca)}</span>`:''}${tagEditado(i)}</li>`; h+='</ul>'; }
    if(podeMo&&(o.maoObra||o.maoObraEdit)) h+=`<div class="muted">Mão de obra: ${fmtBRL(o.maoObra)}${tagMo(o)}</div>`;
    if(o.relato) h+=`<div class="rel">${esc(o.relato)}</div>`;
    const fotos=[o.fotoPlaca,o.fotoKm,...(o.fotos||[])].filter(Boolean);
    if(fotos.length) h+='<div class="ph">'+fotos.map(f=>`<img src="${blob(f)}" onclick="lightbox('${f}')" loading="lazy">`).join('')+'</div>';
    h+='</div>';
  }
  return h+'</div>';
}

function sugPlaca(){
  const l=document.getElementById('sug_placa'); if(!l) return;
  const p=normPlaca(nova.placa);
  const arr=S.veic.filter(v=>p?v.placa.includes(p):true).sort((a,b)=>a.placa.localeCompare(b.placa)).slice(0,6);
  if(!arr.length||(arr.length===1&&arr[0].placa===p)){l.style.display='none';return;}
  l.style.display='block';
  l.innerHTML=arr.map(v=>`<div onmousedown="nova.placa='${v.placa}';document.getElementById('n_placa').value='${v.placa}';nova.confirmaNaoFrota=false;chkPlaca();"><span class="plate">${v.placa}</span> ${esc(v.modelo)}<small>${osDoVeic(v.id).length} intervenções · último km ${fmtKm(v.km)}${osAbertaDe(v)?' · <b>OS aberta</b>':''}</small></div>`).join('');
}
// também olha o histórico compartilhado de outras oficinas, pra não deixar duas oficinas
// atenderem o mesmo carro (frota Carsz) ao mesmo tempo sem saber uma da outra
// só a OS aberta da PRÓPRIA oficina bloqueia abrir uma OS nova pro mesmo carro (evita duas OS
// simultâneas dentro da mesma oficina). Uma OS aberta em OUTRA oficina não bloqueia mais — cada
// oficina pode atender o mesmo carro (frota Carsz) ao mesmo tempo; ver osAbertaExterna, que só avisa
// checa pela PLACA (texto), não só pelo id do veículo — se por algum motivo existirem dois
// cadastros de veículo com a mesma placa (ex.: um criado automaticamente antes de o veículo "oficial"
// ser reconhecido), uma OS aberta em qualquer um dos dois ainda bloqueia e oferece reabrir
function osAbertaPropria(v,placaStr){
  const p=placaStr||(v&&v.placa); if(!p) return null;
  return S.os.find(o=>o.status==='Aberta'&&(o.placa===p||(v&&o.veiculoId===v.id)))||null;
}
// OS aberta em outra oficina, só pra aviso informativo (nunca bloqueia)
function osAbertaExterna(v){
  if(!v) return null;
  const ext=S.histCompartilhado.find(h=>h.placa===v.placa&&h.status==='Aberta');
  return ext?{...ext,mecanico:'',itens:ext.itens||[]}:null;
}
// mantido pelo nome antigo onde só interessa "tem alguma OS aberta, de quem for" (ex.: indicador na
// lista de sugestão de placa) — nunca usar isto para decidir se bloqueia a criação de OS nova
function osAbertaDe(v){ return osAbertaPropria(v)||osAbertaExterna(v); }
const kmMinimo = v => +((v&&v.km)||0);
// agendamento: o km digitado aqui é só informativo (o carro pode nem ter sido inspecionado ainda),
// então não trava o botão por km "menor que o último registro" — essa checagem de verdade acontece
// só quando o atendimento começa (iniciarAgendamento)
function kmRuim(){ if(ehGestor()||nova.agendamento) return false; const v=S.veic.find(x=>x.placa===normPlaca(nova.placa)); return !!(v&&+nova.km>0&&+nova.km<kmMinimo(v)); }
// bloco mostrado quando já existe uma OS aberta pra esta placa — nunca deixa abrir outra, só
// oferece continuar editando a que já existe (ver osAbertaPropria, que acha por placa e não só
// por id de veículo, pra não deixar passar se houver cadastro duplicado da mesma placa)
function blocoOsAberta(ab){
  const dias=Math.max(0,Math.round((Date.now()-new Date(ab.data))/864e5));
  return `<div class="lastinfo" style="background:var(--bad-bg);color:var(--bad)"><b>⚠ Esta placa já tem uma OS aberta na sua oficina</b> desde ${fmtD(ab.data)} (há ${dias} dia${dias===1?'':'s'}, ${fmtKm(ab.km)}, ${esc(ab.mecanico||'')}, ${(ab.itens||[]).length} itens).<br>Em vez de abrir outra, continue editando essa.</div><button class="big sec" onclick="S.osAtual='${ab.id}';render()">Continuar editando esta OS</button>`;
}
function infoPlaca(){

    // digitação; trava a abertura até escolher a placa certa ou confirmar que não é erro nenhum
    const parecidas=placasFrotaParecidas(p);
    const avisoParecida=parecidas.length?`<div class="lastinfo" style="background:var(--bad-bg);color:var(--bad);border-left:4px solid var(--bad)"><b>⚠ Confira a placa</b> — ${parecidas.length>1?'estas placas':'esta placa'} da frota Carsz ${parecidas.length>1?'são':'é'} muito parecida${parecidas.length>1?'s':''} com "${esc(p)}": ${parecidas.map(x=>`<button class="ghost" style="margin:2px" onmousedown="nova.placa='${x.v.placa}';document.getElementById('n_placa').value='${x.v.placa}';nova.confirmaNaoFrota=false;chkPlaca();">${esc(x.v.placa)} · ${esc(x.v.modelo||'')}</button>`).join(' ')}<br>Se for erro de digitação, clique na placa certa acima. Se não for, confirme abaixo antes de continuar.</div>`:'';
    const base=`<div class="lastinfo" style="background:var(--warn-bg);color:var(--warn);border-left:4px solid var(--warn)"><b>⚠ Placa não encontrada na frota.</b> Será criada agora como veículo novo (cliente particular do mecânico, fora dos relatórios da Carsz). <b>Se este carro é da frota/locadora, confira se digitou a placa certa antes de continuar</b> — se estiver certa, avise a gestão pra cadastrar como "Frota Carsz".<input id="n_modelo" placeholder="Modelo (opcional)" style="margin-top:6px">
      <label style="display:flex;align-items:flex-start;gap:6px;margin-top:10px;font-weight:600;cursor:pointer"><input type="checkbox" id="n_confnovo" ${nova.confirmaNaoFrota?'checked':''} onchange="nova.confirmaNaoFrota=this.checked;chkPlaca()" style="width:auto;margin-top:3px"> Confirmo que esta placa NÃO é um carro da frota Carsz/locadora — é cliente particular do mecânico.</label>
    </div>`;

    if(!hist.length) return avisoParecida+base;
    // placa nova por aqui, mas já tem histórico técnico vindo de outra oficina — mostra pendências

    const al=alertasVeic({placa:p},+nova.km>0?+nova.km:null,hist).filter(a=>a.lvl==='bad'||a.lvl==='warn');
    const ul=hist[0];
    const avisoBox=al.length?`<div class="lastinfo" style="background:var(--bad-bg);color:var(--bad);border-left:4px solid var(--bad)"><b>⚠ Esta placa já tem histórico em outra oficina</b> (última intervenção em ${fmtD(ul.data)}, ${fmtKm(ul.km)}):<ul style="margin:6px 0 0;padding-left:18px">${al.map(a=>`<li><b>${esc(a.p.nome)}</b> — ${a.txt}</li>`).join('')}</ul></div>`:`<div class="lastinfo ok">Esta placa já tem histórico em outra oficina (última intervenção em ${fmtD(ul.data)}, ${fmtKm(ul.km)}) — sem pendências vencidas.</div>`;
    return avisoParecida+avisoBox+base;
  }
  const ab=osAbertaPropria(v);
  if(ab) return blocoOsAberta(ab);
  // OS aberta em OUTRA oficina não bloqueia mais — só avisa, pra cada oficina saber da outra
  const extAberta=osAbertaExterna(v);
  const avisoExterna=extAberta?`<div class="lastinfo" style="background:var(--warn-bg);color:var(--warn);border-left:4px solid var(--warn)"><b>⚠ Este veículo está com OS aberta em outra oficina</b> desde ${fmtD(extAberta.data)} (${fmtKm(extAberta.km)}${extAberta.oficina?', '+esc(extAberta.oficina):''}). Pode abrir a OS aqui mesmo assim — cada oficina atende separado.</div>`:'';
  const al=alertasVeic(v,+nova.km>0?+nova.km:null).filter(a=>a.lvl==='bad'||a.lvl==='warn');
  const crit=al.filter(a=>destaque(a.p));
  const ul=osDoVeic(v.id)[0];
  return avisoExterna+`<div class="lastinfo ok">Veículo reconhecido: <b>${esc(v.modelo)} ${esc(v.ano||'')}</b> · último km ${fmtKm(v.km)} · ${osDoVeic(v.id).length} intervenções${ul?` · última em ${fmtD(ul.data)} (${(ul.itens||[]).map(i=>esc(i.nome)).slice(0,3).join(', ')||'sem itens'})`:''}${al.filter(a=>!destaque(a.p)).length?'<br>Pendências: '+al.filter(a=>!destaque(a.p)).map(a=>esc(a.p.nome)+' ('+a.txt+')').join(', '):''}</div>${crit.length?`<div class="lastinfo" style="background:var(--bad-bg);color:var(--bad);border-left:4px solid var(--bad)"><b>⚠ Itens sensíveis desta placa:</b><ul style="margin:6px 0 0;padding-left:18px">${crit.map(a=>`<li><b>${esc(a.p.nome)}</b> — ${a.txt}</li>`).join('')}</ul></div>`:''}`;
}
const mascaraCpf=v=>v.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
const mascaraTel=v=>{const d=v.replace(/\D/g,'').slice(0,11);return d.length>10?d.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3'):d.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3').replace(/-$/,'');};
function cpfValido(c){c=c.replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let r=(s*10)%11;if(r===10)r=0;if(r!==+c[9])return false;s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);r=(s*10)%11;if(r===10)r=0;return r===+c[10];}

async function loginParaEmail(u){
  u=(u||'').trim();
  const digitos=u.replace(/\D/g,'');
  if(!u.includes('@')&&digitos.length===11){
    const {data:email,error}=await sb.rpc('email_por_cpf',{p_cpf:digitos});
    if(error||!email) return {email:null,erro:'CPF não encontrado'};
    return {email};
  }
  return {email:u.toLowerCase()};
}
async function esqueciSenha(){
  const u=val('lg_user'); if(!u){toast('Digite o e-mail ou CPF primeiro');return;}
  const {email,erro}=await loginParaEmail(u);
  if(!email){toast(erro||'Não encontrado');return;}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  toast(error?'Erro: '+error.message:'Enviamos um link para o e-mail');
}
async function entrarMec(){
  const u=val('lg_user'), p=document.getElementById('lg_pass').value;
  const err=document.getElementById('lg_err'); if(!u||!p){err.textContent='Informe e-mail/CPF e senha';return;}
  err.textContent='Entrando…';
  const {email,erro}=await loginParaEmail(u);
  if(!email){ err.textContent=erro||'Usuário não encontrado'; return; }
  const {data,error}=await sb.auth.signInWithPassword({email,password:p});
  if(error){ err.textContent=/invalid/i.test(error.message)?'E-mail/CPF ou senha incorretos':error.message; return; }
  // recarrega a página com a sessão já salva: evita que as listas (usuários, frota, OS)
  // façam a primeira busca antes do login "valer" para as políticas do banco e apareçam vazias
  location.reload();
}
async function carregarSessao(session){
  if(!session){ S.user=null; S.perfil=null; S.mecNome=''; S.oficina=null; render(); return; }
  S.user=session.user;
  const {data:perf}=await sb.from('perfis').select('id,data').eq('id',S.user.id).maybeSingle();
  if(perf){ S.perfil={id:perf.id,...perf.data}; }
  else {
    const {count}=await sb.from('perfis').select('id',{count:'exact',head:true});
    // primeiríssimo acesso (nenhum perfil ainda): vira gestor da Oficina Matriz
    const novo={nome:S.user.email.split('@')[0],email:S.user.email,papel:count?'ajudante':'gestor',oficinaId:'matriz',ativo:true,criadoEm:agoraIso()};
    await sb.from('perfis').upsert({id:S.user.id,data:novo}); S.perfil={id:S.user.id,...novo};
  }
  if(S.perfil.ativo===false){ await sb.auth.signOut(); S.user=null; S.perfil=null; alert('Acesso desativado. Fale com a gestão.'); render(); return; }
  // usuário de uma oficina (não é o administrador geral): a oficina precisa estar "ativa".
  // se a tabela "oficinas" ainda não existir (migração do banco não rodada ainda), não bloqueia
  // o login — assim esta atualização não trava ninguém antes de você rodar o SQL da migração.
  if(S.perfil.papel!=='superadmin'){
    const {data:ofi,error:eOfi}=await sb.from('oficinas').select('id,data').eq('id',S.perfil.oficinaId||'').maybeSingle();
    if(eOfi){ console.warn('tabela "oficinas" indisponível (rode a migração do banco):',eOfi); S.oficina=null; }
    else {
      S.oficina=ofi?{id:ofi.id,...ofi.data}:null;
      if(!S.oficina||S.oficina.status!=='ativa'){
        await sb.auth.signOut(); S.user=null; S.perfil=null; S.oficina=null;
        alert(S.oficina?'Sua oficina está suspensa. Fale com o administrador.':'Sua oficina ainda não foi aprovada. Fale com o administrador.');
        render(); return;
      }
    }
  } else S.oficina=null;
  S.mecNome=S.perfil.nome;
  const d={...S.perfil,ultimoAcesso:agoraIso()}; delete d.id; sb.from('perfis').upsert({id:S.user.id,data:d}).then(()=>{},()=>{});
  if(!ehAdminGeral()){ S.mec=true; S.view='mnova'; }
  render();
}

async function redimensionar(file,max=1280){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',.82));
}

async function criarOs(){

async function alternarFrotaVeic(){
  const o=S.os.find(x=>x.id===S.osAtual); if(!o) return;
  const v=S.veic.find(x=>x.id===o.veiculoId); if(!v) return;
  const vaiPraFrota=!isFrota(v);
  const msg=vaiPraFrota?`Marcar a placa ${v.placa} como Frota Carsz?\n\nEla passa a contar nos relatórios/painel da Carsz, e todas as OS dela (abertas e concluídas) passam a ser tratadas como frota.`:`Marcar a placa ${v.placa} como cliente particular do mecânico?\n\nEla sai dos relatórios/painel da Carsz, e todas as OS dela (abertas e concluídas) passam a ser tratadas como cliente comum da oficina.`;
  if(!confirm(msg)) return;
  try{
    const upd={frotaPropria:vaiPraFrota,pendente:false};
    if(!vaiPraFrota) upd.oficinaId=v.oficinaId||S.perfil.oficinaId||null;
    await S.db.doc('veiculos/'+v.id).update(upd);
    toast(vaiPraFrota?'Placa movida para a Frota Carsz':'Placa movida para cliente particular');

  }catch(e){ erroSalvar('alterar o tipo deste veículo',e); }
}

async function apagarFotosLote(modo){

  const n=alvo.reduce((s,o)=>s+[o.fotoPlaca,o.fotoKm,...(o.fotos||[])].filter(Boolean).length,0);
  if(!n){toast('Nenhuma foto para apagar');return;}
  if(!confirm(`Apagar ${n} foto(s) de ${alvo.length} OS${modo==='todas'?'':' concluídas há mais de 90 dias'}? Os dados das OS (peças, custos, relato) são mantidos.`))return;
  const st=document.getElementById('foto_st'); if(st) st.textContent='Apagando…';
  for(const o of alvo){ const ids=[o.fotoPlaca,o.fotoKm,...(o.fotos||[])].filter(Boolean);
    await S.db.doc('os/'+o.id).update({fotoPlaca:null,fotoKm:null,fotos:[]});

// máscara de moeda do campo de mão de obra: digita só números, formata como "1.234,56" enquanto
// digita (centavos primeiro, igual maquininha de cartão) — maoObraValor() faz o caminho inverso
// pra mandar pro banco como número de verdade
function maoObraMask(el){
  let digits=(el.value||'').replace(/\D/g,'');
  if(!digits) digits='0';
  const n=(+digits)/100;
  el.value=n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function maoObraValor(el){
  const digits=(el&&el.value||'').replace(/\D/g,'');
  return digits?(+digits)/100:0;
}
async function maoObra(valor){

  if(valor<=0){
    if(o.maoObra!==valor){ try{ await S.db.doc('os/'+o.id).update({maoObra:valor,maoObraEdit:editMo(o,valor)}); }catch(e){ erroSalvar('salvar a mão de obra',e); } }
    return;

  const semNada=!(o.itens||[]).length&&!o.relato;

    <div class="act"><button class="sec" onclick="fechar();const c=document.getElementById('os_mo');if(c)c.value='${valorAntigoStr}';">Ainda não, continuar editando</button><button class="pri" onclick="fechar();fecharOs(${valor})">Sim, informar mão de obra e concluir</button></div>`);

// mostra o erro de verdade (nunca falha "em silêncio"): toda escrita que pode ser bloqueada pelas
// regras de segurança do banco (RLS) passa por aqui quando dá erro, com uma caixa bem visível —
// usa o modal do próprio app (não alert/confirm do navegador) porque alguns apps que abrem links

  // o cliente realmente voltou, é a hora certa de pedir, se ainda não tiver
  if(!(km>0)){

function mconc(m){
  const f=normPlaca(S.filtro); const podeMo=podeFinalizarOs();
  // ordem: cobrança não paga mais antiga sempre no topo (pra não deixar a mais velha esquecida),
  // depois as outras não pagas (da mais antiga pra mais nova), e só então as já pagas (mais

  let resumoHtml='';
  if(ehChefe()||ehGestor()){
    let pago=0,aReceber=0; for(const o of todasFiltradas){ const tot=osTotal(o); if(o.pago) pago+=tot; else aReceber+=tot; }

    resumoHtml=`<div class="cards" style="margin-bottom:12px">
      <div class="card ok"><div class="v">${fmtBRL(pago)}</div><div class="l">Total pago${sufixo}</div></div>
      <div class="card bad"><div class="v">${fmtBRL(aReceber)}</div><div class="l">Saldo a receber${sufixo}</div></div>
    </div>`;
  }
  m.innerHTML=`<div class="bar"><h2>OS concluídas</h2><span class="sp"></span>${filtroFrotaSelect()}</div>${resumoHtml}${alertaCobrancaBanner()}<input id="mc_busca" placeholder="Filtrar por placa" value="${esc(S.filtro)}" oninput="S.filtro=this.value;render()" style="margin-bottom:10px">`+
   (lst.length?lst.map(o=>{
     const v=S.veic.find(x=>x.id===o.veiculoId);
     const atraso=diasAtraso(o);
     const corAtraso=atraso>30?'bad':atraso>15?'warn':'neu';

     const btnPago=`<button class="${o.pago?'pago-ok':'pago-pend'}" title="${o.pago?'Esta cobrança está marcada como paga — clique para desfazer':'Marca esta cobrança como paga'}" onclick="event.stopPropagation();togglePago('${o.id}')">${o.pago?'Desfazer pagamento':'Marcar como pago'}</button>`;
     const cobranca=(v&&!isFrota(v)&&ehChefe())?`<button class="cobrar" title="Enviar o resumo + Pix por WhatsApp (o PDF é um envio separado, pelo botão Imprimir)" onclick="event.stopPropagation();cobrarOs('${o.id}')">💬 Cobrar</button>${statusPago}${btnPago}`:'';
     // mesma lógica de pagamento, mas para OS da frota Carsz (a locadora paga o mecânico pelo

     const pagamentoFrota=(v&&isFrota(v)&&ehChefe())?`<button class="${o.pago?'pago-ok':'pago-pend'}" title="${o.pago?'Pago pela locadora em '+fmtD(o.pagoEm)+' — clique para desfazer':'Marcar esta OS como paga pela locadora'}" onclick="event.stopPropagation();togglePago('${o.id}')">${o.pago?'✓ Pago em '+fmtD(o.pagoEm):'Marcar como pago'}</button>`:'';
     return `<div class="osrow" onclick="S.osAtual='${o.id}';S.view='mnova';render()"><span class="plate lg">${esc(o.placa)}</span>${v&&v.clienteNome?` <b class="cliente-badge">${esc(v.clienteNome)}</b>`:''}${v&&!isFrota(v)?' <span class="tag neu" title="Cliente particular do mecânico">cliente</span>':''}${(o.encaminhamentos||[]).length?' <span class="tag warn" title="Encaminhada entre oficinas">↪ encaminhada</span>':''}<div><b>${esc((v||{}).modelo||'')}</b><div class="muted">${fmtD(o.data||o.concluidaEm)} · ${fmtKm(o.km)} · ${(o.itens||[]).map(i=>esc(i.nome)).slice(0,3).join(', ')||'sem itens'}${(o.itens||[]).length>3?'…':''} · ${esc(o.mecanico||'')}</div></div><span class="sp"></span><div class="osactions"><b>${fmtBRL(podeMo?osTotal(o):pecasTotal(o))}</b><button onclick="event.stopPropagation();visualizarOs('${o.id}')" title="Ver como fica o PDF antes de baixar/enviar">👁 Visualizar</button><button onclick="event.stopPropagation();imprimirOsDireto('${o.id}')" title="Abre o diálogo de impressão do navegador, pra escolher a impressora">🖨 Imprimir</button><button onclick="event.stopPropagation();imprimirOs('${o.id}')" title="Compartilhar por WhatsApp/e-mail ou baixar o PDF">📤 Enviar</button>${cobranca}${pagamentoFrota}<span class="tag ok">Abrir</span></div></div>`;

// ---- resumo financeiro (mecânico chefe / gestão) ----
// só conta as OS que são da própria oficina AGORA — uma OS encaminhada pra outra oficina deixa de
// contar aqui (quem está com ela agora é quem cobra e recebe); ajudante não vê valor de mão de obra
// em outras telas, então também não vê este resumo
function resumoFinanceiro(){
  const minhas=S.os.filter(o=>o.oficinaId===(S.perfil&&S.perfil.oficinaId));
  let abertas=0,pagas=0,aReceber=0;
  for(const o of minhas){
    const tot=osTotal(o);
    if(o.status==='Aberta') abertas+=tot;
    else if(o.pago) pagas+=tot;
    else aReceber+=tot;
  }
  return {abertas,pagas,aReceber};
}
function cardsFinanceiro(){
  if(!(ehChefe()||ehGestor())) return '';

    <div class="card warn"><div class="v">${fmtBRL(r.abertas)}</div><div class="l">OS em aberto</div></div>
    <div class="card bad"><div class="v">${fmtBRL(r.aReceber)}</div><div class="l">Saldo a receber</div></div>
    <div class="card ok"><div class="v">${fmtBRL(r.pagas)}</div><div class="l">OS pagas</div></div>
  </div>`;

// ---- faturamento por período (mecânico chefe / gestão da oficina parceira) ----
// "faturamento" = soma do valor total das OS concluídas da própria oficina (peças + mão de obra) —
// é o total faturado, não o quanto já caiu no bolso; pra isso já existe "Saldo a receber" nos cards
function inicioSemana(d){ const dt=new Date(d); dt.setHours(0,0,0,0); const dia=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-dia); return dt; }
function inicioMesIso(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10); }
function chaveFaturamento(data,nivel){
  const d=new Date(data);
  if(nivel==='ano') return String(d.getFullYear());
  if(nivel==='semana') return inicioSemana(d).toISOString().slice(0,10);
  return d.toISOString().slice(0,7); // mês
}
function rotuloFaturamento(chave,nivel){
  if(nivel==='ano') return chave;
  if(nivel==='semana'){ const d=new Date(chave+'T12:00:00'); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }
  const [yy,mm]=chave.split('-'); return `${MESES_ABREV[+mm-1]}/${yy.slice(2)}`;
}
// lista as N últimas chaves de período terminando em agora (ex.: últimas 8 semanas, 12 meses, 5 anos)
function periodosRecentes(nivel,n){
  const now=new Date(); const out=[];
  if(nivel==='semana'){ let d=inicioSemana(now); for(let i=0;i<n;i++){ out.unshift(d.toISOString().slice(0,10)); d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-7); } }
  else if(nivel==='ano'){ const y=now.getFullYear(); for(let i=n-1;i>=0;i--) out.push(String(y-i)); }
  else { let y=now.getFullYear(), mo=now.getMonth(); for(let i=0;i<n;i++){ out.unshift(y+'-'+String(mo+1).padStart(2,'0')); mo--; if(mo<0){mo=11;y--;} } }
  return out;
}
function faturamentoPorPeriodo(nivel){
  const minhas=S.os.filter(o=>o.oficinaId===(S.perfil&&S.perfil.oficinaId)&&o.status==='Concluída');
  const porChave={};
  for(const o of minhas){
    const data=o.data||o.concluidaEm; if(!data) continue;
    const k=chaveFaturamento(data,nivel);
    if(!porChave[k]) porChave[k]={total:0,pecas:0,mo:0};
    const pecas=pecasTotal(o), mo=+o.maoObra||0;
    porChave[k].pecas+=pecas; porChave[k].mo+=mo; porChave[k].total+=pecas+mo;
  }
  return porChave;
}

  const osPeriodo=minhas.filter(o=>!lim||new Date(o.data||o.concluidaEm)>=lim);
  const totalOs=osPeriodo.length;
  const totalGasto=osPeriodo.reduce((s,o)=>s+osTotal(o),0);
  const placasAtendidas=new Set(osPeriodo.map(o=>o.placa)).size;

  // sem precisar casar com o cadastro de veículos)
  const porPlaca={};
  for(const o of osPeriodo){
    const k=o.placa||'—';
    if(!porPlaca[k]) porPlaca[k]={placa:k,paradas:0,gasto:0};
    porPlaca[k].paradas++; porPlaca[k].gasto+=osTotal(o);
  }

    if(!porPeca[nome]) porPeca[nome]={nome,qtd:0,gasto:0};
    porPeca[nome].qtd+=qtd; porPeca[nome].gasto+=val;

  <p class="hint" style="margin:-4px 0 10px">Somente OS concluídas da sua oficina — frota Carsz e clientes particulares juntos, nunca de outra oficina.</p>
  <div class="cards" style="margin-bottom:16px">
    <div class="card"><div class="v">${totalOs}</div><div class="l">OS concluídas no período</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(totalGasto)}</div><div class="l">faturado no período</div></div>
    <div class="card"><div class="v">${placasAtendidas}</div><div class="l">placas atendidas</div></div>
    <div class="card"><div class="v" style="font-size:18px">${rankPecas[0]?esc(rankPecas[0].nome):'—'}</div><div class="l">peça mais usada</div></div>
  </div>
  <h4>Gasto por mês (desde a 1ª OS da oficina)</h4><div class="barchart">${mesesHist.length?mesesHist.map(mm=>{
    const val=porMes[mm]||0, pct=Math.round(val/maxMes*100), [yy,mo]=mm.split('-');
    return `<div class="brow"><span class="blabel">${MESES_ABREV[+mo-1]}/${yy.slice(2)}</span><div class="btrack"><div class="bfill" style="width:${pct}%"></div></div><span class="bval">${fmtBRL(val)}</span></div>`;

    <div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div><h4>Veículos mais atendidos</h4><div class="barchart">${rankVeic.length?rankVeic.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.placa)}</span><div class="btrack"><div class="bfill warn" style="width:${Math.round(x.paradas/maxParadasV*100)}%"></div></div><span class="bval">${x.paradas}</span></div>`).join(''):'<div class="empty">Sem dados no período.</div>'}</div></div>

    <div><label class="muted" style="display:block;font-size:12px;margin-bottom:3px">Até</label><input type="date" id="bkp_fim" value="${S.bkpFim||hoje()}" style="min-width:150px"></div>

function mfat(m){
  if(!(ehChefe()||ehGestor())){ m.innerHTML='<div class="empty">Sem permissão para ver o faturamento.</div>'; return; }

  const N={semana:8,mes:12,ano:5}[nivel];
  const porChave=faturamentoPorPeriodo(nivel);
  const vazio={total:0,pecas:0,mo:0};
  const chaves=periodosRecentes(nivel,N);
  const atual=porChave[chaves[chaves.length-1]]||vazio;
  const anterior=porChave[chaves[chaves.length-2]]||vazio;
  const variacao=anterior.total>0?Math.round((atual.total-anterior.total)/anterior.total*100):null;
  const max=Math.max(1,...chaves.map(k=>(porChave[k]||vazio).total));
  const totalPeriodo=chaves.reduce((s,k)=>s+(porChave[k]||vazio).total,0);
  const pecasPeriodo=chaves.reduce((s,k)=>s+(porChave[k]||vazio).pecas,0);
  const moPeriodo=chaves.reduce((s,k)=>s+(porChave[k]||vazio).mo,0);
  const rotuloAtual={semana:'esta semana',mes:'este mês',ano:'este ano'}[nivel];
  const tabs=[['semana','Semanal'],['mes','Mensal'],['ano','Anual']];
  let h=`<div class="bar"><h2>Faturamento</h2></div>
  <h4 style="margin-top:0">Situação atual das OS</h4>
  ${cardsFinanceiro()}

  <p class="hint" style="margin:-4px 0 10px">Total faturado (OS concluídas) da sua oficina, separado em peças e mão de obra. Não é o quanto já caiu no bolso — pra isso veja "Saldo a receber" acima.</p>

    <div class="card"><div class="v" style="font-size:18px"><span style="color:var(--ok)">${fmtBRL(atual.pecas)}</span> <span class="muted" style="font-size:12px">peças</span><br><span style="color:var(--brand)">${fmtBRL(atual.mo)}</span> <span class="muted" style="font-size:12px">mão de obra</span></div><div class="l">discriminado ${rotuloAtual}</div></div>
    <div class="card"><div class="v" style="font-size:20px">${variacao==null?'—':(variacao>=0?'+':'')+variacao+'%'}</div><div class="l">vs. período anterior</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(totalPeriodo)}</div><div class="l">soma dos últimos ${N} períodos</div></div>
  </div>
  <p class="hint" style="margin:0 0 10px">Nos últimos ${N} períodos: <b style="color:var(--ok)">${fmtBRL(pecasPeriodo)}</b> em peças e <b style="color:var(--brand)">${fmtBRL(moPeriodo)}</b> em mão de obra.</p>
  <h4>Histórico <span class="muted" style="font-size:12px;font-weight:400">(<span style="color:var(--ok)">■</span> peças · <span style="color:var(--brand)">■</span> mão de obra)</span></h4>
  <div class="barchart">${chaves.map(k=>{
    const v=porChave[k]||vazio;
    const pctPecas=Math.round(v.pecas/max*100), pctMo=Math.round(v.mo/max*100);
    return `<div class="brow"><span class="blabel">${rotuloFaturamento(k,nivel)}</span><div class="btrack" style="display:flex"><div class="bfill" style="width:${pctPecas}%;background:var(--ok);border-radius:4px 0 0 4px"></div><div class="bfill" style="width:${pctMo}%;background:var(--brand);border-radius:0 4px 4px 0"></div></div><span class="bval">${fmtBRL(v.total)}</span></div>`;

// ---- backup em .zip das OS concluídas de um período: um PDF por OS (reaproveita montarOsPdf,
// o mesmo usado no botão "Imprimir") + um resumo com os totais, pra levar pra Área de Trabalho
// ou qualquer pasta — o navegador não escreve direto numa pasta do sistema, então baixamos o .zip
// e quem escolhe o destino é o próprio mecânico, ao extrair ----
async function montarResumoBackupPdf(lista,ini,fim){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const margin=14, pageW=210; let y=20;
  const BRAND=[13,59,102];
  const xData=margin, xPlaca=margin+22, xMec=margin+48, xPecas=128, xMo=162, xTotal=196;
  const marcaTxt=(S.oficina&&S.oficina.id!=='matriz')?S.oficina.nome:'CARSZ';
  const cabecalho=()=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(255);
    doc.setFillColor(...BRAND); doc.rect(margin,y-4.5,pageW-margin*2,6.5,'F'); doc.setTextColor(255);
    doc.text('Data',xData+1,y); doc.text('Placa',xPlaca+1,y); doc.text('Mecânico',xMec+1,y);
    doc.text('Peças',xPecas,y,{align:'right'}); doc.text('Mão de obra',xMo,y,{align:'right'}); doc.text('Total',xTotal,y,{align:'right'});
    doc.setTextColor(0); doc.setFont('helvetica','normal'); doc.setFontSize(9.5); y+=6.5;
  };
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...BRAND);
  doc.text(marcaTxt,margin,y); y+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(100);
  doc.text(`Resumo de backup · OS concluídas de ${fmtD(ini)} a ${fmtD(fim)}`,margin,y); doc.setTextColor(0); y+=9;
  cabecalho();
  let totPecas=0, totMo=0, totGeral=0;
  for(const o of lista){
    if(y>278){ doc.addPage(); y=20; cabecalho(); }
    const pecas=pecasTotal(o), mo=+o.maoObra||0, tot=pecas+mo;
    totPecas+=pecas; totMo+=mo; totGeral+=tot;
    doc.text(fmtD(o.data||o.concluidaEm),xData+1,y);
    doc.text(String(o.placa||'—'),xPlaca+1,y);
    doc.text(String(o.mecanico||'—').slice(0,20),xMec+1,y);
    doc.text(fmtBRL(pecas),xPecas,y,{align:'right'});
    doc.text(fmtBRL(mo),xMo,y,{align:'right'});
    doc.text(fmtBRL(tot),xTotal,y,{align:'right'});
    y+=6.5;
  }
  y+=1.5; doc.setDrawColor(150); doc.line(margin,y,pageW-margin,y); y+=6;
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
  doc.text(`${lista.length} OS no período`,margin,y);
  doc.setTextColor(...BRAND);
  doc.text(fmtBRL(totPecas),xPecas,y,{align:'right'});
  doc.text(fmtBRL(totMo),xMo,y,{align:'right'});
  doc.setFontSize(12); doc.text(fmtBRL(totGeral),xTotal,y,{align:'right'});
  doc.setTextColor(150); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(`Gerado em ${fmtD(agoraIso())} · Carsz · Controle de Manutenção`,margin,290);
  return doc;
}
async function baixarBackupOs(){
  const elIni=document.getElementById('bkp_ini'), elFim=document.getElementById('bkp_fim');
  const ini=elIni&&elIni.value, fim=elFim&&elFim.value;
  const st=document.getElementById('bkp_st'), btn=document.getElementById('bkp_btn');
  if(!ini||!fim){ toast('Escolha o período do backup'); return; }
  if(ini>fim){ toast('A data inicial não pode ser depois da data final'); return; }
  S.bkpIni=ini; S.bkpFim=fim;
  const lista=S.os.filter(o=>o.oficinaId===(S.perfil&&S.perfil.oficinaId)&&o.status==='Concluída'&&(o.data||o.concluidaEm||'').slice(0,10)>=ini&&(o.data||o.concluidaEm||'').slice(0,10)<=fim)
    .sort((a,b)=>(a.data||a.concluidaEm||'').localeCompare(b.data||b.concluidaEm||''));
  if(!lista.length){ toast('Nenhuma OS concluída nesse período'); return; }
  if(!window.JSZip||!window.jspdf){ toast('Gerador de backup ainda carregando, tente de novo em instantes'); return; }
  if(btn) btn.disabled=true;
  try{
    if(st) st.textContent=`Gerando resumo…`;
    const zip=new JSZip();
    const pasta=zip.folder(`OS ${ini} a ${fim}`);
    const resumo=await montarResumoBackupPdf(lista,ini,fim);
    pasta.file('00-Resumo.pdf',resumo.output('arraybuffer'));
    for(let i=0;i<lista.length;i++){
      const o=lista[i];
      if(st) st.textContent=`Gerando PDF ${i+1} de ${lista.length}…`;
      const r=await montarOsPdf(o.id);
      if(r) pasta.file(r.nomeArq,r.doc.output('arraybuffer'));
    }
    if(st) st.textContent='Compactando .zip…';
    const blob=await zip.generateAsync({type:'blob'});
    const nomeOficina=(S.oficina&&S.oficina.nome?S.oficina.nome:'oficina').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_');
    const nomeZip=`Backup-OS-${nomeOficina}-${ini}_a_${fim}.zip`;
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=u; a.download=nomeZip; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    if(st) st.textContent=`Backup gerado: ${lista.length} OS.`;
    toast(`Backup gerado com ${lista.length} OS`);
  }catch(e){ erroSalvar('gerar o backup',e); if(st) st.textContent=''; }
  if(btn) btn.disabled=false;
}

const diasAtraso = o => Math.max(0,Math.floor((Date.now()-new Date(o.data||o.concluidaEm))/864e5));
function cobrancasAtrasadas(){
  return S.os.filter(o=>o.status==='Concluída'&&!o.pago).map(o=>{

// ---- Pix (cobrança e QR code para pagamento presencial) ----
// dados da própria oficina pra montar o Pix: pra quem não é superadmin, S.oficina já vem carregado
// no login; o superadmin (Matriz) não carrega S.oficina, então busca o mesmo registro em S.oficinas
function minhaOficinaDados(){
  if(S.oficina) return S.oficina;
  return (S.oficinas||[]).find(o=>o.id===(S.perfil&&S.perfil.oficinaId))||null;
}
function pixTLV(id,valor){ return id+String(valor.length).padStart(2,'0')+valor; }
// Pix exige texto sem acento, maiúsculo, só letras/números/espaço — "limpa" nome/cidade pro padrão
function limparPixTexto(s,max){
  return ((s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,max))||'NA';
}
function crc16Pix(str){
  let crc=0xFFFF;
  for(let i=0;i<str.length;i++){
    crc^=str.charCodeAt(i)<<8;
    for(let j=0;j<8;j++) crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
// monta o "Pix Copia e Cola" (padrão EMV do Banco Central) a partir da chave cadastrada da oficina
function montarPixPayload(chave,nome,cidade,valor,txid){
  chave=(chave||'').trim(); if(!chave) return null;
  const nomeF=limparPixTexto(nome,25), cidadeF=limparPixTexto(cidade,15);
  const txidF=(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***';
  let p=pixTLV('00','01');
  p+=pixTLV('26',pixTLV('00','br.gov.bcb.pix')+pixTLV('01',chave));
  p+=pixTLV('52','0000')+pixTLV('53','986');
  if(valor>0) p+=pixTLV('54',(+valor).toFixed(2));
  p+=pixTLV('58','BR')+pixTLV('59',nomeF)+pixTLV('60',cidadeF);
  p+=pixTLV('62',pixTLV('05',txidF));
  p+='6304';
  return p+crc16Pix(p);
}

function msgCobranca(o,v){

  const itens=o.itens||[];

  const pecasT=pecasTotal(o), mo=+o.maoObra||0;
  return `Olá${v.clienteNome?', '+v.clienteNome:''}! Segue o resumo da manutenção do veículo *${o.placa}*${v.modelo?' ('+v.modelo+')':''}:\nKm atual: ${fmtKm(o.km)}\n\n🔧 *Peças e serviços:*\n${itensTxt}${pecasT>0?`\n*Subtotal peças: ${fmtBRL(pecasT)}*`:''}\n\n👨‍🔧 *Mão de obra: ${fmtBRL(mo)}*\n\n💰 *Total: ${fmtBRL(osTotal(o))}*${pixTextoCobranca(o)}\n\nQualquer dúvida, estou à disposição!`;
}
