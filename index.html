<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{
  --bg:#f3f4f0; --panel:#ffffff; --ink:#1b1f24; --muted:#5d6570; --line:#d9dcd6;
  --brand:#0d3b66; --brand-ink:#ffffff; --ok:#1f7a4d; --warn:#c77700; --bad:#b3261e;
  --ok-bg:#e3f3ea; --warn-bg:#fff1d6; --bad-bg:#fbe3e1; --soft:#e9ebe6; --mec:#1f6f43;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --panel:#1e2228; --ink:#e8eaed; --muted:#9aa3ad; --line:#333a42;
    --brand:#3f7fc2; --brand-ink:#ffffff; --ok:#5fcf8f; --warn:#f0b34a; --bad:#f2837a;
    --ok-bg:#1d3328; --warn-bg:#3b2f14; --bad-bg:#3d1f1c; --soft:#272c33; --mec:#2e8f5a;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1e2228; --ink:#e8eaed; --muted:#9aa3ad; --line:#333a42;
  --brand:#3f7fc2; --brand-ink:#ffffff; --ok:#5fcf8f; --warn:#f0b34a; --bad:#f2837a;
  --ok-bg:#1d3328; --warn-bg:#3b2f14; --bad-bg:#3d1f1c; --soft:#272c33; --mec:#2e8f5a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--brand);color:var(--brand-ink);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body.mec header{background:var(--mec)}
header h1{margin:0;font:700 21px/1 "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;letter-spacing:.3px}
header .sub{opacity:.8;font-size:13px}
#status{margin-left:auto;font-size:12px;opacity:.85}
header .lnk{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:6px 10px;font:500 13px "IBM Plex Sans";cursor:pointer}
nav{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:500 14px "IBM Plex Sans";color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--brand)}
body.mec nav button.on{border-bottom-color:var(--mec)}
nav button .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;margin-left:6px}
main{padding:18px 20px;max-width:1200px;margin:0 auto}
body.mec main{max-width:720px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0;font:600 18px "IBM Plex Sans"}
.sp{flex:1}
button.pri,button.sec,button.ghost,button.big{border-radius:6px;padding:8px 14px;font:500 14px "IBM Plex Sans";cursor:pointer;border:1px solid transparent}
button.pri{background:var(--brand);color:var(--brand-ink)}
body.mec button.pri{background:var(--mec)}
button.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
button.ghost{background:none;color:var(--muted);padding:4px 8px}
button.danger{color:var(--bad)}
button.big{width:100%;padding:18px;font-size:18px;font-weight:600;background:var(--mec);color:#fff;border-radius:10px;margin-bottom:10px}
button.big.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:15px "IBM Plex Sans";padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
input.xl{font-size:26px;font-weight:600;text-align:center;letter-spacing:2px;padding:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card .v{font:700 30px/1 "IBM Plex Sans Condensed",sans-serif}
.card .l{color:var(--muted);font-size:13px;margin-top:6px}
.card.bad .v{color:var(--bad)} .card.warn .v{color:var(--warn)} .card.ok .v{color:var(--ok)}
.tbl{width:100%;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.neu{background:var(--soft);color:var(--muted)}
.plate{font:600 14px "IBM Plex Sans Condensed",monospace;letter-spacing:1px;background:var(--soft);padding:2px 6px;border-radius:4px;white-space:nowrap}
.empty{padding:36px;text-align:center;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
.ov.on{display:flex}
.md{background:var(--panel);border-radius:10px;width:100%;max-width:680px;padding:20px;border:1px solid var(--line)}
.md h3{margin:0 0 14px;font:600 18px "IBM Plex Sans"}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.calc{background:var(--soft);padding:10px 12px;border-radius:6px;font-size:13px;margin-top:8px}
@media (max-width:600px){.grid{grid-template-columns:1fr} main{padding:12px}}
.alertlist{display:grid;gap:8px;margin-bottom:18px}
.al{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.al.bad{border-left-color:var(--bad)}
h4{margin:18px 0 8px;font:600 15px "IBM Plex Sans"}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;display:none;z-index:30}
.plan-item{display:grid;grid-template-columns:1fr 100px 100px 40px;gap:8px;align-items:center;margin-bottom:6px}
.tier-item{display:grid;grid-template-columns:110px 110px 1fr;gap:8px;align-items:center;margin-bottom:6px}
/* timeline (histórico por placa) */
.tl{position:relative;padding-left:22px;margin-top:6px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ev{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.ev:before{content:"";position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--bg)}
.ev.open:before{background:var(--warn)}
.ev.sin:before{background:var(--bad)}
.ev .hd{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.ev .hd b{font-size:15px}
.ev ul{margin:8px 0 0;padding-left:18px}
.ev li{margin:2px 0}
.ev .rel{margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:6px;font-size:14px;white-space:pre-wrap}
.ph{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ph img{height:64px;border-radius:6px;border:1px solid var(--line);object-fit:cover;cursor:pointer}
/* mecânico */
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.step h3{margin:0 0 10px;font:600 17px "IBM Plex Sans"}
.shot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:520px){.shot{grid-template-columns:1fr}}
.shot label.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:10px;padding:16px 8px;cursor:pointer;color:var(--ink);font-size:15px;text-align:center;min-height:110px;background:var(--bg)}
.shot label.btn.done{border-style:solid;border-color:var(--ok)}
.shot label.btn img{max-height:90px;max-width:100%;border-radius:6px}
.shot label.btn input{display:none}
.sug{position:relative}
.sug .list{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:0 0 8px 8px;z-index:5;max-height:220px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.sug .list div{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sug .list div:hover,.sug .list div.hl{background:var(--soft)}
.sug .list small{display:block;color:var(--muted)}
.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item .nm{flex:1}
.lastinfo{padding:8px 10px;border-radius:6px;font-size:13px;margin:6px 0;background:var(--warn-bg);color:var(--warn)}
.lastinfo.ok{background:var(--ok-bg);color:var(--ok)}
.lastinfo.neu{background:var(--soft);color:var(--muted)}
.osrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:40;cursor:pointer}
.lightbox.on{display:flex}.lightbox img{max-width:96vw;max-height:94vh;border-radius:8px}
/* relatórios: mini gráficos de barra em CSS puro */
.barchart{display:grid;gap:8px;margin-bottom:18px}
.brow{display:grid;grid-template-columns:74px 1fr 96px;gap:8px;align-items:center}
.brow .blabel{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .blabel.plate{font:600 13px "IBM Plex Sans Condensed",monospace;color:var(--ink);background:none;padding:0;letter-spacing:1px}
.btrack{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.bfill{background:var(--brand);height:100%;border-radius:4px;min-width:2px}
.bfill.warn{background:var(--warn)}
.bval{font-size:12px;text-align:right;white-space:nowrap;color:var(--ink)}
@media (max-width:520px){.brow{grid-template-columns:56px 1fr 76px}}
</style>
</head>

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Adaptador: mesma interface do app (collection/doc/onSnapshot) sobre tabelas Supabase (id text, data jsonb)
const genId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function mkDb(){
  const tbl=(col)=>({
    path:col,
    async get(){ const {data,error}=await sb.from(col).select('id,data'); if(error) throw error; return {docs:(data||[]).map(r=>({id:r.id,exists:true,data:()=>r.data})),size:(data||[]).length,empty:!(data||[]).length}; },
    async add(d){ const id=genId(); const {error}=await sb.from(col).insert({id,data:d}); if(error) throw error; return docRef(col,id); },
    doc(id){ return docRef(col,id||genId()); },
    onSnapshot(next,err){
      const refetch=async()=>{ try{ const {data,error}=await sb.from(col).select('id,data'); if(error) throw error; next({docs:(data||[]).map(r=>({id:r.id,exists:true,data:()=>r.data})),size:(data||[]).length,empty:!(data||[]).length}); }catch(e){ if(err) err({code:'unavailable',message:String(e.message||e)}); } };
      refetch();
      const ch=sb.channel('rt-'+col+'-'+genId()).on('postgres_changes',{event:'*',schema:'public',table:col},()=>refetch()).subscribe();
      const iv=setInterval(refetch,60000);
      return ()=>{ sb.removeChannel(ch); clearInterval(iv); };
    }
  });
  const docRef=(col,id)=>({
    id, path:col+'/'+id,
    async get(){ const {data,error}=await sb.from(col).select('id,data').eq('id',id).maybeSingle(); if(error) throw error; return {id,exists:!!data,data:()=>data?data.data:undefined}; },
    async set(d){ const {error}=await sb.from(col).upsert({id,data:d}); if(error) throw error; },
    async update(d){ const cur=await this.get(); const base=cur.exists?cur.data():{}; const {error}=await sb.from(col).upsert({id,data:{...base,...d}}); if(error) throw error; },
    async delete(){ const {error}=await sb.from(col).delete().eq('id',id); if(error) throw error; },
    onSnapshot(next,err){
      const refetch=async()=>{ try{ next(await this.get()); }catch(e){ if(err) err({code:'unavailable',message:String(e.message||e)}); } };
      refetch();
      const ch=sb.channel('rt-'+col+'-'+id+'-'+genId()).on('postgres_changes',{event:'*',schema:'public',table:col,filter:'id=eq.'+id},()=>refetch()).subscribe();
      return ()=>sb.removeChannel(ch);
    }
  });
  return { collection:tbl, doc:(path)=>{ const [c,i]=path.split('/'); return docRef(c,i); } };
}

});

const fmtBRL = v => (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function catalogo(){
  const m=new Map(); for(const [n,km,d] of DEF_PECAS) m.set(slug(n),{id:slug(n),nome:n,km,dias:d,usos:0,critico:CRITICOS_DEF.includes(slug(n))});
  for(const p of S.pecas) m.set(p.id,{...m.get(p.id),...p});
  return [...m.values()];
}

function osDoVeic(vId){ return S.os.filter(o=>o.veiculoId===vId).sort((a,b)=>(b.data||'').localeCompare(a.data||'')); }
function ultimaTroca(vId,pecaId){
  for(const o of osDoVeic(vId)) if((o.itens||[]).some(i=>i.pecaId===pecaId)) return o;
  return null;
}
const OLEO='oleo-do-motor';
const destaque=p=>p.critico||p.id===OLEO;
function trocaInfo(o,pecaId){ const it=(o.itens||[]).find(i=>i.pecaId===pecaId)||{}; return {km:it.kmTroca?+it.kmTroca:(+o.km||0),data:it.dataTroca||o.data}; }
function alertasVeic(v,kmRef){
  const out=[]; const kmAtual=kmRef!=null?+kmRef:(+v.km||0);
  for(const p of catalogo()){
    if(!p.km&&!p.dias) continue;
    const ult=ultimaTroca(v.id,p.id);
    if(!ult){ out.push({v,p,lvl:'neu',txt:'sem registro'}); continue; }
    let lvl=null,txt='';
    const avisoKm=p.critico?Math.max(S.cfg.avisoKm,5000):p.id===OLEO?Math.max(S.cfg.avisoKm,1000):S.cfg.avisoKm;
    const ti=trocaInfo(ult,p.id);
    if(p.km>0){ const prox=ti.km+p.km, falta=prox-kmAtual;
      if(falta<=0){lvl='bad';txt=`vencida há ${fmtKm(-falta)} (troca aos ${fmtKm(prox)}, feita a ${fmtKm(ti.km)} em ${fmtD(ti.data)})`;} else if(falta<=avisoKm){lvl='warn';txt=`vence em ${fmtKm(falta)} (troca aos ${fmtKm(prox)}, feita a ${fmtKm(ti.km)} em ${fmtD(ti.data)})`;} else txt=`próx. ${fmtKm(prox)}`; }
    if(p.dias>0){ const d=new Date(ti.data.slice(0,10)); d.setDate(d.getDate()+p.dias); const dias=Math.round((d-new Date())/864e5); let l2=null,t2;
      if(dias<0){l2='bad';t2=`vencida há ${-dias} dias`;} else if(dias<=S.cfg.avisoDias){l2='warn';t2=`vence em ${dias} dias`;} else t2=`próx. ${fmtD(d.toISOString())}`;
      if(l2==='bad'||(l2==='warn'&&lvl!=='bad')){lvl=l2;txt=t2;} else if(!txt) txt=t2; else if(!lvl) txt+=` · ${t2}`; }
    out.push({v,p,lvl:lvl||'ok',txt,ult});
  }
  return out;
}
function statusVeic(v){ const al=alertasVeic(v); return al.some(a=>a.lvl==='bad')?'bad':al.some(a=>a.lvl==='warn')?'warn':'ok'; }

function preservar(root){ const k={vals:{},focus:null,sel:null}; for(const id of PRESERVE){ const e=document.getElementById(id); if(e&&e.value!=='') k.vals[id]=e.value; } const a=document.activeElement; if(a&&a.id&&root.contains(a)){ k.focus=a.id; try{k.sel=[a.selectionStart,a.selectionEnd];}catch(e){} } return k; }
function restaurar(k){ for(const [id,v] of Object.entries(k.vals)){ const e=document.getElementById(id); if(e&&!e.disabled&&e.value!==v) e.value=v; } if(k.focus){ const e=document.getElementById(k.focus); if(e){ e.focus(); if(k.sel&&k.sel[0]!=null){ try{e.setSelectionRange(k.sel[0],k.sel[1]);}catch(x){} } } } }

function timelineHtml(v, opts={}){
  const podeMo=podeFinalizarOs();
  const lst=osDoVeic(v.id); const sins=S.sin.filter(s=>s.veiculoId===v.id);
  const evs=[...lst.map(o=>({t:'os',d:o.data||'',o})),...sins.map(s=>({t:'sin',d:s.data||'',s}))].sort((a,b)=>b.d.localeCompare(a.d));
  if(!evs.length) return '<div class="empty">Nenhuma intervenção registrada para esta placa ainda.</div>';
  let h='<div class="tl">';
  for(const e of evs){
    if(e.t==='sin'){ h+=`<div class="ev sin"><div class="hd"><b>${fmtD(e.d)}</b><span class="tag bad">Sinistro</span><span class="muted">${esc(e.s.status)}</span></div><div>${esc(e.s.desc)}</div></div>`; continue; }
    const o=e.o; const tot=podeMo?osTotal(o):pecasTotal(o);
    h+=`<div class="ev ${o.status==='Aberta'?'open':''}"><div class="hd"><b>${fmtD(o.data)}</b><span class="plate">${fmtKm(o.km)}</span><span class="tag ${o.status==='Aberta'?'warn':'ok'}">${esc(o.status)}</span><span class="muted">${esc(o.mecanico||'')}${o.oficina?' · '+esc(o.oficina):''}</span><span class="sp"></span><b>${fmtBRL(tot)}</b>${opts.edit?`<button class="sec" onclick="abrirOs('${o.id}')">Abrir OS</button>`:''}</div>`;
    if((o.itens||[]).length){ h+='<ul>'; for(const i of o.itens) h+=`<li>${esc(i.nome)}${(+i.qtd||1)>1?' ×'+i.qtd:''}${i.custo?` — ${fmtBRL((+i.custo)*(+i.qtd||1))}`:''}${i.obs?` <span class="muted">(${esc(i.obs)})</span>`:''}${i.retroativo?` <span class="tag neu">informado · ${fmtKm(i.kmTroca)}</span>`:''}${tagEditado(i)}</li>`; h+='</ul>'; }
    if(podeMo&&(o.maoObra||o.maoObraEdit)) h+=`<div class="muted">Mão de obra: ${fmtBRL(o.maoObra)}${tagMo(o)}</div>`;
    if(o.relato) h+=`<div class="rel">${esc(o.relato)}</div>`;
    const fotos=[o.fotoPlaca,o.fotoKm,...(o.fotos||[])].filter(Boolean);
    if(fotos.length) h+='<div class="ph">'+fotos.map(f=>`<img src="${blob(f)}" onclick="lightbox('${f}')" loading="lazy">`).join('')+'</div>';
    h+='</div>';
  }
  return h+'</div>';
}

function cpfValido(c){c=c.replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let r=(s*10)%11;if(r===10)r=0;if(r!==+c[9])return false;s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);r=(s*10)%11;if(r===10)r=0;return r===+c[10];}

async function salvarMec(id){
  const cpf=val('mc_cpf'), tel=val('mc_tel'), email=val('mc_email').toLowerCase(), nome=val('mc_nome'), pass=document.getElementById('mc_pass').value, papel=val('mc_papel'), ativo=val('mc_ativo')==='Ativo';
  if(!nome){toast('Informe o nome');return;}
  if(cpf&&!cpfValido(cpf)){toast('CPF inválido');return;}
  if(!id){
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('E-mail inválido');return;}
    if(pass.length<6){toast('Senha com pelo menos 6 caracteres');return;}
    const tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const {data,error}=await tmp.auth.signUp({email,password:pass});
    if(error){toast('Erro: '+error.message);return;}
    if(!data.user){toast('Não foi possível criar o usuário');return;}
    if(data.user.identities&&!data.user.identities.length){toast('Este e-mail já está cadastrado');return;}
    const d={nome,cpf,telefone:tel,email,papel,ativo,criadoEm:agoraIso()};
    const {error:e2}=await sb.from('perfis').upsert({id:data.user.id,data:d}); if(e2){toast('Erro ao salvar perfil: '+e2.message);return;}
  } else {
    const ex=S.mecs.find(m=>m.id===id)||{}; const d={...ex,nome,cpf,telefone:tel,papel,ativo}; delete d.id;
    const {error}=await sb.from('perfis').upsert({id,data:d}); if(error){toast('Erro: '+error.message);return;}
    if(pass&&id===S.user.id){ const {error:e3}=await sb.auth.updateUser({password:pass}); if(e3) toast('Senha não alterada: '+e3.message); }
  }
  fechar(); toast('Usuário salvo');
}

async function redimensionar(file,max=1280){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',.82));
}
async function foto(inp,tipo){

      if(j&&j.placa&&tipo==='placa'&&!nova.placa) nova.placa=normPlaca(j.placa);

      if(j&&tipo==='km'&&j.placa&&!nova.placa) nova.placa=normPlaca(j.placa);
    }catch(e){ if(e.code==='not_granted') S.canOcr=false; console.warn('ocr',e); }
    nova.lendo=false; render();
  }
}

// ============ MODO GESTÃO ============
// ---- relatórios: métricas por veículo (paradas, gasto, km rodado, dias acompanhados) ----
function metricasVeic(v,osList){
  const os=osList.filter(o=>o.veiculoId===v.id);
  const paradas=os.length;
  const gasto=os.reduce((s,o)=>s+osTotal(o),0);
  const kms=os.map(o=>+o.km||0).filter(k=>k>0);
  const kmRodado=kms.length>=2?Math.max(...kms)-Math.min(...kms):0;
  const datas=os.map(o=>o.concluidaEm||o.data).filter(Boolean).sort();
  const dias=datas.length>=2?Math.max(1,Math.round((new Date(datas[datas.length-1])-new Date(datas[0]))/864e5)):null;
  return {v,paradas,gasto,kmRodado,dias,
    custoPorParada:paradas?gasto/paradas:0,
    custoPorKm:kmRodado?gasto/kmRodado:null,
    custoPorDia:dias?gasto/dias:null};
}
function relView(m){
  const periodo=S.relPeriodo||12, ordem=S.relOrdem||'paradas';
  const osConcluidas=S.os.filter(o=>o.status==='Concluída');
  const lim=periodo==='tudo'?null:new Date(Date.now()-periodo*30*864e5);
  const osPeriodo=osConcluidas.filter(o=>!lim||new Date(o.concluidaEm||o.data)>=lim);
  const porVeic=S.veic.map(v=>metricasVeic(v,osPeriodo)).filter(x=>x.paradas>0);
  const totalGasto=porVeic.reduce((s,x)=>s+x.gasto,0);
  const totalParadas=porVeic.reduce((s,x)=>s+x.paradas,0);
  const totalKm=porVeic.reduce((s,x)=>s+x.kmRodado,0);
  const mediaPorVeic=porVeic.length?totalGasto/porVeic.length:0;
  const mediaPorParada=totalParadas?totalGasto/totalParadas:0;
  const custoPorKmGeral=totalKm?totalGasto/totalKm:null;
  // gasto por mês — últimos 12 meses fixos, independente do filtro, para ver a tendência
  const porMes={};
  for(const o of osConcluidas){ const d=(o.concluidaEm||o.data||'').slice(0,7); if(d) porMes[d]=(porMes[d]||0)+osTotal(o); }
  const nomesMes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const meses12=[...Array(12)].map((_,i)=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-(11-i)); return d.toISOString().slice(0,7); });
  const maxMes=Math.max(1,...meses12.map(mm=>porMes[mm]||0));
  const ranking=[...porVeic].sort((a,b)=>b.paradas-a.paradas).slice(0,8);
  const maxParadas=Math.max(1,...ranking.map(x=>x.paradas));

  const f=inp.files[0]; if(!f) return; let d; try{ d=JSON.parse(await f.text()); }catch(e){ toast('Arquivo inválido'); return; }
  const n=(d.veiculos||[]).length+(d.os||[]).length+(d.sinistros||[]).length+(d.pecas||[]).length;
  if(!confirm(`Importar ${n} registros? Registros com o mesmo id são sobrescritos. Fotos não são importadas.`)) return;
  const limpa=o=>{ const c={...o}; delete c.id; return c; };
  for(const [col,arr] of [['veiculos',d.veiculos],['os',d.os],['sinistros',d.sinistros],['pecas',d.pecas]]) for(const r of (arr||[])){ const c=limpa(r); if(col==='os'){ c.fotoPlaca=null; c.fotoKm=null; c.fotos=[]; } await S.db.doc(col+'/'+r.id).set(c); }
  if(d.config) await S.db.doc('config/geral').set(d.config);
  toast('Importação concluída');
}
function exportarJson(){

  const b=new Blob([JSON.stringify(dump,null,1)],{type:'application/json'}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download='carsz-manutencao-backup-'+hoje()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('Se o download não iniciar, copie pelo botão abaixo'); const ta=document.createElement('textarea'); ta.value=JSON.stringify(dump); ta.style.cssText='width:100%;height:120px;margin-top:8px'; ta.readOnly=true; ta.onclick=()=>ta.select(); document.getElementById('seed_st').parentElement.parentElement.appendChild(ta);
}

// ---- detalhe/histórico veículo (gestão) ----
function detVeic(id){
  const v=S.veic.find(x=>x.id===id); if(!v)return;
  const al=alertasVeic(v).filter(a=>a.lvl!=='neu');
  const tot=osDoVeic(id).reduce((s,x)=>s+osTotal(x),0);
  let h=`<h3><span class="plate">${esc(v.placa)}</span> ${esc(v.modelo)} ${esc(v.ano)}</h3><div class="muted">${esc(v.empresa)} · ${fmtKm(v.km)} · ${esc(v.status)} · locatário: ${esc(v.locatario||'—')} · ${idade(v)} anos → ${pctCopart(v)}% coparticipação · total gasto ${fmtBRL(tot)}</div>`;
  if(al.length){ h+='<h4>Próximas trocas</h4><div class="row">'+al.map(a=>`<span class="tag ${a.lvl}">${esc(a.p.nome)}: ${a.txt}</span>`).join('')+'</div>'; }
  h+='<h4>Histórico de intervenções</h4>'+timelineHtml(v,{edit:true});
  h+=`<div class="act"><button class="ghost danger" onclick="delVeic('${v.id}')">Excluir veículo</button><span class="sp"></span><button class="sec" onclick="fechar()">Fechar</button></div>`;
  abrir(h);
}
function abrir(h){ document.getElementById('md').innerHTML=h; document.getElementById('ov').classList.add('on'); }
function fechar(){ document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') fechar(); });

  <div><label>Placa</label><input id="f_placa" value="${esc(v.placa)}" style="text-transform:uppercase"></div><div><label>Ano</label><input id="f_ano" type="number" value="${esc(v.ano)}"></div>

  <div><label>Empresa proprietária</label><select id="f_emp">${opt(['Carsz Rent LTDA','Matesz Soluções Financeiras LTDA','MF Rastreadores'],v.empresa)}</select></div>

  <div><label>Situação</label><select id="f_st">${opt(['Locado','Disponível','Em manutenção','Sinistrado','Baixado'],v.status)}</select></div>

}
async function salvarVeic(id){
  const d={placa:normPlaca(val('f_placa')),ano:val('f_ano'),modelo:val('f_modelo'),empresa:val('f_emp'),km:+val('f_km')||0,locatario:val('f_loc'),status:val('f_st'),renavam:val('f_ren'),rastreador:val('f_rast'),obs:val('f_obs')};
  if(!d.placa||!d.modelo){toast('Informe placa e modelo');return;}
  if(!id && S.veic.some(v=>v.placa===d.placa)){toast('Placa já cadastrada');return;}
  if(id) await S.db.doc('veiculos/'+id).set(d); else await S.db.collection('veiculos').add(d);
  fechar(); toast('Veículo salvo');
}
function formKm(id){ const v=S.veic.find(x=>x.id===id); abrir(`<h3>Atualizar km · <span class="plate">${esc(v.placa)}</span></h3><label>Km atual (era ${fmtKm(v.km)})</label><input id="f_km" type="number" value="${v.km||0}"><div class="act"><button class="sec" onclick="fechar()">Cancelar</button><button class="pri" onclick="salvarKm('${id}')">Salvar</button></div>`); }
async function salvarKm(id){ const v=S.veic.find(x=>x.id===id); const km=+val('f_km')||0; if(km<(v.km||0)&&!confirm('Km menor que o atual. Confirmar?'))return; await S.db.doc('veiculos/'+id).update({km}); fechar(); toast('Km atualizado'); }
async function delVeic(id){ if(!confirm('Excluir o veículo? As OS ficam no histórico.'))return; await S.db.doc('veiculos/'+id).delete(); fechar(); toast('Veículo excluído'); }
function formSin(id){
  const x=id?S.sin.find(s=>s.id===id):{data:hoje(),status:'Aberto'};
  const vs=[...S.veic].sort((a,b)=>(a.placa||'').localeCompare(b.placa||''));
  abrir(`<h3>${id?'Editar':'Registrar'} sinistro</h3><div class="grid">
  <div><label>Veículo</label><select id="s_v">${vs.map(v=>`<option value="${v.id}" ${v.id===x.veiculoId?'selected':''}>${esc(v.placa)} · ${esc(v.modelo)}</option>`).join('')}</select></div><div><label>Data</label><input id="s_data" type="date" value="${x.data}"></div>
  <div class="full"><label>Locatário no momento</label><input id="s_loc" value="${esc(x.locatario)}"></div>
  <div class="full"><label>Ocorrência</label><textarea id="s_desc">${esc(x.desc)}</textarea></div>
  <div><label>Seguradora / sinistro nº</label><input id="s_seg" value="${esc(x.seguradora)}"></div><div><label>B.O.</label><input id="s_bo" value="${esc(x.bo)}"></div>
  <div><label>Franquia (R$)</label><input id="s_fr" type="number" step="0.01" value="${x.franquia||''}"></div><div><label>Terceiro envolvido</label><input id="s_ter" value="${esc(x.terceiro)}"></div>
  <div><label>Status</label><select id="s_st">${opt(['Aberto','Em reparo','Encerrado'],x.status)}</select></div><div><label>Culpa</label><select id="s_culpa">${opt(['A apurar','Locatário','Terceiro','Sem culpa'],x.culpa||'A apurar')}</select></div></div>
  <div class="act">${id?`<button class="ghost danger" onclick="delSin('${id}')">Excluir</button><span class="sp"></span>`:''}<button class="sec" onclick="fechar()">Cancelar</button><button class="pri" onclick="salvarSin('${id||''}')">Salvar</button></div>`);
}
async function salvarSin(id){ const d={veiculoId:val('s_v'),data:val('s_data'),locatario:val('s_loc'),desc:val('s_desc'),seguradora:val('s_seg'),bo:val('s_bo'),franquia:+val('s_fr')||0,terceiro:val('s_ter'),status:val('s_st'),culpa:val('s_culpa')};
  if(!d.veiculoId||!d.desc){toast('Informe veículo e ocorrência');return;} if(id) await S.db.doc('sinistros/'+id).set(d); else await S.db.collection('sinistros').add(d); fechar(); toast('Sinistro salvo'); }
async function delSin(id){ if(!confirm('Excluir este sinistro?'))return; await S.db.doc('sinistros/'+id).delete(); fechar(); toast('Sinistro excluído'); }

// ============ boot ============
function subCol(col,key){ S.db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>{ document.getElementById('status').textContent='Erro: '+e.code; }); }
if(location.hash.startsWith('#mecanico')){ S.mec=true; S.view='mnova'; }
S.db=mkDb(); S.assets=mkAssets(); S.cfg=JSON.parse(JSON.stringify(DEF_CFG)); S.mecsOk=true;
render();
(async()=>{
  const st=document.getElementById('status');
  if(SUPABASE_URL.startsWith('COLE_')){ st.textContent='Configure SUPABASE_URL e SUPABASE_ANON_KEY no index.html'; return; }
  st.textContent='Sincronizado';
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,sess)=>{ if(ev==='SIGNED_OUT'){ S.user=null; S.perfil=null; render(); } if(ev==='PASSWORD_RECOVERY'&&sess) carregarSessao(sess); });
  S.db.doc('config/geral').onSnapshot(s=>{ S.cfg=s.exists?{...DEF_CFG,...s.data()}:JSON.parse(JSON.stringify(DEF_CFG)); render(); });
  subCol('veiculos','veic'); subCol('os','os'); subCol('sinistros','sin'); subCol('pecas','pecas'); subCol('perfis','mecs');
  await carregarSessao(session);
})();
