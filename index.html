// baixa uma imagem (ex: logo de uma oficina) e converte para data URL, formato aceito pelo
// addImage do jsPDF — se falhar (rede, CORS etc.), devolve null e o PDF segue sem a logo
async function imgParaDataUrl(url){
  try{
    const resp=await fetch(url); if(!resp.ok) throw new Error('http '+resp.status);
    const blob=await resp.blob();
    return await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });
  }catch(e){ console.warn('logo no pdf indisponível:',e); return null; }
}
// ---- monta o PDF resumido da OS e devolve {doc,nomeArq,o} (ou null) — usado tanto pela
// pré-visualização quanto pelo download/envio, pra não duplicar o layout nos dois lugares ----
// gera o QR code do Pix fora da tela (QRCode.js desenha num elemento invisível) e devolve a
// imagem como data URL, pra poder entrar no PDF com doc.addImage
async function qrCodeDataUrl(texto,tamanho){
  return new Promise(resolve=>{
    if(!window.QRCode){ resolve(null); return; }
    const div=document.createElement('div');
    div.style.position='fixed'; div.style.left='-9999px'; div.style.top='0';
    document.body.appendChild(div);
    try{ new QRCode(div,{text:texto,width:tamanho,height:tamanho,correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ try{document.body.removeChild(div);}catch(x){} resolve(null); return; }
    setTimeout(()=>{
      const canvas=div.querySelector('canvas');
      let url=null; try{ url=canvas?canvas.toDataURL('image/png'):null; }catch(e){}
      try{ document.body.removeChild(div); }catch(x){}
      resolve(url);
    },80);
  });
}
async function montarOsPdf(id){
  const o=S.os.find(x=>x.id===id); if(!o){toast('OS não encontrada');return null;}
  const v=S.veic.find(x=>x.id===o.veiculoId)||{};
  const podeMo=podeFinalizarOs();
  if(!window.jspdf){toast('Gerador de PDF ainda carregando, tente de novo em instantes');return null;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const margin=16, pageW=210, lh=7; let y=20;
  const BRAND=[13,59,102]; // mesmo azul da marca usada no app (--brand), pra dar identidade ao papel
  const linha=()=>{ doc.setDrawColor(215); doc.line(margin,y,pageW-margin,y); y+=5; };
  const tituloSecao=(txt)=>{ doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...BRAND); doc.text(txt,margin,y); doc.setTextColor(0); doc.setFont('helvetica','normal'); doc.setFontSize(12); y+=6.5; };
  const quebraSeNecessario=(margemExtra)=>{ if(y>274-(margemExtra||0)){ doc.addPage(); desenharMarcaDagua(); y=20; } };
  // marca no PDF: oficina parceira usa o próprio nome/logo, a Oficina Matriz (Carsz) continua com "CARSZ"
  const marcaTxt=(S.oficina&&S.oficina.id!=='matriz')?S.oficina.nome:'CARSZ';
  const logoUrl=S.oficina&&S.oficina.logo&&S.oficina.logo.url;
  const logoDataUrl=logoUrl?await imgParaDataUrl(logoUrl):null;
  const ofDados=minhaOficinaDados();

  // ---- marca d'água: a logo em tamanho grande, bem suave, centralizada atrás de todo o conteúdo
  // (em toda página, inclusive se a OS virar mais de uma folha) ----
  const desenharMarcaDagua=()=>{
    if(!logoDataUrl) return;
    try{
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({opacity:0.06}));
      const wSize=150;
      doc.addImage(logoDataUrl,'JPEG',(pageW-wSize)/2,(297-wSize)/2,wSize,wSize);
      doc.restoreGraphicsState();
    }catch(e){ console.warn('marca d\'água indisponível:',e); }
  };
  desenharMarcaDagua();

  // ---- cabeçalho: bem mais espaço pra logomarca, e o nome/endereço da oficina com hierarquia de
  // fonte clara (nome grande, resto em cinza menor) — igual um papel timbrado ----
  const logoSize=32;
  const headerTextX=logoDataUrl?margin+logoSize+8:margin;
  doc.setFontSize(9); doc.setTextColor(150); doc.text(`Nº OS: ${o.id}`,pageW-margin,14,{align:'right'}); doc.setTextColor(0);
  if(logoDataUrl){ try{ doc.addImage(logoDataUrl,'JPEG',margin,14,logoSize,logoSize); }catch(e){ console.warn(e); } }
  let hy=22;
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(...BRAND);
  doc.text(marcaTxt,headerTextX,hy); hy+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(120);
  doc.text('Ordem de Serviço',headerTextX,hy); hy+=6;
  doc.setTextColor(0);
  // placa do serviço ainda em andamento — avisa já no cabeçalho que o valor é parcial, pra não
  // confundir o cliente com um "fechamento" que ainda pode mudar até a conclusão
  if(o.status==='Aberta'){
    // fonte padrão do PDF (helvetica) não tem o glifo "⚠" (vira "&" impresso) — usa só texto; e
    // quebra a linha pela largura disponível (que varia com o tamanho da logo), senão a frase
    // passa da borda da página e é cortada, sem aviso nenhum na tela
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(217,119,6);
    const avisoLinhas=doc.splitTextToSize('AVISO: serviço em andamento — valores parciais, sujeitos a alteração até a conclusão.',pageW-margin-headerTextX);
    doc.text(avisoLinhas,headerTextX,hy); hy+=avisoLinhas.length*4.2+1.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(0);
  }
  const infoOficina=[ofDados&&ofDados.endereco,ofDados&&ofDados.telefoneOficina?`Tel: ${ofDados.telefoneOficina}`:null,ofDados&&ofDados.documento?`CNPJ/CPF: ${ofDados.documento}`:null].filter(Boolean);
  doc.setFontSize(9); doc.setTextColor(110);
  for(const l of infoOficina){ doc.text(l,headerTextX,hy); hy+=4.5; }
  doc.setTextColor(0); doc.setFontSize(12);
  y=Math.max(hy+3, 14+logoSize+6);
  doc.setFillColor(...BRAND); doc.rect(margin,y,pageW-margin*2,1,'F'); y+=8;

  // ---- dados do veículo / cliente ----
  tituloSecao('DADOS DO VEÍCULO');
  doc.text(`Placa: ${o.placa}`,margin,y); doc.text(`Km: ${fmtKm(o.km)}`,120,y); y+=lh;
  doc.text(`Veículo: ${v.modelo||'—'} ${v.ano||''}`,margin,y); y+=lh;
  doc.text(`Data do serviço: ${fmtD(o.data||o.concluidaEm)}`,margin,y); y+=lh;
  doc.text(`Oficina: ${o.oficina||(S.oficina&&S.oficina.nome)||''}`,margin,y); y+=lh;
  y+=1; linha();

  // ---- peças e serviços ----
  quebraSeNecessario(20);
  tituloSecao('PEÇAS E SERVIÇOS');
  if((o.itens||[]).length){
    for(const i of o.itens){
      quebraSeNecessario();
      const qtd=+i.qtd||1;
      doc.text(`${i.nome}${qtd>1?' ×'+qtd:''}`,margin,y);
      doc.text(i.custo?fmtBRL((+i.custo)*qtd):'—',pageW-margin,y,{align:'right'}); y+=lh;
      if(i.obs){ doc.setFontSize(9); doc.setTextColor(110); quebraSeNecessario(); doc.text(String(i.obs),margin+4,y); doc.setFontSize(12); doc.setTextColor(0); y+=lh-2; }
    }
  } else { doc.text('Nenhuma peça registrada.',margin,y); y+=lh; }
  y+=1; linha(); quebraSeNecessario(18);
  const emAndamento=o.status==='Aberta';
  doc.setFont('helvetica','bold');
  doc.text('Subtotal peças:',margin,y); doc.text(fmtBRL(pecasTotal(o)),pageW-margin,y,{align:'right'}); y+=lh;
  if(podeMo){
    doc.setFont('helvetica','normal');
    doc.text(emAndamento&&!o.maoObra?'Mão de obra: ainda não informada':'Mão de obra:',margin,y); if(!(emAndamento&&!o.maoObra)) doc.text(fmtBRL(o.maoObra||0),pageW-margin,y,{align:'right'}); y+=lh+2;
    quebraSeNecessario(12);
    // total em destaque, com uma faixa clara atrás — é o número que mais importa no papel; em
    // andamento usa cor de alerta e deixa claro que é parcial, não o fechamento da OS
    doc.setFillColor(...(emAndamento?[254,243,199]:[238,242,247]));
    doc.rect(margin,y-6,pageW-margin*2,9.5,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...(emAndamento?[180,83,9]:BRAND));
    doc.text(emAndamento?'TOTAL PARCIAL:':'TOTAL:',margin+2,y); doc.text(fmtBRL(osTotal(o)),pageW-margin-2,y,{align:'right'});
    doc.setTextColor(0); doc.setFontSize(12); y+=lh+3;
  }
  doc.setFont('helvetica','normal');

  // ---- relato ----
  if(o.relato){ quebraSeNecessario(20); linha(); tituloSecao('RELATO');
    const linhasRelato=doc.splitTextToSize(o.relato,pageW-margin*2); quebraSeNecessario(linhasRelato.length*5);
    doc.text(linhasRelato,margin,y); y+=linhasRelato.length*5+2;
  }

  // ---- rodapé: dados de pagamento (Pix), se a oficina tiver chave cadastrada — fica por último,
  // como fecho do documento. O nome do mecânico responsável não aparece mais no papel impresso
  // (fica só registrado internamente no sistema, nas listas de OS) ----
  const ofPdf=ofDados;
  if(ofPdf&&ofPdf.pixChave){
    const valorPdf=podeMo?osTotal(o):pecasTotal(o);
    const pixPayload=montarPixPayload(ofPdf.pixChave,ofPdf.pixNome||ofPdf.nome||ofPdf.responsavel||'',ofPdf.pixCidade,valorPdf,('OS'+o.id).slice(0,25));
    const qrUrl=pixPayload?await qrCodeDataUrl(pixPayload,220):null;
    if(qrUrl){
      quebraSeNecessario(40); y+=2; linha(); y+=1;
      tituloSecao('PAGAMENTO VIA PIX');
      try{
        doc.addImage(qrUrl,'PNG',margin,y-4,30,30);
        doc.setFont('helvetica','normal'); doc.setFontSize(9);
        doc.text(`Valor: ${fmtBRL(valorPdf)}`,margin+36,y+2);
        doc.text(`Chave: ${ofPdf.pixChave}`,margin+36,y+8);
        if(ofPdf.pixNome) doc.text(`Favorecido: ${ofPdf.pixNome}`,margin+36,y+14);
        doc.text('Escaneie com o app do seu banco para pagar',margin+36,y+20);
      }catch(e){ console.warn('qr pix no pdf indisponível:',e); }
      doc.setFontSize(12); y+=30;
    }
  }

  if(emAndamento){ doc.setFontSize(8); doc.setTextColor(180,83,9); doc.text('Serviço ainda em andamento — valores parciais, sujeitos a alteração até a conclusão.',margin,284); }
  doc.setFontSize(8); doc.setTextColor(150);
  doc.text(`Gerado em ${fmtD(agoraIso())} · Carsz · Controle de Manutenção`,margin,290);
  const nomeArq=`OS-${o.placa}-${(o.data||o.concluidaEm||'').slice(0,10)}.pdf`;
  return {doc,nomeArq,o};
}

async function imprimirOs(id){
  const r=await montarOsPdf(id); if(!r) return;

    try{ await navigator.share({files:[file],title:'OS '+o.placa,text:`OS ${o.placa} — ${fmtD(o.data||o.concluidaEm)}`}); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  doc.save(nomeArq);
  toast('PDF baixado — anexe no WhatsApp pelo seletor de arquivos');
}

function imprimirDireto(url){
  const w=window.open(url,'_blank');
  if(!w){ toast('O navegador bloqueou a nova aba — permita pop-ups pra este site, ou use "Baixar / Enviar"'); return; }
  const tentarImprimir=()=>{ try{ w.focus(); w.print(); }catch(e){} };
  try{ w.addEventListener('load',tentarImprimir); }catch(e){}
  setTimeout(tentarImprimir,600);

  // alguma vez (abriu OS) — senão ela veria avisos da frota inteira da Carsz, não só do que é dela
  const souParceira=!!(S.perfil&&S.perfil.oficinaId&&S.perfil.oficinaId!=='matriz');
  const placasAtendidas=souParceira?new Set(S.os.map(o=>o.veiculoId)):null;
  const veicFrota=S.veic.filter(isFrota).filter(v=>!souParceira||placasAtendidas.has(v.id));
  // clientes particulares (não-frota) já visíveis aqui — pelo próprio cadastro, ou por estar
  // envolvida num encaminhamento — também entram nos alertas: o histórico é geral em toda a
  // base, então uma manutenção vencida registrada por OUTRA oficina aparece aqui também
  const veicParticulares=S.veic.filter(v=>!isFrota(v));
  const veicAlerta=[...veicFrota,...veicParticulares];
  const venc=[],prox=[];
  for(const v of veicAlerta) for(const a of alertasVeic(v)){ if(a.lvl==='bad')venc.push(a); else if(a.lvl==='warn')prox.push(a); }
  let h=`<div class="bar"><h2>Atenção agora</h2></div><p class="hint" style="margin:-4px 0 10px">${souParceira?'Veículos da frota Carsz que sua oficina já atendeu, mais seus clientes particulares — considerando também manutenções registradas em outras oficinas.':'Frota Carsz e clientes particulares — considerando também manutenções registradas em outras oficinas.'}</p><div class="cards">
    <div class="card bad"><div class="v">${venc.length}</div><div class="l">manutenções vencidas</div></div>
    <div class="card warn"><div class="v">${prox.length}</div><div class="l">vencendo em breve</div></div>
  </div>`;
  const lista=[...venc,...prox].sort((a,b)=>(b.p.critico?1:0)-(a.p.critico?1:0));
  h+='<h4>Itens para verificar</h4><div class="alertlist">';
  if(!lista.length) h+='<div class="empty">Nenhuma manutenção vencida ou próxima.</div>';
  for(const a of lista) h+=`<div class="al ${a.lvl}"><span class="plate">${esc(a.v.placa)}</span><span>${esc(a.v.modelo)}</span><span class="sp">${a.p.critico?'<span class="tag bad">SENSÍVEL</span> ':''}<b>${esc(a.p.nome)}</b> — ${a.txt}</span></div>`;
  h+='</div>';
  m.innerHTML=h;
}
// ============ MODO GESTÃO ============
// ---- período corrente (mês/trimestre/bimestre/ano) para o gráfico de custo por veículo do painel ----
const NOMES_MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function periodoRange(tipo){
  const now=new Date(), y=now.getFullYear(), mes=now.getMonth();
  if(tipo==='ano') return {inicio:new Date(y,0,1),fim:new Date(y+1,0,1)};
  if(tipo==='trimestre'){ const q=Math.floor(mes/3); return {inicio:new Date(y,q*3,1),fim:new Date(y,q*3+3,1)}; }
  if(tipo==='bimestre'){ const b=Math.floor(mes/2); return {inicio:new Date(y,b*2,1),fim:new Date(y,b*2+2,1)}; }
  return {inicio:new Date(y,mes,1),fim:new Date(y,mes+1,1)};
}
function periodoLabel(tipo){
  const now=new Date(), y=now.getFullYear(), mes=now.getMonth();
  if(tipo==='ano') return `Ano de ${y}`;
  if(tipo==='trimestre') return `${Math.floor(mes/3)+1}º trimestre de ${y}`;
  if(tipo==='bimestre') return `${Math.floor(mes/2)+1}º bimestre de ${y}`;
  return `${NOMES_MES[mes]} de ${y}`;
}
const MESES_ABREV=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
// gasto por mês desde a OS mais antiga conhecida (não um período fixo de 12 meses) — usado em
// Relatórios e no Painel. Agrupa pela data da intervenção (o.data), não pela data de conclusão
// no sistema, senão OS antigas lançadas hoje aparecem todas concentradas no mês atual.
function gastoPorMesDesdeInicio(osConcluidas){
  const porMes={};
  for(const o of osConcluidas){ const d=(o.data||o.concluidaEm||'').slice(0,7); if(d) porMes[d]=(porMes[d]||0)+osTotal(o); }
  const datas=osConcluidas.map(o=>o.data||o.concluidaEm).filter(Boolean).sort();
  if(!datas.length) return {meses:[],porMes};
  const ini=new Date(datas[0]); const agora=new Date();
  const totalMeses=Math.max(1,(agora.getFullYear()-ini.getFullYear())*12+(agora.getMonth()-ini.getMonth())+1);
  const meses=[...Array(totalMeses)].map((_,i)=>{ const d=new Date(ini.getFullYear(),ini.getMonth()+i,1); return d.toISOString().slice(0,7); });
  return {meses,porMes};
}
// ---- relatórios: métricas por veículo (paradas, gasto, km rodado, dias acompanhados) ----
function metricasVeic(v,osList){
  const os=osList.filter(o=>o.veiculoId===v.id);
  const paradas=os.length;
  const gasto=os.reduce((s,o)=>s+osTotal(o),0);
  const kms=os.map(o=>+o.km||0).filter(k=>k>0);
  // km rodado = desde a primeira OS conhecida até o último km registrado do veículo — usa o maior
  // entre o km das OS e o km atual do veículo (v.km), pois o odômetro pode ter sido atualizado
  // depois da última OS (botão "Atualizar km" na Frota) sem lançar uma OS nova
  const kmIni=kms.length?Math.min(...kms):null;
  const kmFim=Math.max(+v.km||0,...(kms.length?kms:[0]));
  const kmRodado=(kmIni!=null&&kmFim>kmIni)?kmFim-kmIni:0;
  const datas=os.map(o=>o.data||o.concluidaEm).filter(Boolean).sort();
  // dias acompanhados = desde a 1ª OS registrada até hoje (não só o intervalo entre OS) — evita projeção mensal
  // distorcida quando há poucas OS muito próximas no tempo (ex.: histórico antigo lançado tudo de uma vez)
  const dias=datas.length?Math.max(1,Math.round((Date.now()-new Date(datas[0]))/864e5)):null;
  // só projeta custo/dia (e por consequência custo mensal) com pelo menos ~15 dias de histórico acompanhado,
  // senão poucas OS muito próximas geram uma taxa diária irreal quando multiplicada por 30
  const diasConfiaveis=dias&&dias>=15?dias:null;
  return {v,paradas,gasto,kmRodado,dias,
    custoPorParada:paradas?gasto/paradas:0,
    custoPorKm:kmRodado?gasto/kmRodado:null,
    custoPorDia:diasConfiaveis?gasto/diasConfiaveis:null};
}

  const porVeic=veicFrota.map(v=>metricasVeic(v,osPeriodo)).filter(x=>x.paradas>0);
  const totalGasto=porVeic.reduce((s,x)=>s+x.gasto,0);
  const totalParadas=porVeic.reduce((s,x)=>s+x.paradas,0);
  const totalKm=porVeic.reduce((s,x)=>s+x.kmRodado,0);
  const mediaPorVeic=porVeic.length?totalGasto/porVeic.length:0;

  // gasto por mês — desde a 1ª OS conhecida da frota (não um período fixo), independente do

  const maxGasto=Math.max(1,...rankGasto.map(x=>x.gasto));
  const ordens={paradas:(a,b)=>b.paradas-a.paradas,gasto:(a,b)=>b.gasto-a.gasto,km:(a,b)=>b.kmRodado-a.kmRodado,custoKm:(a,b)=>(b.custoPorKm||0)-(a.custoPorKm||0),custoDia:(a,b)=>(b.custoPorDia||0)-(a.custoPorDia||0)};
  const tabela=[...porVeic].sort(ordens[ordem]||ordens.paradas);
  let h=`<div class="bar"><h2>Relatórios</h2><span class="sp"></span><select id="rel_periodo" onchange="S.relPeriodo=this.value==='tudo'?'tudo':+this.value;render()" style="max-width:190px">${[['3','Últimos 3 meses'],['6','Últimos 6 meses'],['12','Últimos 12 meses'],['tudo','Desde o início']].map(([v,l])=>`<option value="${v}" ${String(periodo)===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <p class="hint" style="margin:-4px 0 10px">Somente frota Carsz. Veículos de clientes particulares do mecânico não entram nestes números.</p>`;
  h+=`<div class="cards">
    <div class="card"><div class="v" style="font-size:22px">${fmtBRL(totalGasto)}</div><div class="l">gasto no período</div></div>
    <div class="card"><div class="v">${totalParadas}</div><div class="l">paradas (OS concluídas)</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(mediaPorVeic)}</div><div class="l">média por veículo</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(mediaPorParada)}</div><div class="l">média por parada</div></div>
    <div class="card"><div class="v" style="font-size:20px">${custoPorKmGeral!=null?fmtBRL(custoPorKmGeral):'—'}</div><div class="l">custo médio por km rodado</div></div>
  </div>`;
  h+=`<h4>Gasto por mês (desde a 1ª OS registrada)</h4><div class="barchart">`+(mesesHist.length?mesesHist.map(mm=>{
    const val=porMes[mm]||0, pct=Math.round(val/maxMes*100), [yy,mo]=mm.split('-');
    return `<div class="brow"><span class="blabel">${MESES_ABREV[+mo-1]}/${yy.slice(2)}</span><div class="btrack"><div class="bfill" style="width:${pct}%"></div></div><span class="bval">${fmtBRL(val)}</span></div>`;
  }).join(''):'<div class="empty">Nenhuma OS concluída registrada ainda.</div>')+`</div>`;
  h+=`<div class="grid" style="gap:20px">
    <div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div><h4>Ranking · mais paradas</h4><div class="barchart">${ranking.length?ranking.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.v.placa)}</span><div class="btrack"><div class="bfill warn" style="width:${Math.round(x.paradas/maxParadas*100)}%"></div></div><span class="bval">${x.paradas}</span></div>`).join(''):'<div class="empty">Sem dados no período.</div>'}</div></div>
      <div><h4>Ranking · maior gasto</h4><div class="barchart">${rankGasto.length?rankGasto.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.v.placa)}</span><div class="btrack"><div class="bfill" style="width:${Math.round(x.gasto/maxGasto*100)}%"></div></div><span class="bval">${fmtBRL(x.gasto)}</span></div>`).join(''):'<div class="empty">Sem dados no período.</div>'}</div></div>
    </div></div>`;
  h+=`<div class="bar" style="margin-top:6px"><h2 style="font-size:16px">Detalhe por veículo</h2><span class="sp"></span><select id="rel_ordem" onchange="S.relOrdem=this.value;render()" style="max-width:230px">${[['paradas','Ordenar por: mais paradas'],['gasto','Ordenar por: maior gasto'],['km','Ordenar por: mais km rodado'],['custoKm','Ordenar por: maior R$/km'],['custoDia','Ordenar por: maior R$/dia']].map(([v,l])=>`<option value="${v}" ${ordem===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
  h+=tabela.length?`<div class="tbl"><table><tr><th>Placa</th><th>Modelo</th><th class="num">Paradas</th><th class="num">Km rodado</th><th class="num">Gasto total</th><th class="num">R$/parada</th><th class="num">R$/km</th><th class="num">Dias acompanhados</th><th class="num">R$/dia</th></tr>`+
    tabela.map(x=>`<tr><td><span class="plate">${esc(x.v.placa)}</span></td><td>${esc(x.v.modelo)}</td><td class="num">${x.paradas}</td><td class="num">${x.kmRodado?fmtKm(x.kmRodado):'—'}</td><td class="num">${fmtBRL(x.gasto)}</td><td class="num">${fmtBRL(x.custoPorParada)}</td><td class="num">${x.custoPorKm!=null?fmtBRL(x.custoPorKm):'—'}</td><td class="num">${x.dias??'—'}</td><td class="num">${x.custoPorDia!=null?fmtBRL(x.custoPorDia):'—'}</td></tr>`).join('')+'</table></div>'
    :'<div class="empty">Nenhuma OS concluída no período selecionado.</div>';
  m.innerHTML=h;
}
function painel(m){
  // painel é só da frota própria (nossos carros) — carros de clientes particulares do mecânico
  // (fora da frota) continuam com OS/histórico normais, mas não entram nestas contas
  const veicFrota=S.veic.filter(isFrota);
  const frotaIds=new Set(veicFrota.map(v=>v.id));
  const venc=[],prox=[];
  for(const v of veicFrota) for(const a of alertasVeic(v)){ if(a.lvl==='bad')venc.push(a); else if(a.lvl==='warn')prox.push(a); }
  const osConcluidas=S.os.filter(o=>o.status==='Concluída'&&frotaIds.has(o.veiculoId));
  const porVeic=veicFrota.map(v=>metricasVeic(v,osConcluidas)).filter(x=>x.paradas>0);
  const custoTotal=porVeic.reduce((s,x)=>s+x.gasto,0);
  const kmTotal=porVeic.reduce((s,x)=>s+x.kmRodado,0);
  const custoMedioVeic=porVeic.length?custoTotal/porVeic.length:0;
  const custoPorKmGeral=kmTotal?custoTotal/kmTotal:null;
  const abertas=S.os.filter(x=>x.status==='Aberta'&&frotaIds.has(x.veiculoId)).length;
  let h=`<p class="hint" style="margin:0 0 10px">Somente frota Carsz. Veículos de clientes particulares do mecânico não entram aqui — acompanhe-os normalmente em Frota, OS e Histórico.</p><div class="cards">
    <div class="card bad"><div class="v">${venc.length}</div><div class="l">manutenções vencidas</div></div>
    <div class="card warn"><div class="v">${prox.length}</div><div class="l">vencendo em breve</div></div>
    <div class="card ${abertas?'warn':''}"><div class="v">${abertas}</div><div class="l">OS abertas na oficina</div></div>
    <div class="card"><div class="v">${veicFrota.length}</div><div class="l">veículos na frota</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(custoTotal)}</div><div class="l">custo total de manutenção</div></div>
    <div class="card"><div class="v" style="font-size:20px">${fmtBRL(custoMedioVeic)}</div><div class="l">custo médio por veículo</div></div>
    <div class="card"><div class="v" style="font-size:20px">${custoPorKmGeral!=null?fmtBRL(custoPorKmGeral):'—'}</div><div class="l">custo médio por km rodado</div></div>
  </div>`;
  const lista=[...venc,...prox].sort((a,b)=>(b.p.critico?1:0)-(a.p.critico?1:0));
  h+='<h4>Atenção agora</h4><div class="alertlist">';
  if(!lista.length) h+='<div class="empty">Nenhuma manutenção vencida ou próxima.</div>';
  for(const a of lista) h+=`<div class="al ${a.lvl}"><span class="plate">${esc(a.v.placa)}</span><span>${esc(a.v.modelo)}</span><span class="sp">${a.p.critico?'<span class="tag bad">SENSÍVEL</span> ':''}<b>${esc(a.p.nome)}</b> — ${a.txt}</span></div>`;
  h+='</div>';
  if(porVeic.length){
    // evolução gasto x km rodado: km desde a 1ª OS conhecida de cada veículo até o último km
    // registrado (metricasVeic já calcula isso), rankeado do pior (mais R$/km) para o melhor
    const rankCusto=[...porVeic].filter(x=>x.custoPorKm!=null).sort((a,b)=>(b.custoPorKm||0)-(a.custoPorKm||0));
    const maxCustoKm=Math.max(1,...rankCusto.map(x=>x.custoPorKm||0));
    h+='<h4>Evolução gasto × km rodado — R$/km desde a 1ª OS de cada veículo</h4><p class="hint" style="margin:-4px 0 8px">Km rodado = do km da OS mais antiga até o último km conhecido do veículo (odômetro atual, se mais recente). Gasto realizado, sem projeção. Do mais caro para o mais barato por km.</p>';
    h+=rankCusto.length?`<div class="barchart">${rankCusto.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.v.placa)}</span><div class="btrack"><div class="bfill warn" style="width:${Math.round((x.custoPorKm||0)/maxCustoKm*100)}%"></div></div><span class="bval">${fmtBRL(x.custoPorKm)}/km</span></div>`).join('')}</div>`:'<div class="empty">Ainda sem km suficiente para calcular R$/km.</div>';
    h+='<div class="tbl" style="margin-top:8px"><table><tr><th>Placa</th><th>Modelo</th><th class="num">Km rodado (desde a 1ª OS)</th><th class="num">Gasto total (realizado)</th><th class="num">R$/km</th></tr>'+
      [...porVeic].sort((a,b)=>(b.custoPorKm||0)-(a.custoPorKm||0)).map(x=>`<tr><td><span class="plate">${esc(x.v.placa)}</span></td><td>${esc(x.v.modelo)}</td><td class="num">${x.kmRodado?fmtKm(x.kmRodado):'—'}</td><td class="num">${fmtBRL(x.gasto)}</td><td class="num">${x.custoPorKm!=null?fmtBRL(x.custoPorKm):'—'}</td></tr>`).join('')+
      '</table></div>';
  }
  // gasto médio de manutenção por veículo, mês a mês, desde o mês da OS mais antiga conhecida da
  // frota (não um período fixo) — mostra a evolução do gasto no tempo
  const {meses:mesesHist,porMes:porMesHist}=gastoPorMesDesdeInicio(osConcluidas);
  if(mesesHist.length&&veicFrota.length){
    const [yyIni,moIni]=mesesHist[0].split('-');
    const mediaMes=mesesHist.map(mm=>(porMesHist[mm]||0)/veicFrota.length);
    const maxMediaMes=Math.max(1,...mediaMes);
    h+=`<h4 style="margin-top:18px">Gasto médio de manutenção por veículo — mês a mês</h4><p class="hint" style="margin:-4px 0 8px">Gasto do mês ÷ ${veicFrota.length} veículo${veicFrota.length===1?'':'s'} da frota. Começa em ${MESES_ABREV[+moIni-1]}/${yyIni}, mês da OS mais antiga registrada.</p>`;
    h+=`<div class="barchart">${mesesHist.map((mm,i)=>{ const [yy,mo]=mm.split('-'); const val=mediaMes[i];
      return `<div class="brow"><span class="blabel">${MESES_ABREV[+mo-1]}/${yy.slice(2)}</span><div class="btrack"><div class="bfill" style="width:${Math.round(val/maxMediaMes*100)}%"></div></div><span class="bval">${fmtBRL(val)}</span></div>`;
    }).join('')}</div>`;
  }
  const tipoPer=S.custoPeriodo||'mes';
  const {inicio,fim}=periodoRange(tipoPer);
  const osPer=osConcluidas.filter(o=>{ const d=new Date(o.data||o.concluidaEm); return d>=inicio&&d<fim; });
  const porVeicPer=veicFrota.map(v=>({v,gasto:osPer.filter(o=>o.veiculoId===v.id).reduce((s,o)=>s+osTotal(o),0)})).filter(x=>x.gasto>0).sort((a,b)=>b.gasto-a.gasto);
  const maxPer=Math.max(1,...porVeicPer.map(x=>x.gasto));
  h+=`<div class="bar" style="margin-top:6px"><h4 style="margin:0">Custo de manutenção por veículo — ${esc(periodoLabel(tipoPer))}</h4><span class="sp"></span><select onchange="S.custoPeriodo=this.value;render()" style="max-width:170px">${[['mes','Mensal'],['bimestre','Bimestral'],['trimestre','Trimestral'],['ano','Anual']].map(([v,l])=>`<option value="${v}" ${tipoPer===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <p class="hint" style="margin:2px 0 8px">Gasto realizado no período atual, do pior (mais caro) para o melhor (mais barato).</p>`;
  h+=porVeicPer.length?`<div class="barchart">${porVeicPer.map(x=>`<div class="brow"><span class="blabel plate">${esc(x.v.placa)}</span><div class="btrack"><div class="bfill warn" style="width:${Math.round(x.gasto/maxPer*100)}%"></div></div><span class="bval">${fmtBRL(x.gasto)}</span></div>`).join('')}</div>`:'<div class="empty">Nenhuma OS concluída neste período.</div>';
  m.innerHTML=h;
}

async function importarJson(inp){
  const f=inp.files[0]; if(!f) return; let d; try{ d=JSON.parse(await f.text()); }catch(e){ toast('Arquivo inválido'); return; }
  const n=(d.veiculos||[]).length+(d.os||[]).length+(d.sinistros||[]).length+(d.pecas||[]).length;
  if(!confirm(`Importar ${n} registros? Registros com o mesmo id são sobrescritos. Fotos não são importadas.`)) return;
  const limpa=o=>{ const c={...o}; delete c.id; return c; };
  for(const [col,arr] of [['veiculos',d.veiculos],['os',d.os],['sinistros',d.sinistros],['pecas',d.pecas]]) for(const r of (arr||[])){ const c=limpa(r); if(col==='os'){ c.fotoPlaca=null; c.fotoKm=null; c.fotos=[]; } await S.db.doc(col+'/'+r.id).set(c); }
  if(d.config) await S.db.doc('config/geral').set(d.config);
  toast('Importação concluída');
}

async function salvarOficina(){
  const nome=val('of_nome'), resp=val('of_resp'), tel=val('of_tel'), email=val('of_email').toLowerCase();
  if(!nome){toast('Informe o nome da oficina');return;}
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('E-mail inválido');return;}
  const oid=genId();
  let userId=null;
  if(email){
    // senha aleatória, de uso único e descartável: ninguém a usa — o responsável define a própria
    // senha pelo e-mail de acesso disparado logo abaixo (reaproveita o fluxo de recuperação de senha)
    const senhaTemp=genId()+genId()+genId();
    const tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const {data,error}=await tmp.auth.signUp({email,password:senhaTemp});
    if(error){toast('Erro: '+error.message);return;}
    if(!data.user){toast('Não foi possível criar o acesso');return;}
    if(data.user.identities&&!data.user.identities.length){toast('Este e-mail já está cadastrado — deixe o e-mail em branco e depois mova o usuário existente pra esta oficina em "Oficina" → Editar');return;}
    userId=data.user.id;
  }
  await S.db.doc('oficinas/'+oid).set({nome,responsavel:resp,telefone:tel,email:email||null,logo:logoTemp||null,telefoneOficina:val('of_telofi').trim(),documento:val('of_doc').trim(),endereco:val('of_end').trim(),pixChave:val('of_pixchave').trim(),pixNome:val('of_pixnome').trim(),pixCidade:val('of_pixcidade').trim(),status:'pendente',criadoEm:agoraIso()});
  if(!userId){ fechar(); toast('Oficina cadastrada. Agora mova os usuários dela em "Oficina" (menu) → Editar → campo "Oficina".'); return; }
  await sb.from('perfis').upsert({id:userId,data:{nome:resp||nome,email,papel:'gestor',oficinaId:oid,ativo:true,criadoEm:agoraIso()}});
  const {error:eReset}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  toast('Oficina cadastrada — marque como "ativa" quando quiser liberar o acesso');
  avisoAcessoOficina(nome,resp,tel,email,!eReset);
}
// mostra a confirmação de envio do e-mail de acesso + botão para reenviar o mesmo aviso por
// WhatsApp (o link de senha em si só pode ser enviado por e-mail pelo Supabase; o WhatsApp leva
// o link do site e o login, pedindo pra conferir o e-mail ou usar "Esqueci a senha")
function avisoAcessoOficina(nome,resp,tel,email,emailOk){
  const telDigits=(tel||'').replace(/\D/g,'');
  const site=location.origin+location.pathname;
  const msg=`Olá${resp?', '+resp:''}! A oficina *${nome}* foi cadastrada no sistema de manutenção da Carsz.\n\nAcesse: ${site}\nSeu login: ${email}\n\nVocê recebeu um e-mail para definir sua senha de acesso (confira também a caixa de spam). Se não achar, use "Esqueci a senha" na tela de entrada com este e-mail.`;
  abrir(`<h3>Oficina cadastrada</h3><p class="muted">${emailOk?'E-mail de acesso enviado para '+esc(email)+'.':'Não foi possível enviar o e-mail automático agora — avise o responsável para usar "Esqueci a senha" com este e-mail: '+esc(email)+'.'}</p>
  <div class="act">${telDigits?`<button class="pri" onclick="window.open('https://wa.me/${telDigits.length<=11?'55'+telDigits:telDigits}?text=${encodeURIComponent(msg)}','_blank')">💬 Enviar acesso por WhatsApp</button>`:'<span class="hint">Sem telefone cadastrado — não é possível enviar por WhatsApp.</span>'}<button class="sec" onclick="fechar()">Fechar</button></div>`);
}

async function salvarVeic(id){
  const existente=id?S.veic.find(x=>x.id===id):null;
  const d={placa:normPlaca(val('f_placa')),ano:val('f_ano'),modelo:val('f_modelo'),empresa:val('f_emp'),km:+val('f_km')||0,status:val('f_st'),renavam:val('f_ren'),rastreador:val('f_rast'),obs:val('f_obs'),frotaPropria:val('f_frota')!=='externo',clienteNome:val('f_clinome'),clienteTel:(val('f_clitel')||'').replace(/\D/g,'')};
  // cliente particular pertence à oficina de quem cadastrou — preserva o dono original ao editar
  if(!d.frotaPropria) d.oficinaId=(existente&&existente.oficinaId)||S.perfil.oficinaId||null;
  if(!d.placa||!d.modelo){toast('Informe placa e modelo');return;}
  if(!id && S.veic.some(v=>v.placa===d.placa)){toast('Placa já cadastrada');return;}
  if(id) await S.db.doc('veiculos/'+id).set(d); else await S.db.collection('veiculos').add(d);
  fechar(); toast('Veículo salvo');
}
// ---- cadastro rápido de frota (múltiplos veículos de uma vez) ----
let cr=[{placa:'',ano:'',modelo:''}];
function crSync(){ for(let i=0;i<cr.length;i++){ cr[i].placa=val('cr_p'+i)||''; cr[i].ano=val('cr_a'+i)||''; cr[i].modelo=val('cr_m'+i)||''; } }
function formCadastroRapido(){
  let h='<h3>Cadastro rápido de frota</h3><div class="hint">Preencha placa, ano e modelo de cada veículo — os outros dados (km, empresa, tipo de veículo, situação) você completa depois em Editar. Placas já cadastradas são atualizadas, sem apagar o resto do cadastro. Veículos novos criados aqui entram como frota própria (relatórios/painel); se for carro de cliente particular do mecânico, marque isso em Editar.</div>';
  h+='<div class="tbl"><table><tr><th>Placa</th><th>Ano</th><th>Modelo / veículo</th><th></th></tr>';
  cr.forEach((r,i)=>{ h+=`<tr><td><input id="cr_p${i}" value="${esc(r.placa)}" style="text-transform:uppercase;width:100px"></td><td><input id="cr_a${i}" type="number" value="${esc(r.ano)}" style="width:80px"></td><td><input id="cr_m${i}" value="${esc(r.modelo)}" placeholder="Fiat Uno Attractive 1.0" style="width:100%"></td><td><button class="ghost danger" onclick="crRemover(${i})">✕</button></td></tr>`; });
  h+='</table></div>';
  h+='<div class="act"><button class="sec" onclick="crAdd()">+ Linha</button><span class="sp"></span><button class="sec" onclick="fechar()">Cancelar</button><button class="pri" onclick="crSalvar()">Salvar todos</button></div>';
  abrir(h);
}
function crAdd(){ crSync(); cr.push({placa:'',ano:'',modelo:''}); formCadastroRapido(); }
function crRemover(i){ crSync(); cr.splice(i,1); if(!cr.length) cr.push({placa:'',ano:'',modelo:''}); formCadastroRapido(); }
async function crSalvar(){
  crSync();
  const linhas=cr.map(r=>({placa:normPlaca(r.placa),ano:(r.ano||'').trim(),modelo:(r.modelo||'').trim()})).filter(r=>r.placa);
  if(!linhas.length){ toast('Preencha ao menos uma placa'); return; }
  let criados=0, atualizados=0;
  for(const r of linhas){
    const modelo=r.modelo||'(a definir)';
    const existente=S.veic.find(v=>v.placa===r.placa);
    if(existente){ await S.db.doc('veiculos/'+existente.id).update({modelo,ano:r.ano,pendente:false}); atualizados++; }
    else { await S.db.collection('veiculos').add({placa:r.placa,modelo,ano:r.ano,empresa:'',km:0,status:'Disponível'}); criados++; }
  }
  cr=[{placa:'',ano:'',modelo:''}];
  fechar(); toast(`Frota atualizada: ${criados} criado(s), ${atualizados} atualizado(s)`);
}

async function salvarSin(id){ const d={veiculoId:val('s_v'),data:val('s_data'),desc:val('s_desc'),seguradora:val('s_seg'),bo:val('s_bo'),franquia:+val('s_fr')||0,terceiro:val('s_ter'),status:val('s_st'),culpa:val('s_culpa')};

async function delSin(id){ if(!confirm('Excluir este sinistro?'))return; await S.db.doc('sinistros/'+id).delete(); fechar(); toast('Sinistro excluído'); }

// ============ boot ============
function subCol(col,key){ S.db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>{ document.getElementById('status').textContent='Erro: '+e.code; }); }
// busca, pra todas as placas conhecidas, o histórico técnico registrado em OUTRAS oficinas (via
// RPC historico_compartilhado do banco — nunca traz valor nem quem atendeu). Se a migração do
// banco ainda não foi aplicada, falha em silêncio e o app continua funcionando sem esse extra.
async function carregarHistoricoCompartilhado(){
  const placas=[...new Set(S.veic.map(v=>v.placa).filter(Boolean))];
  if(!placas.length){ S.histCompartilhado=[]; render(); return; }
  try{
    const {data,error}=await sb.rpc('historico_compartilhado',{p_placas:placas});
    if(error) throw error;
    S.histCompartilhado=(data||[]).map(r=>({id:r.id,placa:r.placa,veiculoId:r.veiculo_id,data:r.data_intervencao,km:+r.km||0,itens:r.itens||[],status:r.status,oficina:r.oficina||'',externo:true}));
  }catch(e){ console.warn('historico_compartilhado indisponível (rode a migração do banco):',e); }
  render();
}
// placa nova (ainda sem veículo cadastrado aqui) digitada na tela de Nova OS: consulta avulsa,
// na hora, pra ver se já existe histórico técnico dessa placa vindo de outra oficina — sem isso,
// só placas já cadastradas localmente entrariam na busca em lote de carregarHistoricoCompartilhado
let placaChecada=null;
async function checarPlacaExterna(p){
  if(placaChecada===p) return;
  placaChecada=p;
  try{
    const {data,error}=await sb.rpc('historico_compartilhado',{p_placas:[p]});
    if(error) throw error;
    const novos=(data||[]).map(r=>({id:r.id,placa:r.placa,veiculoId:r.veiculo_id,data:r.data_intervencao,km:+r.km||0,itens:r.itens||[],status:r.status,oficina:r.oficina||'',externo:true}));
    if(novos.length){
      const idsExistentes=new Set(S.histCompartilhado.map(h=>h.id));
      S.histCompartilhado=[...S.histCompartilhado,...novos.filter(n=>!idsExistentes.has(n.id))];
      if(normPlaca(nova.placa)===p) chkPlaca();
    }
  }catch(e){ console.warn('consulta de placa externa indisponível:',e); }
}
if(location.hash.startsWith('#mecanico')){ S.mec=true; S.view='mnova'; }
S.db=mkDb(); S.assets=mkAssets(); S.cfg=JSON.parse(JSON.stringify(DEF_CFG)); S.mecsOk=true;

(async()=>{
  const st=document.getElementById('status');
  if(SUPABASE_URL.startsWith('COLE_')){ st.textContent='Configure SUPABASE_URL e SUPABASE_ANON_KEY no index.html'; return; }
  st.textContent='Sincronizado';
  const {data:{session}}=await sb.auth.getSession();
  S.db.doc('config/geral').onSnapshot(s=>{ S.cfg=s.exists?{...DEF_CFG,...s.data()}:JSON.parse(JSON.stringify(DEF_CFG)); render(); });
  S.db.collection('veiculos').onSnapshot(snap=>{ S.veic=snap.docs.map(d=>({id:d.id,...d.data()})); render(); carregarHistoricoCompartilhado(); }, e=>{ document.getElementById('status').textContent='Erro: '+e.code; });
  subCol('os','os'); subCol('sinistros','sin'); subCol('pecas','pecas'); subCol('perfis','mecs');
  // "oficinas" só existe depois da migração do banco — falha em silêncio até lá, sem derrubar o status
  S.db.collection('oficinas').onSnapshot(snap=>{ S.oficinas=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>{ console.warn('tabela "oficinas" indisponível (rode a migração do banco):',e); });
  // se for link de recuperação de senha, o listener registrado logo após criar o "sb" (acima, no
  // topo do arquivo) já capturou o evento PASSWORD_RECOVERY e está tratando a troca de senha —
  // não chamamos carregarSessao aqui de novo para não duplicar o fluxo.
  if(!S_recuperando) await carregarSessao(session);
})();
