<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{
  /* paleta do site carsz.com.br: azul-marinho profundo + amarelo Carsz */
  color-scheme:dark;
  --bg:#0f1824; --card:#172131; --ink:#ffffff; --muted:#a3afc2; --line:#27334a; --brand:#ffb800; --brand-ink:#0e1929;
  --soft:#2a2614; --ok:#3ddc84; --ok-bg:#10281d; --warn:#ffcf4d; --warn-bg:#2d2508; --bad:#ff7b7b; --bad-bg:#341618;
  --mine:#ffb800; --mine-ink:#0e1929; --theirs:#232d40; --head:#0b1320; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.plate,.pts{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--head);border-bottom:1px solid var(--line);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;flex:1;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
header h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
header .ic{background:rgba(255,255,255,.1);border:0;border-radius:10px;color:#fff;font-size:20px;width:40px;height:40px}
main{flex:1;padding:14px 16px 24px;max-width:640px;width:100%;margin:0 auto}
nav.tabs{position:sticky;bottom:0;background:var(--head);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:9px 1px 8px;color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .i{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:4px 11px;font-size:12.5px}.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.atag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:0 6px;margin-right:6px;background:rgba(127,127,127,.25)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);background:#e5484d;color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.plate{display:inline-block;font:700 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;background:#fff;color:#111;border:2px solid #111;border-top:8px solid #1d4ed8;border-radius:7px;padding:6px 12px 5px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;text-align:center}
.btn.sec{background:var(--soft);color:var(--brand)}
.btn.ghost{background:none;color:var(--muted);font-weight:600;padding:10px}
.btn.danger{background:#e5484d;color:#fff}
.btn:disabled{opacity:.55}
.btn.sm{padding:10px;font-size:14px;display:inline-block;width:auto}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
.alert{border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid}
.alert.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.alert.org{background:rgba(234,88,12,.13);border-color:#ea580c;color:#ea580c}
.alert.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.alert.info{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.alert b.t{display:block;font-size:17px;margin-bottom:4px}
.alert .txt{color:var(--ink);font-size:15px;margin:2px 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--soft);color:var(--brand)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.neu{background:var(--theirs);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg .h{font-size:12px;opacity:.75;margin-top:3px}
.msg.eu{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:4px}
.msg.eq{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0 0;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:120px;flex:1;margin:0;padding:11px}
.composer button{width:auto;padding:0 18px;height:46px}
/* login */
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 30px) 20px 30px}
.login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 10px;box-shadow:var(--shadow)}
.login h1{text-align:center;margin:0 0 2px;font-size:24px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:8px 0 0}
/* verificações obrigatórias */
/* Início organizada: 4 tamanhos de fonte e cores com significado fixo (vermelho=urgente, amarelo=ação, verde=feito, cinza=info) */
.t1{font-size:20px;font-weight:800;line-height:1.15}.t2{font-size:16px;font-weight:700}.t3{font-size:14px}.t4{font-size:12px;color:var(--muted)}
.sec-t{font:800 11px/1 Inter,system-ui,sans-serif;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:18px 2px 8px}
.sec-t.red{color:#ff7b7b}
.hero{border-radius:14px;padding:13px;margin-bottom:10px;border:1.5px solid}
.hero.g{background:var(--ok-bg);border-color:var(--ok)}.hero.y{background:var(--warn-bg);border-color:var(--warn)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:9px}.bar i{display:block;height:6px;border-radius:9px;background:var(--ok)}.bar i.y{background:var(--warn)}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip2{border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--ok-bg);color:var(--ok)}.chip2.p{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}.chip2.r{background:var(--bad-bg);color:var(--bad)}
.alert .txt{font-size:14px}
#faixa_pedagio b.t{font-size:16px}
.vcard{display:flex;align-items:center;gap:10px}
.vcard .mod{font-size:12px;color:var(--muted);margin-top:4px;text-align:right;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:190px}
.pts-row{display:flex;align-items:flex-end;gap:12px}
details.mais>summary{cursor:pointer;font-weight:700;color:var(--brand);font-size:14px;margin-top:10px;list-style:none}
details.mais>summary::-webkit-details-marker{display:none}
/* cobrança em atraso: app todo vermelho + faixa piscando (some quando a equipe aceita promessa ou comprovante) */
body.atraso{--bg:#1d0e11;--card:#2b1519;--line:#5a2830;--brand:#ff4d4f;--brand-ink:#fff;--head:#3a0d12;--soft:#3d1a1f;--muted:#d9aeb2;--mine:#ff4d4f;--mine-ink:#fff;--theirs:#3a1d22}
body.atraso header h1::before{background:#fff}
.faixa-atraso{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;color:#fff;background:#ff2d32;padding:10px 16px;font-weight:800;font-size:14px;letter-spacing:.2px;position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:4;animation:piscaAtraso 1s ease-in-out infinite}
.faixa-atraso small{display:block;font-weight:500;font-size:12px;opacity:.95}
.faixa-atraso.fixa{cursor:default}
body.atraso main{animation:contornoAtraso 1s ease-in-out infinite}
@keyframes piscaAtraso{0%,100%{background:#ff2d32}50%{background:#8f1216}}
@keyframes contornoAtraso{0%,100%{box-shadow:inset 0 0 0 2px rgba(255,45,50,.9)}50%{box-shadow:inset 0 0 0 2px rgba(255,45,50,.15)}}
/* algo marcado para o motorista (manutenção confirmada, fotos do checklist): app amarelo + faixa (some quando a equipe dá baixa) */
body.amarelo{--bg:#1f1808;--card:#2e240a;--line:#6a5516;--brand:#f5b50a;--brand-ink:#2a1d00;--head:#3a2c06;--soft:#43340b;--muted:#e3cf93;--mine:#f5b50a;--mine-ink:#2a1d00;--theirs:#4c3a0f}
.faixa-av{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;color:#2a1d00;background:#f5b50a;padding:10px 16px;font-weight:800;font-size:14px;letter-spacing:.2px;position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:4;animation:piscaAv 2s ease-in-out infinite}
.faixa-av small{display:block;font-weight:600;font-size:12px}
.faixa-av.fixa{cursor:default}
.faixa-av.conf{background:#a97800;color:#fff;animation:none}
@keyframes piscaAv{0%,100%{background:#f5b50a}50%{background:#c98f00}}
@media (prefers-reduced-motion:reduce){.faixa-atraso,body.atraso main,.faixa-av{animation:none}}
.obrig{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.obrig .wrap{max-width:520px;margin:0 auto}
.obrig h2{margin:0 0 4px;font-size:22px}
.obrig .it{display:flex;gap:12px;align-items:flex-start}
.obrig .it .em{font-size:30px;line-height:1}
.obrig .it .tx{flex:1;min-width:0}
.obrig .it .tx b{display:block;font-size:16px}
.obrig .done{opacity:.85;border-color:var(--ok)}
.obrig label.btn{cursor:pointer;margin:10px 0 0}
.obrig input[type=file]{display:none}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#111c;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90%;text-align:center;backdrop-filter:blur(6px)}
.list-i{border-top:1px solid var(--line);padding:10px 0}
.list-i:first-child{border-top:0}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--muted);padding:8px 10px;font-size:14px}
.tr{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 16px)}
.tr .in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px}
.tr .top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;min-height:34px}
.tr .lnk{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 2px;font-size:15px}
.tr .ill{flex:1;min-height:200px;display:flex;align-items:center;justify-content:center;padding:6px 0}
.tr h2{margin:0;font-size:24px;line-height:1.15}
.tr .txt{font-size:15.5px;line-height:1.5}.tr .txt b{color:var(--ink)}
.tr .dots{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}.tr .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.tr .dots i.on{background:var(--brand);width:22px;border-radius:5px}
.tr .nav{display:flex;gap:10px}.tr .nav .btn{flex:1}.tr .nav #tr_fim{flex:2}
.tr_in{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;margin:0 0 10px}.tr_in small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.tr_ck{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:8px;cursor:pointer;font-weight:600}
.tr_ck .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--brand);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--brand-ink)}
.tr_ck.on{border-color:var(--ok)}.tr_ck.on .bx{background:var(--ok);border-color:var(--ok)}

/* Área do Cliente */
.chip.reg{padding:9px 13px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}
.opt{flex:1 1 auto;min-width:46%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;font-weight:600;font-size:15px;color:var(--ink)}
.opt.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.opt.w3{min-width:30%}
.headcli{display:flex;align-items:center;gap:10px}
.headcli .on{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.msg .doc{display:inline-block;margin-top:2px}
.docrow{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:11px 12px;margin:8px 0}
.docrow.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.docrow b{flex:1;font-size:15px}.docrow small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.docrow label{margin:0;display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:9px 13px;font-weight:800;font-size:14px;cursor:pointer}
.docrow input[type=file]{display:none}
.chatbox{display:flex;flex-direction:column;min-height:calc(100dvh - 190px)}
.chatbox .chat{flex:1;justify-content:flex-end}
.composer{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.composer .clip{width:46px;padding:0;font-size:20px;background:var(--soft);color:var(--brand)}
/* triagem */
.prog{display:flex;gap:4px;margin:2px 0 8px}.prog i{flex:1;height:5px;border-radius:4px;background:var(--line)}.prog i.on{background:var(--brand)}
.etapa{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:8px 11px;font-size:13px;margin-bottom:6px}.etapa b{color:var(--warn)}
label.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:500;color:var(--ink);margin:12px 0 4px;cursor:pointer}
label.ck input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--brand)}
.card b{font-size:15.5px}
</style>
</head>

const emailOk = v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v||'').trim()) && String(v).length<=120;
async function iniciar(){
  const f=S.f; const cel=f.cel.replace(/\D/g,'');
  const falha=m=>{ S.erro=m; render(false); };
  if(f.nome.trim().length<3) return falha('Informe seu nome completo');
  if(cel.length<10||cel.length>11) return falha('Informe o celular com DDD');
  if(!emailOk(f.email)) return falha('Informe um e-mail válido');
  if(!f.reg) return falha('Escolha a região onde você atua');
  if(!f.app) return falha('Escolha o aplicativo em que você trabalha');
  if(!f.tempo) return falha('Informe o tempo de cadastro no aplicativo');
  S.erro=''; S.ocupado=true; render(false);
  try{
    const r=await sb.rpc('cand_iniciar',{p_nome:f.nome.trim(),p_celular:cel,p_email:f.email.trim(),p_regiao:f.reg,p_app:f.app,p_tempo:f.tempo,p_lgpd:LGPD_VERSAO});
    if(r.error) throw r.error; const d=r.data;
    if(d&&d.erro){ S.ocupado=false; return falha(d.erro); }
    LS.set('cand_token',d.token); S.token=d.token; S.ocupado=false; S.sig=''; S.rIni=false; S.tela=null; await carregar(true);
  }catch(e){ S.ocupado=false; S.erro='Sem conexão ou erro. Tente de novo.'; render(false); }
}

function irTela(t){ S.tela=t; S.erro=''; render(); window.scrollTo&&window.scrollTo(0,0); }
async function salvarTela(tela){
  const r=S.r; const falha=m=>{ S.erro=m; render(false); };
  let p={};
  if(tela==='c'){ if(!r.restricao) return falha('Responda sobre a restrição no nome'); if(!r.processos) return falha('Responda sobre processos na justiça'); p={restricao:r.restricao,processos:r.processos}; }
  else if(tela==='d'){
    if(!r.compNome) return falha('Responda se tem comprovante de endereço no seu nome');
    if(r.compNome==='sim'&&!r.compTipo) return falha('Escolha qual conta você tem (luz, água, internet fixa ou TV a cabo)');
    if(!r.moraTempo) return falha('Informe há quanto tempo mora no endereço');
    p={compNome:r.compNome,compTipo:r.compNome==='sim'?r.compTipo:'',moraTempo:r.moraTempo};
  } else if(tela==='d2'){ if(!r.caucao) return falha('Responda sobre a caução'); p={caucao:r.caucao}; }
  else if(tela==='e'){
    if(!r.avTem) return falha('Responda se tem um familiar para ser avalista');
    p={avTem:r.avTem};
    if(r.avTem==='sim'){
      if((r.avNome||'').trim().length<3) return falha('Informe o nome completo do avalista');
      if((r.avParentesco||'').trim().length<2) return falha('Informe o parentesco do avalista');
      const c=String(r.avCelular||'').replace(/\D/g,''); if(c.length<10||c.length>11) return falha('Informe o celular do avalista com DDD');
      if(!emailOk(r.avEmail)) return falha('Informe um e-mail válido do avalista');
      if(!r.avCompNome) return falha('Responda se o avalista tem conta no nome dele');
      if(r.avLgpd!=='sim') return falha('Marque que o avalista concorda com o uso dos dados (LGPD)');
      p={...p,avNome:r.avNome.trim(),avParentesco:r.avParentesco.trim(),avCelular:c,avEmail:r.avEmail.trim(),avCompNome:r.avCompNome,avLgpd:'sim'};
    }
  }
  S.erro=''; S.ocupado=true; render(false);
  try{ const x=await rpc('cand_triagem',{p_token:S.token,p_resp:p}); S.ocupado=false;
    if(x&&x.erro){ S.erro=x.erro; return render(false); }
    S.tela=null; S.rIni=false; await carregar(true); window.scrollTo&&window.scrollTo(0,0); }
  catch(e){ S.ocupado=false; render(false); erroGenerico(e); }
}

async function carregar(forcar){
  if(!S.token) return;
  try{
    const d=await rpc('cand_resumo',{p_token:S.token}); S.dados=d;
    if(!S.rIni){ S.r={...(d.tri.resp||{})}; S.rIni=true; }
    const t=d.tri;
    const sig=(d.msgs||[]).length+':'+((d.msgs||[]).slice(-1)[0]||{}).id+':'+(d.docs||[]).length+':'+d.candidato.status+':'+t.etapa+':'+t.triagem+':'+t.bloqueio+':'+t.encerrado+':'+t.lgpd;
    if(forcar||sig!==S.sig){ const novo=sig!==S.sig; S.sig=sig; render(novo&&S.chat); }
  }catch(e){ if(!(e&&e.message==='sessao')) console.warn(e); }
}
function telaChat(){
  const d=S.dados; if(!d) return `<header><h1>Equipe Carsz</h1></header><main><div class="empty">Carregando…</div></main>`;
  const t=d.tri, c=docsInfo(); const obrig=docsObrig(t); const feitos=obrig.filter(k=>c[k]).length;
  const aprovado=d.candidato.status==='aprovado'||d.candidato.status==='virou';
  const msgs=(d.msgs||[]).map(m=>`<div class="msg ${m.de==='candidato'?'eu':'eq'}">${m.de==='candidato'?'':'<div style="font-size:12px;font-weight:800;color:var(--brand);margin-bottom:2px">Equipe Carsz</div>'}${esc(m.texto)}<div class="h">${esc(hhmm(m.em))}</div></div>`).join('');
  const aprov=aprovado?`<div class="alert ok"><b class="t">✅ Cadastro aprovado</b><div class="txt" style="margin:0">A equipe vai combinar os próximos passos com você por aqui.</div></div>`:'';
  const podeDocs=t.triagem==='aguardando_docs'||t.triagem==='docs_completos';   // documentos só no fim da triagem
  return `<header>${aprovado?'':`<button class="ic" aria-label="Voltar" onclick="S.chat=false;render()">←</button>`}<h1>Equipe Carsz</h1><button class="ic" aria-label="Menu" onclick="menu()">⋯</button></header>
  <main><div class="chatbox">
    ${aprov}
    ${podeDocs?`<div class="card" style="padding:11px 13px"><div class="row"><div style="flex:1"><b>📎 Documentos para análise</b><div class="muted sm">${feitos} de ${obrig.length} obrigatórios enviados</div></div><button class="btn sm" onclick="abrirDocs()">${feitos?'Ver / enviar':'Enviar'}</button></div></div>`:''}
    <div class="chat" id="chat">${msgs}</div>
    <div class="composer">${podeDocs?`<button class="btn clip" onclick="abrirDocs()" aria-label="Anexar documentos">📎</button>`:''}<textarea id="c_txt" placeholder="Escreva sua mensagem…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMsg()}"></textarea><button class="btn" id="c_env" onclick="enviarMsg()">Enviar</button></div>
  </div></main>`;
}
async function enviarMsg(){
  const t=document.getElementById('c_txt'); const txt=(t&&t.value||'').trim(); if(!txt) return;
  const b=document.getElementById('c_env'); if(b) b.disabled=true;
  try{ const r=await rpc('cand_msg_enviar',{p_token:S.token,p_texto:txt}); if(r&&r.erro){ toast(r.erro); } else { t.value=''; await carregar(true); } }
  catch(e){ erroGenerico(e); } finally{ const b2=document.getElementById('c_env'); if(b2) b2.disabled=false; }
}
function abrirDocs(){
  const c=docsInfo(), t=S.dados.tri; const lista=docsObrig(t).concat(['complementar']);
  sheet(`<h3>📎 Documentos para análise</h3><p class="muted sm" style="margin:0 0 6px">Foto ou PDF (PDF até 2 MB). Pode enviar mais de um arquivo por item.</p>
    ${lista.map(k=>docRow(k,c)).join('')}
    <button class="btn ghost" style="margin-top:6px" onclick="fecharSheet()">Fechar</button>`);
  S.sheet=true;
}
function lerImagem(file){
  return new Promise((ok,erro)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const max=1600; let w=img.naturalWidth, h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      let q=.8, out=cv.toDataURL('image/jpeg',q); while(out.length>1300000&&q>.35){ q-=.1; out=cv.toDataURL('image/jpeg',q); } ok(out); };
    img.onerror=()=>{ URL.revokeObjectURL(url); erro(new Error('imagem')); };
    img.src=url;
  });
}
function lerPdf(file){ return new Promise((ok,erro)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>erro(new Error('arquivo')); r.readAsDataURL(file); }); }
async function enviarDoc(tipo,input){
  const files=[...(input.files||[])]; input.value=''; if(!files.length) return;
  let ok=0;
  for(const f of files){
    try{
      toast('Enviando '+f.name.slice(0,28)+'…');
      let arq;
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){ if(f.size>2000000){ toast('PDF muito grande (máximo 2 MB): '+f.name.slice(0,24)); continue; } arq=await lerPdf(f); if(!arq.startsWith('data:application/pdf')) arq=arq.replace(/^data:[^;]*;/,'data:application/pdf;'); }
      else arq=await lerImagem(f);
      const r=await rpc('cand_doc_enviar',{p_token:S.token,p_tipo:tipo,p_nome:f.name.replace(/\.[^.]+$/,'').slice(0,60),p_arquivo:arq});
      if(r&&r.erro){ toast(r.erro); continue; } ok++;
    }catch(e){ if(e&&e.message==='imagem') toast('Não consegui ler essa imagem. Tente outra foto.'); else erroGenerico(e); }
  }
  if(ok){ toast(ok>1?ok+' arquivos enviados ✔':'Enviado ✔'); await carregar(true); if(S.sheet) abrirDocs(); }
}

  const t=S.dados&&S.dados.tri; const podeChat=S.token&&t&&t.triagem!=='reprovado'&&!S.chat;

    <button class="btn ghost" onclick="fecharSheet()">Fechar</button>`);
}
function encerrar(){ if(confirm('Encerrar o atendimento neste aparelho? A conversa continua com a equipe, mas você não poderá reabri-la daqui.')) sairLocal(); }

function telaAtual(){
  if(!S.token){ if(S.lgpd==='fim') return telaFim(); if(S.lgpd==='nao') return telaLgpdNao(); if(S.lgpd!=='sim') return telaLgpd(false); return telaForm(); }
  const d=S.dados; if(!d) return `<header><h1>Área do Cliente</h1></header><main><div class="empty">Carregando…</div></main>`;
  const t=d.tri, aprovado=d.candidato.status==='aprovado'||d.candidato.status==='virou';
  if(aprovado||(S.chat&&t.triagem!=='reprovado')) return telaChat();
  if(!t.lgpd){ if(S.lgpd==='fim') return telaFim(); if(S.lgpd==='nao') return telaLgpdNao(); if(S.lgpd!=='sim') return telaLgpd(true); return telaContatoLegado(); }
  if(t.encerrado) return telaEncerrado(t);
  if(!S.tela&&t.bloqueio) return telaAviso(t);
  const tela=S.tela||telaDaEtapa(t);
  return tela==='c'?telaC():tela==='d'?telaD():tela==='d2'?telaD2():tela==='e'&&t.precisaAval?telaE():telaDocs(t);
}
function render(rolar){
  const app=document.getElementById('app'); const t=document.getElementById('c_txt'); const keep=t?{v:t.value,foco:document.activeElement===t}:null;
  const ae=document.activeElement; const foco=ae&&ae.id&&app.contains(ae)&&/^(c_nome|c_cel|c_email|a_nome|a_par|a_cel|a_mail)$/.test(ae.id)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  app.innerHTML=telaAtual();
  if(keep){ const n=document.getElementById('c_txt'); if(n){ n.value=keep.v; if(keep.foco) n.focus(); } }
  if(foco){ const e=document.getElementById(foco.id); if(e){ e.focus(); try{ e.setSelectionRange(foco.s,foco.e); }catch(_){} } }
  if(S.token&&S.chat&&rolar!==false){ const c=document.getElementById('chat'); if(c&&c.lastElementChild) c.lastElementChild.scrollIntoView({block:'end'}); }
}
