<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{
  /* paleta do site carsz.com.br: azul-marinho profundo + amarelo Carsz */
  color-scheme:dark;
  --bg:#0f1824; --card:#172131; --ink:#ffffff; --muted:#a3afc2; --line:#27334a; --brand:#ffb800; --brand-ink:#0e1929;
  --soft:#2a2614; --ok:#3ddc84; --ok-bg:#10281d; --warn:#ffcf4d; --warn-bg:#2d2508; --bad:#ff7b7b; --bad-bg:#341618;
  --mine:#ffb800; --mine-ink:#0e1929; --theirs:#232d40; --head:#0b1320; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.plate,.pts{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--head);border-bottom:1px solid var(--line);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;flex:1;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
header h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
header .ic{background:rgba(255,255,255,.1);border:0;border-radius:10px;color:#fff;font-size:20px;width:40px;height:40px}
main{flex:1;padding:14px 16px 24px;max-width:640px;width:100%;margin:0 auto}
nav.tabs{position:sticky;bottom:0;background:var(--head);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:9px 1px 8px;color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .i{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:4px 11px;font-size:12.5px}.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.atag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:0 6px;margin-right:6px;background:rgba(127,127,127,.25)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);background:#e5484d;color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.plate{display:inline-block;font:700 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;background:#fff;color:#111;border:2px solid #111;border-top:8px solid #1d4ed8;border-radius:7px;padding:6px 12px 5px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;text-align:center}
.btn.sec{background:var(--soft);color:var(--brand)}
.btn.ghost{background:none;color:var(--muted);font-weight:600;padding:10px}
.btn.danger{background:#e5484d;color:#fff}
.btn:disabled{opacity:.55}
.btn.sm{padding:10px;font-size:14px;display:inline-block;width:auto}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
.alert{border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid}
.alert.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.alert.org{background:rgba(234,88,12,.13);border-color:#ea580c;color:#ea580c}
.alert.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.alert.info{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.alert b.t{display:block;font-size:17px;margin-bottom:4px}
.alert .txt{color:var(--ink);font-size:15px;margin:2px 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--soft);color:var(--brand)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.neu{background:var(--theirs);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg .h{font-size:12px;opacity:.75;margin-top:3px}
.msg.eu{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:4px}
.msg.eq{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0 0;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:120px;flex:1;margin:0;padding:11px}
.composer button{width:auto;padding:0 18px;height:46px}
/* login */
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 30px) 20px 30px}
.login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 10px;box-shadow:var(--shadow)}
.login h1{text-align:center;margin:0 0 2px;font-size:24px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:8px 0 0}
/* verificações obrigatórias */
/* Início organizada: 4 tamanhos de fonte e cores com significado fixo (vermelho=urgente, amarelo=ação, verde=feito, cinza=info) */
.t1{font-size:20px;font-weight:800;line-height:1.15}.t2{font-size:16px;font-weight:700}.t3{font-size:14px}.t4{font-size:12px;color:var(--muted)}
.sec-t{font:800 11px/1 Inter,system-ui,sans-serif;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:18px 2px 8px}
.sec-t.red{color:#ff7b7b}
.hero{border-radius:14px;padding:13px;margin-bottom:10px;border:1.5px solid}
.hero.g{background:var(--ok-bg);border-color:var(--ok)}.hero.y{background:var(--warn-bg);border-color:var(--warn)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:9px}.bar i{display:block;height:6px;border-radius:9px;background:var(--ok)}.bar i.y{background:var(--warn)}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip2{border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--ok-bg);color:var(--ok)}.chip2.p{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}.chip2.r{background:var(--bad-bg);color:var(--bad)}
.alert .txt{font-size:14px}
#faixa_pedagio b.t{font-size:16px}
.vcard{display:flex;align-items:center;gap:10px}
.vcard .mod{font-size:12px;color:var(--muted);margin-top:4px;text-align:right;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:190px}
.pts-row{display:flex;align-items:flex-end;gap:12px}
details.mais>summary{cursor:pointer;font-weight:700;color:var(--brand);font-size:14px;margin-top:10px;list-style:none}
details.mais>summary::-webkit-details-marker{display:none}
/* cobrança em atraso: app todo vermelho + faixa piscando (some quando a equipe aceita promessa ou comprovante) */
body.atraso{--bg:#1d0e11;--card:#2b1519;--line:#5a2830;--brand:#ff4d4f;--brand-ink:#fff;--head:#3a0d12;--soft:#3d1a1f;--muted:#d9aeb2;--mine:#ff4d4f;--mine-ink:#fff;--theirs:#3a1d22}
body.atraso header h1::before{background:#fff}
.faixa-atraso{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;color:#fff;background:#ff2d32;padding:10px 16px;font-weight:800;font-size:14px;letter-spacing:.2px;position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:4;animation:piscaAtraso 1s ease-in-out infinite}
.faixa-atraso small{display:block;font-weight:500;font-size:12px;opacity:.95}
.faixa-atraso.fixa{cursor:default}
body.atraso main{animation:contornoAtraso 1s ease-in-out infinite}
@keyframes piscaAtraso{0%,100%{background:#ff2d32}50%{background:#8f1216}}

/* algo marcado para o motorista (manutenção confirmada, fotos do checklist): app amarelo + faixa (some quando a equipe dá baixa) */
body.amarelo{--bg:#1f1808;--card:#2e240a;--line:#6a5516;--brand:#f5b50a;--brand-ink:#2a1d00;--head:#3a2c06;--soft:#43340b;--muted:#e3cf93;--mine:#f5b50a;--mine-ink:#2a1d00;--theirs:#4c3a0f}
.faixa-av{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;color:#2a1d00;background:#f5b50a;padding:10px 16px;font-weight:800;font-size:14px;letter-spacing:.2px;position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:4;animation:piscaAv 2s ease-in-out infinite}
.faixa-av small{display:block;font-weight:600;font-size:12px}
.faixa-av.fixa{cursor:default}
.faixa-av.conf{background:#a97800;color:#fff;animation:none}
@keyframes piscaAv{0%,100%{background:#f5b50a}50%{background:#c98f00}}
@media (prefers-reduced-motion:reduce){.faixa-atraso,body.atraso main,.faixa-av{animation:none}}
.obrig{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.obrig .wrap{max-width:520px;margin:0 auto}

/* carrossel de etiquetas (sobe sozinho, por importância) e botão Resolver agora */
.car{position:relative;height:122px;overflow:hidden;border-radius:16px;margin:0 0 12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}

.car-t{font-weight:800;font-size:16px;line-height:1.2}.car-sub{font-size:12.5px;line-height:1.3;opacity:.95;max-height:2.7em;overflow:hidden}

.car-s.y .car-btn{background:#2a1d00;color:#ffb800}.car-s.b .car-btn{color:#1e3a8a}

.msg.auto-card{border-radius:14px;padding:10px 12px;max-width:92%}.msg.auto-card.y{background:#ffb800;color:#2a1d00}.msg.auto-card.r{background:#c62828;color:#fff}

const hhmm = iso => { try{ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };

function lerFoto(file){

    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const max=1280; let w=img.naturalWidth, h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      let q=.72, out=c.toDataURL('image/jpeg',q); while(out.length>650000&&q>.35){ q-=.1; out=c.toDataURL('image/jpeg',q); } ok(out); };
    img.onerror=()=>{ URL.revokeObjectURL(url); erro(new Error('imagem')); };
    img.src=url;
  });
}

// ---- telas ----
function render(rolarChat){
  const app=document.getElementById('app');
  if(!S.token){ document.body.classList.remove('atraso','amarelo'); app.innerHTML=telaLogin(); return; }
  if(!S.resumo){ app.innerHTML=`<header><h1>Carsz Motorista</h1></header><main><div class="empty">Carregando…</div></main>`; return; }
  const keep=guardarCampos();
  const r=S.resumo; const nl=r.nao_lidas||0;
  const novosAvisos=avisosVisiveis(r).filter(a=>!vistos.has(a.id)).length; const nRec=(r.comprovantes||[]).filter(c=>c.status==='recusado').length;
  if(S.resolver&&!pendencias(r).length){ S.resolver=false; setTimeout(()=>toast('Tudo em dia ✅'),50); }
  const atr=emAtraso(r); document.body.classList.toggle('atraso',atr); const amar=!atr&&avisosAmarelos(r).length>0; document.body.classList.toggle('amarelo',amar);
  const conteudo={inicio:telaInicio,avisos:telaAvisos,cobranca:telaCobranca,chat:telaChat,manut:telaManut}[S.tab](r);
  app.innerHTML=`<header><h1>Carsz Motorista</h1><button class="ic" aria-label="Menu" onclick="menu()">⋯</button></header>
    ${atr&&S.tab!=='cobranca'?faixaAtraso(r,true):atr?faixaAtraso(r,false):''}${amar?faixaAmarela(r,S.tab):''}<main>${conteudo}</main>
    <nav class="tabs">
      ${[['inicio','🏠','Início',0],['avisos','🔔','Avisos',novosAvisos],['cobranca','💳','Cobrança',nRec],['chat','💬','Chat',nl],['manut','🛠','Manutenção',0]].map(([k,i,l,n])=>`<button class="${S.tab===k?'on':''}" onclick="irPara('${k}')"><span class="i">${i}</span>${l}${n?`<span class="badge">${n}</span>`:''}</button>`).join('')}
    </nav>${S.resolver?obrigHtml(r):fabResolver(r)}`;
  document.body.style.overflow=S.resolver&&pendencias(r).length?'hidden':'';
  restaurarCampos(keep);
  if(!S.mestre&&!S.treinoChecado&&r.motorista&&r.motorista.id){ S.treinoChecado=true; if(!treinoVisto()) treinoAbrir(true); }
  if(S.tab==='chat'&&(rolarChat||keep.novo)){ const c=document.getElementById('chat_fim'); if(c) c.scrollIntoView({block:'end'}); }
}
// mantém o que a pessoa está digitando quando a tela atualiza sozinha
function guardarCampos(){ const k={vals:{},focus:null,novo:!document.getElementById('chat_fim')}; document.querySelectorAll('[data-keep]').forEach(e=>{ if(e.value!=='') k.vals[e.id]=e.value; }); const a=document.activeElement; if(a&&a.id) k.focus=a.id; return k; }
function restaurarCampos(k){ for(const [id,v] of Object.entries(k.vals)){ const e=document.getElementById(id); if(e&&e.value!==v) e.value=v; } if(k.focus){ const e=document.getElementById(k.focus); if(e&&e.focus) e.focus(); } }

function pagoDepoisDoBloqueio(r){

// quadro de pagamento e bloqueio. comAcoes=true (Início) inclui os botões de promessa e comprovante.
function quadroPagamento(r,comAcoes){
  const bl=(r.motorista||{}).bloqueio||{status:'normal'}; const pe=promessaEmAberto(r), pa=promessaAceita(r);
  const cs=r.comprovantes||[]; const pen=cs.filter(c=>c.status==='pendente'), rec=cs.filter(c=>c.status==='recusado'), pag=cs.filter(c=>c.status==='pago'&&diasDesde(c.baixaEm)<=3);
  const bloq=bl.status==='bloqueado', pend=emAtraso(r);

    +pen.map(c=>`<div class="txt">🧾 Comprovante enviado em ${dt(c)}${c.valor?' ('+fmtBRL(c.valor)+')':''} — <b>Aguardando conferência</b></div>`).join('')
    +pag.map(c=>`<div class="txt">✔ <b>Pagamento confirmado</b> em ${dt(c)}</div>`).join('');
  const btnProm=comAcoes&&!pe&&pend?`<button class="btn" onclick="formPromessa()">🤝 Prometer pagamento</button>`:'';
  const btnComp=comAcoes&&(pend||pe||pen.length||rec.length)?`<button class="btn ${btnProm||(!rec.length&&!pa)?'sec':''}" onclick="formComprovante()">🧾 ${rec.length?'Enviar de novo':'Enviar comprovante'}</button>`:'';
  const btnBloq=(comAcoes&&pend&&!pa)?`<button class="btn sec" onclick="irChat('bloqueio')">🔒 Falar sobre o bloqueio</button>`:'';
  const acoes=(btnProm||btnComp||btnBloq)?`<div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px">${btnProm}${btnComp}${btnBloq}</div>`:'';
  if(pend&&pa){
    const dB=bl.data||pa.dataPrometida;
    return `<div class="alert bad" id="quadro_promessa"><b class="t">⏳ Pagamento pendente · prazo até ${fmtD(dB)}</b><div class="txt">A cobrança aceitou a sua promessa${pa.resposta?' — '+esc(pa.resposta):''}. <b>Envie o comprovante do pagamento até ${fmtD(pa.dataPrometida)}, ou o veículo será bloqueado sem aviso prévio.</b></div>${extras}${acoes}</div>`;
  }
  if(pend){
    return `<div class="alert ${bloq?'bad':'warn'}"><b class="t">${bloq?'🔒 Veículo bloqueado':'⚠ Bloqueio programado'}${!bloq&&bl.data?' para '+fmtD(bl.data):''}</b>
      ${bl.motivo?`<div class="txt">${esc(bl.motivo)}</div>`:''}
      ${pe?`<div class="txt"><b>Promessa de pagamento registrada para ${fmtD(pe.dataPrometida)}</b> — aguardando resposta da cobrança.</div>`
          :`<div class="txt">${bloq?'Para pedir o desbloqueio, informe quando vai pagar.':'Para evitar o bloqueio, regularize ou informe quando vai pagar.'}</div>`}${extras}${acoes}</div>`;
  }
  if(rec.length) return `<div class="alert bad"><b class="t">🧾 Pagamento</b>${extras}${acoes}</div>`;
  return `<div class="alert ok"><b class="t" style="margin:0">✅ Tudo certo com o seu veículo</b>${extras}${acoes}</div>`;
}

// avisos que ainda valem na Início: só os novos, sem os já resolvidos (comprovante/foto recusados que não estão mais recusados) e dos últimos 7 dias

// chip do resumo de pagamento: em dia / pendente com a nova data / em atraso
function chipPagamento(r){

  const pag=cs.filter(c=>c.status==='pago').sort((a,b)=>String(b.baixaEm||'').localeCompare(String(a.baixaEm||'')))[0];

function telaInicio(r){

  let man='';

  }

    }

  // 4) RESUMO: pagamento em uma linha + pontuação compacta
  let resumo=`<div class="card" id="resumo_pag"><div class="row"><span class="t3">💳 Pagamento</span><span class="sp"></span>${chipPagamento(r)}</div></div>`;

const ASSUNTOS={pagamento:['Pagamento','warn'],bloqueio:['Bloqueio','bad'],monitoramento:['Monitoramento','neu'],manutencao:['Manutenção','neu'],sinistro:['Sinistro','bad'],documentos:['Documentos','neu'],outros:['Outros','neu'],reserva:['Reserva','neu']};
const ASSUNTOS_ESC=['pagamento','bloqueio','monitoramento','manutencao','sinistro','documentos','outros'];

function assuntoMsg(m){ if(m.assunto&&ASSUNTOS[m.assunto]) return m.assunto; if(m.tipo==='bloqueio') return 'bloqueio'; if(m.tipo==='promessa') return 'pagamento'; if(m.tipo==='agendamento') return 'manutencao'; const x=String(m.texto||''); if(x.startsWith('🧾')) return 'pagamento'; if(x.startsWith('🚗')) return 'reserva'; return ''; }
function irChat(assunto){ S.chatFiltro=assunto||'todos'; S.chatAssunto=assunto||S.chatAssunto||''; irPara('chat'); }

  const noFiltro=m=>{ const a=assuntoMsg(m); return fl==='todos'||a===fl||(fl==='outros'&&(!a||a==='reserva')); };
  const vis=ms.filter(noFiltro);
  h+=`<div class="chips">${['todos'].concat(ASSUNTOS_ESC).map(k=>`<button type="button" class="chip ${fl===k?'on':''}" onclick="chatFiltrar('${k}')">${k==='todos'?'Todos':ASSUNTOS[k][0]}</button>`).join('')}</div>`;
  let ult=''; const bol=m=>{ const a=assuntoMsg(m); const d=(m.em||'').slice(0,10); const sep=d&&d!==ult?`<div class="muted sm" style="text-align:center;margin:6px 0">— ${fmtD(d)} —</div>`:''; ult=d||ult;

    return sep+`<div class="msg ${m.de==='motorista'?'eu':'eq'}">${m.de!=='motorista'?`<b class="sm">${esc(m.setor?(m.autor||'Carsz'):'Carsz')}</b>${m.setor&&SETORES[m.setor]?` <span class="atag" data-setor="${m.setor}">${SETORES[m.setor]}</span>`:''}<br>`:''}${a?`<span class="atag" data-assunto="${a}">${esc(ASSUNTOS[a][0])}</span>`:''}${esc(m.texto)}<div class="h">${esc(fmtHora(m.em))}</div></div>`; };
  const padrao=S.chatAssunto&&ASSUNTOS_ESC.includes(S.chatAssunto)?S.chatAssunto:(fl!=='todos'&&ASSUNTOS_ESC.includes(fl)?fl:(()=>{ for(let i=ms.length-1;i>=0;i--){ const a=assuntoMsg(ms[i]); if(a&&a!=='reserva') return a; } return 'outros'; })());

    <textarea id="chat_txt" data-keep placeholder="Escreva sua mensagem…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMsg()}"></textarea><button class="btn" onclick="enviarMsg()">Enviar</button></div>`;
  return h;
}

// ---- comprovante de pagamento (foto ou PDF até 2 MB) ----
function lerArquivo(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
    if(file.size>2*1024*1024) return Promise.reject(new Error('pdfgrande'));
    return new Promise((ok,erro)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).replace(/^data:[^;,]*;base64,/,'data:application/pdf;base64,')); fr.onerror=()=>erro(new Error('imagem')); fr.readAsDataURL(file); });
  }
  return lerFoto(file);
}
// devolve true se enviou; mostra o erro na tela e devolve false se não deu
async function postComprovante(file,valor,obs){
  try{
    const arq=await lerArquivo(file);
    const d=await rpc('mot_enviar_comprovante',{p_token:S.token,p_arquivo:arq,p_valor:valor,p_obs:obs||''});
    if(d&&d.erro){ toast(d.erro); return false; }
    return true;
  }catch(e){
    if(e&&e.message==='pdfgrande'){ toast('PDF muito grande (máximo 2 MB).'); return false; }
    if(e&&e.message==='imagem'){ toast('Não consegui ler o arquivo. Tente uma foto ou PDF.'); return false; }
    erroGenerico(e); return false;
  }
}

  const b=document.getElementById('ag_btn'); b.disabled=true;
  try{
    const d=await rpc('mot_agendar',{p_token:S.token,p_data:data,p_descricao:desc,p_km:km});
    if(d&&d.erro){ toast(d.erro); b.disabled=false; return; }
    toast('Pedido enviado! A Carsz vai confirmar.'); document.getElementById('ag_desc').value=''; document.getElementById('ag_km').value=''; await atualizar(true);
  }catch(e){ erroGenerico(e); b.disabled=false; }
}

// menu (⋯)
function menu(){
  sheet(`<h3>${esc(S.nome||'Minha conta')}</h3><p class="muted" style="margin:0 0 12px">Carsz Motorista</p>
    <button class="btn sec" style="margin-bottom:8px" onclick="treinoAbrir(false)">📖 Como usar o app (passo a passo)</button>
    ${emApp?'':`<button class="btn sec" style="margin-bottom:8px" onclick="fecharSheet();instalar()">📲 Instalar o app</button>`}
    <button class="btn sec" style="margin-bottom:8px" onclick="fecharSheet();abrirPedagio()">🛣 Consultar pedágios (free flow)</button>
    ${(S.resumo&&S.resumo.veiculo)?(S.resumo.reserva?`<button class="btn sec" style="margin-bottom:8px" onclick="fecharSheet();devolverReserva()">↩ Devolver carro reserva</button>`:(S.resumo.reservaAtivo===false?`<div class="muted sm" style="margin-bottom:8px">🚗 Carro reserva indisponível no momento.</div>`:`<button class="btn sec" style="margin-bottom:8px" onclick="fecharSheet();formTrocarPlaca()">🚗 Carro reserva</button>`)):''}
    <button class="btn danger" style="margin-bottom:4px" onclick="fecharSheet();sair()">Sair</button>
    <button class="btn ghost" onclick="fecharSheet()">Fechar</button>`);
}
// ---- carro reserva (a placa principal segue pontuando; o motorista só escolhe entre placas vagas) ----
async function formTrocarPlaca(){
  sheet(`<h3>🚗 Carro reserva</h3><div class="muted">Carregando placas vagas…</div>`);
  try{
    const vagas=await rpc('mot_placas_vagas',{p_token:S.token});
    if(!document.getElementById('sheet_bg')) return;
    sheet(`<h3>🚗 Peguei um carro reserva</h3><p class="muted">Escolha a placa do carro que você pegou. Só aparecem placas <b>vagas</b>. Sua placa principal <b>${esc((S.resumo.principal||{}).placa||'')}</b> continua pontuando e fica guardada para você.</p>
      ${(vagas||[]).length?`<label for="tp_veic">Placa do carro reserva</label><select id="tp_veic">${vagas.map(v=>`<option value="${esc(v.id)}">${esc(v.placa)} · ${esc(v.modelo||'')}</option>`).join('')}</select>
      <div style="margin-top:14px"><button class="btn" id="tp_btn" onclick="trocarPlaca()">Confirmar troca</button><button class="btn ghost" onclick="fecharSheet()">Cancelar</button></div>`
      :`<div class="empty">Nenhuma placa vaga agora. Fale com a Carsz pelo chat.</div><button class="btn ghost" onclick="fecharSheet()">Fechar</button>`}`);
  }catch(e){ fecharSheet(); erroGenerico(e); }
}
async function trocarPlaca(){
  const sel=document.getElementById('tp_veic'); if(!sel||!sel.value) return; const b=document.getElementById('tp_btn'); b.disabled=true;
  try{
    const d=await rpc('mot_trocar_placa',{p_token:S.token,p_veiculo_id:sel.value});
    if(d&&d.erro){ toast(d.erro); b.disabled=false; if(/vaga/.test(d.erro)) formTrocarPlaca(); return; }
    fecharSheet(); toast('Carro reserva '+(d.placa||'')+' registrado'); ultimoMsgs=''; S.msgs=null; await atualizar(true);
  }catch(e){ erroGenerico(e); b.disabled=false; }
}
async function devolverReserva(){
  if(!confirm('Você devolveu o carro reserva e voltou para o seu carro?')) return;
  try{
    const d=await rpc('mot_devolver_reserva',{p_token:S.token});
    if(d&&d.erro){ toast(d.erro); return; }
    toast('Reserva devolvido. Você voltou para a sua placa.'); ultimoMsgs=''; S.msgs=null; await atualizar(true);
  }catch(e){ erroGenerico(e); }
}

// ---- treinamento: passo a passo curto. Abre sozinho no 1º acesso (antes da tela principal) e fica no menu "Como usar o app" ----
let TR={i:0,primeira:false,ck:{},ass:'pagamento'};
const treinoChave = () => 'mot_treino_'+((((S.resumo||{}).motorista)||{}).id||'');
const treinoVisto = () => !!LS.get(treinoChave());
function treinoPassos(){
  const v=(S.resumo&&S.resumo.veiculo)||{}; const placa=esc(v.placa||'ABC1D23');
  const icone=(document.querySelector('link[rel="apple-touch-icon"]')||{}).href||'';
  const ck=(k,em,t)=>`<div class="tr_ck${TR.ck[k]?' on':''}" onclick="treinoCk('${k}')"><span class="bx">${TR.ck[k]?'✓':''}</span><span>${em} ${t}</span></div>`;
  const ASS={pagamento:['Pagamento','Dúvida sobre valor, Pix ou comprovante.'],bloqueio:['Bloqueio','Pedir desbloqueio depois de pagar, contestar ou avisar roubo/furto.'],manutencao:['Manutenção','Combinar data da revisão, troca de óleo ou conserto.'],outros:['Outros','Qualquer outro assunto com a Carsz.']};
  const P=[];
  if(!emApp) P.push({t:'Coloque o app na tela inicial',
    ill:()=>`<div style="text-align:center"><img src="${icone}" alt="" style="width:104px;height:104px;border-radius:24px;border:2px solid var(--line)"><div class="muted sm" style="margin-top:10px">Carsz Motorista</div></div>`,
    x:ehIos?'No <b>Safari</b>, toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>. Assim o app abre com um toque, como qualquer outro.':'No <b>Chrome</b>, toque nos <b>três pontinhos</b> e depois em <b>Instalar app</b> (ou "Adicionar à tela inicial"). Assim o app abre com um toque, como qualquer outro.'});
  P.push({t:'Seu acesso',
    ill:()=>`<div style="width:100%"><div class="tr_in"><small>Login</small>CPF</div><div class="tr_in"><small>Senha</small>placa do seu carro (ex.: ${placa})</div></div>`,
    x:'Você entra com o seu <b>CPF</b> e a senha é a <b>placa do seu veículo</b>, sem traço. Pelo site <b>www.carsz.com.br</b> é só tocar em <b>Área do Motorista</b>. O app lembra de você neste celular. Pegou o carro reserva ou trocou de carro? A senha continua sendo a placa principal.'});
  P.push({t:'Início e Avisos',
    ill:()=>`<div style="width:100%"><div class="card" style="margin-bottom:10px"><div class="row"><span class="plate">${placa}</span><div><b>${esc(v.modelo||'Seu veículo')}</b><div class="muted sm">${esc(v.ano||'')}</div></div></div></div><div class="alert ok"><b class="t" style="margin:0">✅ Tudo certo com o seu veículo</b></div></div>`,
    x:'Na tela inicial você vê o seu veículo e se está tudo certo. Em <b>Avisos</b> ficam os recados da Carsz. A bolinha vermelha mostra o que é novo.'});
  P.push({t:'Todo dia: água, óleo e luzes',
    ill:()=>`<div style="width:100%">${ck('agua','💧','Água verificada')}${ck('oleo','🛢','Óleo verificado')}${ck('luz','💡','Lanternas e faróis')}<div class="muted sm" style="text-align:center;margin-top:8px">${(TR.ck.agua&&TR.ck.oleo&&TR.ck.luz)?'👏 Pronto! No app de verdade o horário fica registrado.':'👆 Toque nos itens para treinar'}</div></div>`,
    x:'Todo dia o app pede para você confirmar que <b>verificou água, óleo, lanternas e faróis</b>. Toque em "Já verifiquei" em cada item. Fica registrado o dia e o horário, e cada item rende pontos.'});
  P.push({t:'Segunda-feira: fotos e km',
    ill:()=>`<div style="width:100%"><div class="card"><b>📷 Painel de instrumentos</b><div class="tr_in" style="margin-top:8px"><small>Km que aparece no painel</small>45.320</div></div><div class="card"><b>📷 Etiqueta da troca de óleo</b><div class="muted sm">Foto bem de perto, com o texto legível.</div></div></div>`,
    x:'Toda <b>segunda-feira</b> o app pede duas fotos: do <b>painel</b> (digite o km igual ao que aparece nele) e da <b>etiqueta de troca de óleo</b>. Foto escura ou cortada pode ser recusada pela equipe. É só enviar de novo.'});
  P.push({t:'Cobrança e pagamento',
    ill:()=>`<div style="width:100%"><div class="alert warn"><b class="t">⚠ Bloqueio programado</b><div class="txt">Regularize ou informe quando vai pagar.</div><div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px"><span class="btn" style="width:auto">🤝 Prometer pagamento</span><span class="btn sec" style="width:auto">🧾 Enviar comprovante</span></div></div></div>`,
    x:'Na aba <b>Cobrança</b> você acompanha a sua situação. Pagou? Envie o <b>comprovante</b>. Vai atrasar? Use <b>Prometer pagamento</b> e diga a data. A Carsz responde pelo app. Os botões de promessa aparecem quando existe aviso de bloqueio.'});
  P.push({t:'Chat e pedidos',
    ill:()=>`<div style="width:100%"><div class="chips" style="justify-content:center">${Object.entries(ASS).map(([k,[n]])=>`<span class="chip${TR.ass===k?' on':''}" onclick="treinoAss('${k}')" style="cursor:pointer">${n}</span>`).join('')}</div><div class="card" style="text-align:center"><b>${ASS[TR.ass][0]}</b><div class="muted sm" style="margin-top:4px">${ASS[TR.ass][1]}</div></div></div>`,
    x:'No <b>Chat</b> você fala com a Carsz e escolhe o <b>assunto</b> da conversa. Na aba <b>Manutenção</b> você pede uma data para revisão ou conserto. Se o carro for <b>roubado ou furtado</b>, ligue <b>190</b> e depois avise pelo assunto Bloqueio.'});
  P.push({t:'Pontos e ranking',
    ill:()=>`<div style="width:100%"><div class="card"><div class="row"><b>🏆 Melhores motoristas</b></div><div class="row" style="padding:6px 0"><span>🥇</span><b>ABC1D23</b><span class="sp"></span><b>+21,3</b></div><div class="row" style="padding:6px 0"><span>🥈</span><b>EFG4H56</b><span class="sp"></span><b>+12,1</b></div><div class="row" style="padding:6px 8px;border-radius:8px;background:var(--brand);color:var(--brand-ink)"><span>6º</span><b>${placa}</b><span class="sp"></span><b>você</b></div></div></div>`,
    x:'Você ganha pontos fazendo as verificações e mandando as fotos em dia. Atraso no pagamento e promessa de pagamento tiram pontos. O ranking começa do zero todo dia 1º do mês. <b>Pronto, é só usar!</b>'});
  return P;
}
function treinoAbrir(primeira){ if(S.sheetAberto) fecharSheet(); TR={i:0,primeira:!!primeira,ck:{},ass:'pagamento'}; treinoRender(); document.body.style.overflow='hidden'; }
function treinoFechar(){
  if(!S.mestre) LS.set(treinoChave(),'1');
  const e=document.getElementById('treino'); if(e) e.remove();
  document.body.style.overflow=(S.resumo&&pendencias(S.resumo).length)?'hidden':'';
}
function treinoIr(d){ const n=treinoPassos().length; TR.i=Math.max(0,Math.min(n-1,TR.i+d)); treinoRender(); }
function treinoCk(k){ TR.ck[k]=!TR.ck[k]; treinoRender(); }
function treinoAss(k){ TR.ass=k; treinoRender(); }
function treinoRender(){
  const P=treinoPassos(), p=P[TR.i], ult=TR.i===P.length-1;
  let el=document.getElementById('treino'); if(!el){ el=document.createElement('div'); el.id='treino'; el.className='tr'; document.body.appendChild(el); }
  el.innerHTML=`<div class="in"><div class="top"><button class="lnk" onclick="treinoFechar()">${ult?'':'Pular'}</button><span>${TR.i+1} / ${P.length}</span></div>
    <div class="ill">${p.ill()}</div>
    <h2>${p.t}</h2><div class="muted txt">${p.x}</div>
    <div class="dots">${P.map((_,i)=>`<i class="${i===TR.i?'on':''}"></i>`).join('')}</div>
    <div class="nav">${TR.i>0?`<button class="btn sec" id="tr_volta" onclick="treinoIr(-1)">Voltar</button>`:''}${ult?`<button class="btn" id="tr_fim" onclick="treinoFechar()">Entendi, ir para o app</button>`:`<button class="btn" id="tr_prox" onclick="treinoIr(1)">Próximo</button>`}</div></div>`;
}

// ---- boot ----
if(S.mestre){ document.body.insertAdjacentHTML('afterbegin','<div id="mestre_bar" style="position:sticky;top:0;z-index:50;background:#7c3aed;color:#fff;padding:8px 12px;font:700 13px system-ui;text-align:center">👁 Acesso rápido do master · somente visualização (nada é enviado nem registrado como uso do motorista) · <a href="#" onclick="window.close();return false" style="color:#fff">Fechar</a></div>'); }
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('service worker não registrado:',e)); }); }
render();
if(S.token) atualizar(true);
</script>
