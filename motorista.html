<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --brand:#2563eb; --brand-ink:#fff;
  --soft:#eef3ff; --ok:#15803d; --ok-bg:#e8f7ee; --warn:#b45309; --warn-bg:#fff4dd; --bad:#b91c1c; --bad-bg:#fdeaea;
  --mine:#2563eb; --mine-ink:#fff; --theirs:#e9edf5; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b0e13; --card:#151a22; --ink:#e8edf5; --muted:#93a0b4; --line:#262d3a; --soft:#172138; --ok:#4ade80; --ok-bg:#0f2a1b;
    --warn:#fbbf24; --warn-bg:#2d2208; --bad:#f87171; --bad-bg:#321416; --theirs:#1f2633; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;flex:1;letter-spacing:.2px}
header .ic{background:rgba(255,255,255,.18);border:0;border-radius:10px;color:#fff;font-size:20px;width:40px;height:40px}
main{flex:1;padding:14px 16px 24px;max-width:640px;width:100%;margin:0 auto}
nav.tabs{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .i{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
.badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.plate{display:inline-block;font:700 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;background:#fff;color:#111;border:2px solid #111;border-top:8px solid #1d4ed8;border-radius:7px;padding:6px 12px 5px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;text-align:center}
.btn.sec{background:var(--soft);color:var(--brand)}
.btn.ghost{background:none;color:var(--muted);font-weight:600;padding:10px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.55}
.btn.sm{padding:10px;font-size:14px;display:inline-block;width:auto}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
.alert{border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid}
.alert.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.alert.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.alert.info{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.alert b.t{display:block;font-size:17px;margin-bottom:4px}
.alert .txt{color:var(--ink);font-size:15px;margin:2px 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--soft);color:var(--brand)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.neu{background:var(--theirs);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:16px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg .h{font-size:11px;opacity:.75;margin-top:3px}
.msg.eu{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:4px}
.msg.eq{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0 0;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:120px;flex:1;margin:0;padding:11px}
.composer button{width:auto;padding:0 18px;height:46px}
/* login */
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 30px) 20px 30px}
.login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 10px;box-shadow:var(--shadow)}
.login h1{text-align:center;margin:0 0 2px;font-size:24px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:8px 0 0}
/* verificações obrigatórias */
.obrig{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.obrig .wrap{max-width:520px;margin:0 auto}
.obrig h2{margin:0 0 4px;font-size:22px}
.obrig .it{display:flex;gap:12px;align-items:flex-start}
.obrig .it .em{font-size:30px;line-height:1}
.obrig .it .tx{flex:1;min-width:0}
.obrig .it .tx b{display:block;font-size:16px}
.obrig .done{opacity:.85;border-color:var(--ok)}
.obrig label.btn{cursor:pointer;margin:10px 0 0}
.obrig input[type=file]{display:none}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#111c;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90%;text-align:center;backdrop-filter:blur(6px)}
.list-i{border-top:1px solid var(--line);padding:10px 0}
.list-i:first-child{border-top:0}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--muted);padding:8px 10px;font-size:14px}
</style>
</head>

// ---- chamadas ao banco ----
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if(error){
    if(/sessao_invalida/.test(error.message||'')){ sair(true); throw new Error('sessao'); }
    throw error;
  }
  return data;
}
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }
function erroGenerico(e){ if(e&&e.message==='sessao') return; console.error(e); toast('Sem conexão ou erro. Tente de novo.'); }

// ---- sessão ----
async function entrar(){
  const cpf=document.getElementById('lg_cpf').value, senha=document.getElementById('lg_senha').value;
  const err=document.getElementById('lg_err'), btn=document.getElementById('lg_btn');
  if(cpf.replace(/\D/g,'').length!==11||!senha){ err.textContent='Informe o CPF (11 números) e a senha'; return; }
  err.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
  try{
    const { data, error } = await sb.rpc('mot_login',{ p_cpf:cpf, p_senha:senha });
    if(error) throw error;
    if(data&&data.erro){ err.textContent=data.erro; btn.disabled=false; btn.textContent='Entrar'; return; }
    S.token=data.token; S.nome=data.nome||''; LS.set('mot_token',S.token); LS.set('mot_nome',S.nome);
    S.tab='inicio'; S.resumo=null; S.msgs=null; await atualizar(true);
  }catch(e){ err.textContent='Não foi possível entrar agora. Confira a internet e tente de novo.'; btn.disabled=false; btn.textContent='Entrar'; console.error(e); }
}
async function sair(silencioso){
  const t=S.token; S.token=null; S.resumo=null; S.msgs=null; LS.del('mot_token');
  if(t&&!silencioso){ try{ await sb.rpc('mot_logout',{p_token:t}); }catch(e){} }
  render();
}

let ultimoResumo=''; let ultimoMsgs='';
async function atualizar(forcar){
  if(!S.token) return;
  try{
    const r=await rpc('mot_resumo',{p_token:S.token});
    const js=JSON.stringify(r);
    const mudouR = js!==ultimoResumo; S.resumo=r; ultimoResumo=js;
    let mudouM=false;
    if(S.tab==='chat'){
      const m=await rpc('mot_msgs',{p_token:S.token}); const jm=JSON.stringify(m);
      mudouM = jm!==ultimoMsgs; S.msgs=m; ultimoMsgs=jm;
      if(r.nao_lidas){ S.resumo.nao_lidas=0; }
    }
    if(forcar||mudouR||mudouM) render(mudouM);
  }catch(e){ if(!S.resumo) erroGenerico(e); }
}

// ---- verificações obrigatórias: água/óleo todo dia + fotos (painel e etiqueta de óleo) toda segunda ----
const hhmm = iso => { try{ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
function pendencias(r){
  const v=r.veiculo, bl=(r.motorista.bloqueio||{}).status;
  if(!v||bl==='bloqueado'||r.na_oficina) return []; // carro parado (bloqueado ou na oficina): não cobra verificação
  const ve=r.verificacoes||{}, f=r.fotos||{}, p=[];
  if(!ve.agua) p.push('agua'); if(!ve.oleo) p.push('oleo');
  if(f.status==='pendente'||f.status==='atrasada'||f.status==='refazer'){ if(!f.painel) p.push('painel'); if(!f.etiqueta) p.push('etiqueta'); }
  return p;
}
function obrigHtml(r){
  const pend=pendencias(r); if(!pend.length) return '';
  const ve=r.verificacoes||{}, f=r.fotos||{}; const comFotos=f.status==='pendente'||f.status==='atrasada'||f.status==='refazer'; const rec=f.recusadas||{};
  const item=(k,em,tit,desc,hora,acao)=> hora
    ? `<div class="card done"><div class="it"><span class="em">✅</span><div class="tx"><b>${tit}</b><div class="muted sm">Registrado hoje às ${hhmm(hora)}</div></div></div></div>`
    : `<div class="card"><div class="it"><span class="em">${em}</span><div class="tx"><b>${tit}</b><div class="muted sm">${desc}</div>${acao}</div></div></div>`;
  const btn=(t,tit)=>`<button class="btn" id="vb_${t}" onclick="verificar('${t}')">Já verifiquei ${tit}</button>`;
  const foto=t=>`<label class="btn" id="fb_${t}">${rec[t]?'📷 Enviar nova foto':'📷 Tirar foto'}<input type="file" accept="image/*" capture="environment" data-foto="${t}" onchange="enviarFoto('${t}',this)"></label>`;
  let h=`<div class="obrig"><div class="wrap"><h2>✋ Verificações obrigatórias</h2>
    <p class="muted" style="margin:0 0 14px">Para continuar usando o app, confirme os itens abaixo. Fica registrado o dia e o horário de cada um.</p>`;
  if(comFotos){
    h+=f.status==='refazer'
      ? `<div class="alert bad"><b class="t">📷 Foto recusada pela cobrança</b><div class="txt">Alguma foto veio ilegível ou com informação errada. Veja o motivo abaixo e envie de novo.</div></div>`
      : f.status==='atrasada'
      ? `<div class="alert bad"><b class="t">🚨 Fotos da semana atrasadas</b><div class="txt">As fotos eram para segunda-feira. O veículo está sujeito a bloqueio — envie agora.</div></div>`
      : `<div class="alert warn"><b class="t">⚠ Hoje é dia das fotos da semana</b><div class="txt">Envie até hoje, 23:59. Sem as fotos, o veículo poderá ser bloqueado.</div></div>`;
  }
  h+=item('agua','💧','Água do radiador','Com o motor frio, confira o nível do reservatório de água.',ve.agua,btn('agua','a água'));
  h+=item('oleo','🛢','Óleo do motor','Confira o nível do óleo na vareta.',ve.oleo,btn('oleo','o óleo'));
  if(comFotos){
    const motivo=t=>rec[t]?`<div class="alert bad" style="margin:6px 0"><b>Foto recusada:</b> ${esc(rec[t].motivo||'ilegível ou informação errada')}</div>`:'';
    h+=item('painel','📷','Foto do painel de instrumentos',motivo('painel')+'Com o carro ligado, foto do painel inteiro mostrando o km (hodômetro) e as luzes. Deve ficar nítida e legível.',f.painel,foto('painel'));
    h+=item('etiqueta','📷','Foto da etiqueta de troca de óleo',motivo('etiqueta')+'Foto da etiqueta/adesivo com o km da próxima troca de óleo. Deve ficar nítida e legível.',f.etiqueta,foto('etiqueta'));
  }
  return h+`<div class="muted sm" style="text-align:center;margin-top:6px">Faltam ${pend.length} item${pend.length>1?'s':''}.</div></div></div>`;
}
async function verificar(tipo){
  const b=document.getElementById('vb_'+tipo); if(b) b.disabled=true; S.ocupado=true;
  try{ const r=await rpc('mot_verificar',{p_token:S.token,p_tipo:tipo}); if(r&&r.erro){ toast(r.erro); } else { toast('Registrado às '+hhmm(r.em)); } await atualizar(true); }
  catch(e){ erroGenerico(e); if(b) b.disabled=false; }
  finally{ S.ocupado=false; }
}
function lerFoto(file){
  return new Promise((ok,erro)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const max=1280; let w=img.naturalWidth, h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      let q=.72, out=c.toDataURL('image/jpeg',q); while(out.length>650000&&q>.35){ q-=.1; out=c.toDataURL('image/jpeg',q); } ok(out); };
    img.onerror=()=>{ URL.revokeObjectURL(url); erro(new Error('imagem')); };
    img.src=url;
  });
}
async function enviarFoto(tipo,input){
  const file=input.files&&input.files[0]; if(!file) return;
  const lb=document.getElementById('fb_'+tipo); S.ocupado=true; if(lb) lb.firstChild.textContent='Enviando…';
  try{
    const foto=await lerFoto(file);
    const r=await rpc('mot_enviar_foto',{p_token:S.token,p_tipo:tipo,p_foto:foto});
    if(r&&r.erro){ toast(r.erro); if(lb) lb.firstChild.textContent='📷 Tirar foto'; }
    else { toast('Foto enviada às '+hhmm(r.em)); await atualizar(true); }
  }catch(e){ if(e&&e.message==='imagem'){ toast('Não consegui ler a foto. Tire de novo.'); if(lb) lb.firstChild.textContent='📷 Tirar foto'; } else erroGenerico(e); if(lb) lb.firstChild.textContent='📷 Tirar foto'; }
  finally{ S.ocupado=false; input.value=''; }
}
function cartaoVerificacoes(r){
  const v=r.veiculo, ve=r.verificacoes||{}, f=r.fotos||{}; if(!v) return '';
  const rc=f.recusadas||{}; const linha=(ic,t,h,rec)=>`<div class="row" style="margin:4px 0"><span>${ic} ${t}</span><span class="sp"></span>${rec?'<span class="tag bad">recusada — enviar de novo</span>':h?`<span class="tag ok">${hhmm(h)}</span>`:'<span class="tag warn">pendente</span>'}</div>`;
  let h=`<div class="card"><h3>🧰 Verificações</h3>${linha('💧','Água hoje',ve.agua)}${linha('🛢','Óleo hoje',ve.oleo)}`;
  h+=`<div class="muted sm" style="margin:10px 0 4px"><b>Fotos da semana</b> (toda segunda-feira)</div>${linha('📷','Painel de instrumentos',f.painel,rc.painel)}${linha('📷','Etiqueta de óleo',f.etiqueta,rc.etiqueta)}`;
  if(f.status==='opcional'&&(!f.painel||!f.etiqueta)){
    h+=`<div class="muted sm" style="margin:8px 0 0">Você foi cadastrado nesta semana: as fotos passam a ser obrigatórias a partir da próxima segunda. Pode enviar já:</div>`;
    if(!f.painel) h+=`<label class="btn sec" id="fb_painel" style="margin-top:8px">📷 Foto do painel<input type="file" accept="image/*" capture="environment" data-foto="painel" onchange="enviarFoto('painel',this)" style="display:none"></label>`;
    if(!f.etiqueta) h+=`<label class="btn sec" id="fb_etiqueta" style="margin-top:8px">📷 Foto da etiqueta de óleo<input type="file" accept="image/*" capture="environment" data-foto="etiqueta" onchange="enviarFoto('etiqueta',this)" style="display:none"></label>`;
  }
  return h+'</div>';
}

// ---- pontuação (negativa: quanto menos pontos, melhor) e líder do ranking ----
const fmtPts = n => { n=Math.round((+n||0)*10)/10; return n===0?'0':(n<0?'−':'+')+Math.abs(n).toLocaleString('pt-BR',{maximumFractionDigits:1}); };
const rotGanho=g=>({agua:'💧 Água verificada no dia',oleo:'🛢 Óleo verificado no dia',painel:'📷 Foto do painel na segunda',etiqueta:'📷 Foto da etiqueta na segunda'})[g.tipo]||g.tipo;
function cartaoPontos(r){
  const k=r.ranking; if(!k||!k.eu) return ''; const eu=k.eu, lid=k.lider; const souLider=eu.posicao===1;
  const gan=eu.ganhos||[];
  const pen=(eu.penalidades||[]).slice().sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  const linha=p=>p.tipo==='promessa'
    ? `<div class="row" style="margin:3px 0"><span>🤝 Promessa de pagamento (${fmtD(p.data)})</span><span class="sp"></span><b>${fmtPts(p.pontos)}</b></div>`
    : `<div class="row" style="margin:3px 0"><span>⏰ Atraso de ${p.dias} dia${p.dias>1?'s':''} (${fmtD(p.data)}${p.aberto?' · em aberto':' → '+fmtD(p.fim)})</span><span class="sp"></span><b>${fmtPts(p.pontos)}</b></div>`;
  return `<div class="card"><div class="row"><h3 style="margin:0">🏆 Sua pontuação</h3><span class="sp"></span><span class="muted sm">últimas ${k.semanas} semanas</span></div>
    <div class="row" style="margin:10px 0 4px;align-items:flex-end"><div style="font-size:38px;font-weight:800;line-height:1;color:${eu.pontos<0?'var(--bad)':'var(--ok)'}">${fmtPts(eu.pontos)}</div><div class="muted" style="padding-bottom:4px">pontos<br>quanto maior, melhor</div><span class="sp"></span><div style="text-align:right"><div style="font-size:22px;font-weight:800">${eu.posicao}º</div><div class="muted sm">de ${k.total}</div></div></div>
    <div class="muted sm" style="margin-top:6px">🟢 <b>${eu.semanas_limpas}</b> semana${eu.semanas_limpas===1?'':'s'} seguida${eu.semanas_limpas===1?'':'s'} sem atraso e sem usar a promessa de pagamento</div>
    ${souLider?`<div class="alert ok" style="margin:10px 0 0"><b class="t" style="margin:0">🥇 Você é o melhor motorista!</b><div class="txt" style="margin:4px 0 0">A sua placa aparece para todos os motoristas.</div></div>`
      :lid?`<div class="alert info" style="margin:10px 0 0"><b class="t" style="margin:0">🥇 Melhor motorista agora</b><div class="txt" style="margin:6px 0 0"><span class="plate">${esc(lid.placa||'')}</span> &nbsp;${fmtPts(lid.pontos)} pts · ${lid.semanas_limpas} semana${lid.semanas_limpas===1?'':'s'} limpa${lid.semanas_limpas===1?'':'s'}</div></div>`:''}
    <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700;color:var(--brand)">Como funciona</summary>
      <div class="muted sm" style="margin-top:6px"><b>Você ganha:</b><br>💧 Verificar a água no dia: +0,1 · 🛢 verificar o óleo no dia: +0,1<br>📷 Foto do painel enviada na segunda-feira: +10 · 📷 foto da etiqueta de óleo na segunda-feira: +10<br><b>Você perde:</b><br>Atraso de <b>1 dia</b>: −20 · <b>2 dias</b>: −50 · <b>3 dias ou mais</b>: −100 · cada <b>Prometer pagamento</b>: −10<br>Vale o que aconteceu nas últimas ${k.semanas} semanas. Fica no topo quem tem mais pontos; em empate, quem tem mais semanas seguidas sem atraso e sem promessa.</div></details>
    <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700;color:var(--brand)">O que gerou meus pontos</summary>
      <div style="margin-top:6px">${gan.map(g=>`<div class="row" style="margin:3px 0"><span>${rotGanho(g)} (${g.qtd}×)</span><span class="sp"></span><b style="color:var(--ok)">${fmtPts(g.pontos)}</b></div>`).join('')}${pen.map(linha).join('')}${(gan.length||pen.length)?'':'<div class="muted sm">Nada até agora. Verifique água e óleo todo dia e envie as fotos na segunda! 👏</div>'}</div></details></div>`;
}

function render(rolarChat){
  const app=document.getElementById('app');
  if(!S.token){ app.innerHTML=telaLogin(); return; }
  if(!S.resumo){ app.innerHTML=`<header><h1>Carsz Motorista</h1></header><main><div class="empty">Carregando…</div></main>`; return; }
  const keep=guardarCampos();
  const r=S.resumo; const nl=r.nao_lidas||0;
  const novosAvisos=(r.avisos||[]).filter(a=>!vistos.has(a.id)).length;
  const conteudo={inicio:telaInicio,avisos:telaAvisos,chat:telaChat,manut:telaManut}[S.tab](r);
  app.innerHTML=`<header><h1>Carsz Motorista</h1><button class="ic" aria-label="Menu" onclick="menu()">⋯</button></header>
    <main>${conteudo}</main>
    <nav class="tabs">
      ${[['inicio','🏠','Início',0],['avisos','🔔','Avisos',novosAvisos],['chat','💬','Cobrança',nl],['manut','🛠','Manutenção',0]].map(([k,i,l,n])=>`<button class="${S.tab===k?'on':''}" onclick="irPara('${k}')"><span class="i">${i}</span>${l}${n?`<span class="badge">${n}</span>`:''}</button>`).join('')}
    </nav>${obrigHtml(r)}`;
  document.body.style.overflow=pendencias(r).length?'hidden':'';
  restaurarCampos(keep);
  if(S.tab==='chat'&&(rolarChat||keep.novo)){ const c=document.getElementById('chat_fim'); if(c) c.scrollIntoView({block:'end'}); }
}
// mantém o que a pessoa está digitando quando a tela atualiza sozinha
function guardarCampos(){ const k={vals:{},focus:null,novo:!document.getElementById('chat_fim')}; document.querySelectorAll('[data-keep]').forEach(e=>{ if(e.value!=='') k.vals[e.id]=e.value; }); const a=document.activeElement; if(a&&a.id) k.focus=a.id; return k; }
function restaurarCampos(k){ for(const [id,v] of Object.entries(k.vals)){ const e=document.getElementById(id); if(e&&e.value!==v) e.value=v; } if(k.focus){ const e=document.getElementById(k.focus); if(e&&e.focus) e.focus(); } }

    <label for="lg_senha">Senha</label>

function promessaEmAberto(r){ const h=hojeStr(); return (r.promessas||[]).find(p=>(p.status==='pendente'||p.status==='aceita')&&(p.dataPrometida||'')>=h)||null; }
const STATUS_PROM={pendente:['Aguardando resposta','warn'],aceita:['Aceita','ok'],recusada:['Recusada','bad'],cumprida:['Cumprida','ok'],quebrada:['Não cumprida','bad']};
const STATUS_AGEND={solicitado:['Aguardando confirmação','warn'],confirmado:['Confirmado','ok'],recusado:['Não foi possível','bad'],concluido:['Concluído','neu']};

function telaInicio(r){
  const m=r.motorista, v=r.veiculo, bl=m.bloqueio||{status:'normal'}; const pe=promessaEmAberto(r);
  let h=`<div style="margin:2px 2px 12px"><div class="muted">Olá,</div><div style="font-size:22px;font-weight:800">${esc((m.nome||'').split(' ')[0])}</div></div>`;
  // bloqueio sinalizado pela equipe (o bloqueio em si é feito pela Carsz; aqui só avisa e permite prometer pagamento)
  if(bl.status==='bloqueado'||bl.status==='programado'){
    const bloq=bl.status==='bloqueado';
    h+=`<div class="alert ${bloq?'bad':'warn'}"><b class="t">${bloq?'🔒 Veículo bloqueado':'⚠ Bloqueio programado'}${!bloq&&bl.data?' para '+fmtD(bl.data):''}</b>
      ${bl.motivo?`<div class="txt">${esc(bl.motivo)}</div>`:''}
      ${pe?`<div class="txt"><b>Promessa de pagamento registrada para ${fmtD(pe.dataPrometida)}</b> — ${pe.status==='aceita'?'aceita pela cobrança.':'aguardando resposta da cobrança.'}</div><button class="btn sec" onclick="irPara('chat')">Falar com a cobrança</button>`
          :`<div class="txt">${bloq?'Para pedir o desbloqueio, informe quando vai pagar.':'Para evitar o bloqueio, regularize ou informe quando vai pagar.'}</div><button class="btn" onclick="formPromessa()">🤝 Prometer pagamento</button>`}
    </div>`;
  } else {
    h+=`<div class="alert ok"><b class="t" style="margin:0">✅ Tudo certo com o seu veículo</b></div>`;
  }
  h+=cartaoComprovante(r);
  h+=cartaoVerificacoes(r);
  h+=cartaoPontos(r);
  if(v){
    h+=`<div class="card"><div class="row"><span class="plate">${esc(v.placa||'')}</span><div style="flex:1"><div style="font-weight:700">${esc(v.modelo||'')}</div><div class="muted sm">${esc(v.ano||'')}${v.km?' · '+fmtKm(v.km):''}</div></div></div>
      ${r.reserva?`<div class="alert warn" style="margin:12px 0 0"><b class="t" style="margin:0">🚗 Você está no carro reserva</b><div class="txt" style="margin:4px 0 8px">Sua placa principal <b>${esc((r.principal||{}).placa||'')}</b> continua pontuando e fica guardada para você${r.reserva.desde?' (desde '+fmtD(String(r.reserva.desde).slice(0,10))+')':''}.</div><button class="btn sm" onclick="devolverReserva()">↩ Devolver reserva</button></div>`
        :`<button class="btn sm ghost" style="margin-top:10px" onclick="formTrocarPlaca()">🚗 Peguei um carro reserva</button>`}
      ${r.na_oficina?`<div class="alert info" style="margin:12px 0 0"><b>🛠 Seu veículo está na oficina</b> desde ${fmtD(r.na_oficina.desde)}.</div>`:''}</div>`;
  } else {
    h+=`<div class="card"><div class="muted">Nenhum veículo vinculado ao seu cadastro ainda. Fale com a Carsz.</div></div>`;
  }
  // alerta de revisão (regra simples: 6 meses ou 10.000 km desde a última manutenção registrada)
  const um=r.ultima_manutencao;
  if(v&&um&&um.data){
    const dias=diasEntre(um.data), dkm=(+v.km||0)-(+um.km||0);
    if(dias>=180||dkm>=10000){
      h+=`<div class="alert warn"><b class="t">🔧 Hora de agendar a revisão</b><div class="txt">A última manutenção registrada foi há ${dias} dias${dkm>0?` (${dkm.toLocaleString('pt-BR')} km rodados desde então)`:''}. Recomendamos revisar a cada 6 meses ou 10.000 km.</div><button class="btn" onclick="irPara('manut');setTimeout(()=>{const d=document.getElementById('ag_desc');if(d&&!d.value)d.value='Revisão'},50)">Pedir manutenção</button></div>`;
    }
  }
  if((r.agendadas||[]).length){
    h+=`<div class="card"><h3>📅 Manutenção agendada</h3>${r.agendadas.map(a=>`<div class="list-i"><b>${fmtD(a.data)}</b>${a.obs?`<div class="muted sm">${esc(a.obs)}</div>`:''}</div>`).join('')}</div>`;
  }
  const av=(r.avisos||[]).slice(0,3);
  if(av.length){
    h+=`<div class="card"><div class="row"><h3 style="margin:0">Últimos avisos</h3><span class="sp"></span><button class="btn sm ghost" style="padding:4px 8px" onclick="irPara('avisos')">ver todos</button></div>${av.map(avisoHtml).join('')}</div>`;
  }
  if(r.nao_lidas) h+=`<button class="btn sec" onclick="irPara('chat')">💬 ${r.nao_lidas} mensagem${r.nao_lidas>1?'s':''} nova${r.nao_lidas>1?'s':''} da cobrança</button>`;
  return h;
}

const TIPO_AVISO={cobranca:['💰','bad'],manutencao:['🔧','warn'],urgente:['🚨','bad'],info:['ℹ️','neu'],geral:['📢','neu']};
function avisoHtml(a){
  const [ico,cor]=TIPO_AVISO[a.tipo]||TIPO_AVISO.geral; const novo=!vistos.has(a.id);
  return `<div class="list-i"><div class="row" style="align-items:flex-start"><span style="font-size:20px">${ico}</span><div style="flex:1"><div style="font-weight:700">${esc(a.titulo||'Aviso')} ${novo?'<span class="tag bad">novo</span>':''}</div>
    ${a.texto?`<div style="white-space:pre-wrap">${esc(a.texto)}</div>`:''}<div class="muted sm">${esc(fmtHora(a.em))}</div></div></div></div>`;
}
function telaAvisos(r){
  const av=r.avisos||[];
  // marca como vistos (guarda neste aparelho) — o selo "novo" some na próxima vez
  setTimeout(()=>{ let mudou=false; for(const a of av){ if(!vistos.has(a.id)){ vistos.add(a.id); mudou=true; } } if(mudou){ LS.set('mot_avisos_vistos',JSON.stringify([...vistos].slice(-300))); const n=document.querySelector('nav.tabs button:nth-child(2) .badge'); if(n) n.remove(); } },2500);
  return `<h2 style="margin:4px 2px 10px">Avisos</h2>`+(av.length?`<div class="card">${av.map(avisoHtml).join('')}</div>`:`<div class="empty">Nenhum aviso por enquanto.</div>`);
}

function telaChat(r){
  const ms=S.msgs;
  const pe=promessaEmAberto(r);
  let h=`<div class="row" style="margin:4px 2px 10px"><h2 style="margin:0">Cobrança Carsz</h2><span class="sp"></span>${pe?'':`<button class="btn sm sec" onclick="formPromessa()">🤝 Prometer pagamento</button>`}</div>`;
  if(ms===null) return h+`<div class="empty">Carregando mensagens…</div>`;
  h+=`<div class="chat">${ms.length?ms.map(m=>`<div class="msg ${m.de==='motorista'?'eu':'eq'}">${m.de!=='motorista'?`<b class="sm">${esc(m.autor||'Carsz')}</b><br>`:''}${esc(m.texto)}<div class="h">${esc(fmtHora(m.em))}</div></div>`).join(''):'<div class="empty">Nenhuma mensagem ainda. Escreva abaixo pra falar com a cobrança.</div>'}<div id="chat_fim"></div></div>
    <div class="composer"><textarea id="chat_txt" data-keep placeholder="Escreva sua mensagem…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMsg()}"></textarea><button class="btn" onclick="enviarMsg()">Enviar</button></div>`;
  return h;
}
let enviando=false;
async function enviarMsg(){
  if(enviando) return; const t=document.getElementById('chat_txt'); const txt=(t.value||'').trim(); if(!txt) return;
  enviando=true;
  try{
    const d=await rpc('mot_msg_enviar',{p_token:S.token,p_texto:txt});
    if(d&&d.erro){ toast(d.erro); }
    else { t.value=''; ultimoMsgs=''; await atualizar(true); const c=document.getElementById('chat_fim'); if(c) c.scrollIntoView({block:'end'}); }
  }catch(e){ erroGenerico(e); }
  enviando=false;
}

// promessa de pagamento (pedido de desbloqueio)
function formPromessa(){
  const r=S.resumo; if(promessaEmAberto(r)){ toast('Você já tem uma promessa em aberto'); return; }
  sheet(`<h3>🤝 Prometer pagamento</h3><p class="muted">Diga quando você vai pagar. A cobrança recebe na hora e responde pelo chat.</p>
    <div class="alert warn" style="margin:10px 0 0"><div class="txt" style="margin:0">⚠ Cada promessa de pagamento tira <b>10 pontos</b> da sua pontuação.</div></div>
    <label for="pm_data">Data que vou pagar (até 3 dias)</label><input id="pm_data" type="date" min="${hojeStr()}" max="${somaDias(3)}" value="${somaDias(1)}">
    <label for="pm_valor">Valor que vou pagar (opcional)</label><input id="pm_valor" inputmode="decimal" placeholder="Ex.: 699,00">
    <label for="pm_obs">Observação (opcional)</label><textarea id="pm_obs" placeholder="Ex.: recebo do aplicativo na quinta" style="min-height:70px"></textarea>
    <label for="pm_file">Comprovante de pagamento (opcional — pode enviar depois)</label><input id="pm_file" type="file" accept="image/*,application/pdf">
    <div style="margin-top:14px"><button class="btn" id="pm_btn" onclick="enviarPromessa()">Enviar promessa</button><button class="btn ghost" onclick="fecharSheet()">Cancelar</button></div>`);
}
// ---- comprovante de pagamento (foto ou PDF até 2 MB) ----
function lerArquivo(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
    if(file.size>2*1024*1024) return Promise.reject(new Error('pdfgrande'));
    return new Promise((ok,erro)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).replace(/^data:[^;,]*;base64,/,'data:application/pdf;base64,')); fr.onerror=()=>erro(new Error('imagem')); fr.readAsDataURL(file); });
  }
  return lerFoto(file);
}
// devolve true se enviou; mostra o erro na tela e devolve false se não deu
async function postComprovante(file,valor,obs){
  try{
    const arq=await lerArquivo(file);
    const d=await rpc('mot_enviar_comprovante',{p_token:S.token,p_arquivo:arq,p_valor:valor,p_obs:obs||''});
    if(d&&d.erro){ toast(d.erro); return false; }
    return true;
  }catch(e){
    if(e&&e.message==='pdfgrande'){ toast('PDF muito grande (máximo 2 MB).'); return false; }
    if(e&&e.message==='imagem'){ toast('Não consegui ler o arquivo. Tente uma foto ou PDF.'); return false; }
    erroGenerico(e); return false;
  }
}
function formComprovante(){
  const pe=promessaEmAberto(S.resumo);
  sheet(`<h3>🧾 Enviar comprovante</h3><p class="muted">Anexe a foto ou o PDF do comprovante do pagamento${pe?' da sua promessa':''}. A cobrança confere e dá baixa — depois disso o arquivo é apagado.</p>
    <label for="cp_file">Foto ou PDF (até 2 MB)</label><input id="cp_file" type="file" accept="image/*,application/pdf">
    <label for="cp_valor">Valor pago (opcional)</label><input id="cp_valor" inputmode="decimal" placeholder="Ex.: 699,00">
    <label for="cp_obs">Observação (opcional)</label><textarea id="cp_obs" placeholder="Ex.: pix feito hoje às 14h" style="min-height:70px"></textarea>
    <div style="margin-top:14px"><button class="btn" id="cp_btn" onclick="enviarComprovante()">Enviar comprovante</button><button class="btn ghost" onclick="fecharSheet()">Cancelar</button></div>`);
}
async function enviarComprovante(){
  const inp=document.getElementById('cp_file'); const file=inp&&inp.files&&inp.files[0]; if(!file){ toast('Escolha a foto ou o PDF do comprovante'); return; }
  const b=document.getElementById('cp_btn'); b.disabled=true; b.textContent='Enviando…';
  const ok=await postComprovante(file,numBR(document.getElementById('cp_valor').value),document.getElementById('cp_obs').value);
  if(ok){ fecharSheet(); toast('Comprovante enviado. A cobrança vai conferir.'); ultimoMsgs=''; S.msgs=null; await atualizar(true); }
  else { b.disabled=false; b.textContent='Enviar comprovante'; }
}
const diasDesde = iso => { const t=Date.parse(iso||''); return isNaN(t)?999:(Date.now()-t)/86400000; };
function cartaoComprovante(r){
  const cs=r.comprovantes||[], bl=((r.motorista||{}).bloqueio||{}).status||'normal', pe=promessaEmAberto(r);
  const pen=cs.filter(c=>c.status==='pendente'), rec=cs.filter(c=>c.status==='recusado'), pag=cs.filter(c=>c.status==='pago'&&diasDesde(c.baixaEm)<=3);
  if(bl==='normal'&&!pe&&!pen.length&&!rec.length&&!pag.length) return '';
  const dt=c=>fmtD((c.em||'').slice(0,10))+' '+hhmm(c.em);
  return `<div class="card"><h3>🧾 Comprovante de pagamento</h3>
    ${rec.map(c=>`<div class="alert bad" style="margin:8px 0"><b class="t" style="margin:0">✖ Comprovante recusado</b><div class="txt" style="margin:4px 0 0">${esc(c.recusadoMotivo||'Envie um comprovante legível.')}</div><div style="margin-top:8px"><button class="btn sm" onclick="formComprovante()">Enviar de novo</button></div></div>`).join('')}
    ${pen.map(c=>`<div class="list-i"><b>Enviado em ${dt(c)}</b>${c.valor?' · '+fmtBRL(c.valor):''} <span class="tag warn">Aguardando conferência</span></div>`).join('')}
    ${pag.map(c=>`<div class="list-i"><b>✔ Pagamento confirmado</b> <span class="muted sm">${dt(c)}</span> <span class="tag ok">Baixa dada</span></div>`).join('')}
    ${rec.length?'':`<p class="muted sm" style="margin:6px 0 8px">Já pagou? Anexe o comprovante (foto ou PDF) para a cobrança dar baixa mais rápido.</p><button class="btn ${pen.length?'sec':''}" onclick="formComprovante()">🧾 Enviar comprovante</button>`}
  </div>`;
}
function numBR(s){ s=String(s||'').trim(); if(!s) return null; const n=parseFloat(s.replace(/\./g,'').replace(',','.')); return isNaN(n)?null:n; }
async function enviarPromessa(){
  const data=document.getElementById('pm_data').value, valor=numBR(document.getElementById('pm_valor').value), obs=document.getElementById('pm_obs').value;
  const b=document.getElementById('pm_btn'); b.disabled=true;
  try{
    const d=await rpc('mot_prometer',{p_token:S.token,p_data:data,p_valor:valor,p_obs:obs});
    if(d&&d.erro){ toast(d.erro); b.disabled=false; return; }
    const pf=document.getElementById('pm_file'), arq=pf&&pf.files&&pf.files[0];
    fecharSheet(); ultimoMsgs=''; S.msgs=null;
    if(arq){ const ok=await postComprovante(arq,valor,''); toast(ok?'Promessa e comprovante enviados para a cobrança':'Promessa enviada, mas o comprovante não foi. Use "Enviar comprovante" na tela inicial.'); }
    else toast('Promessa enviada para a cobrança');
    await atualizar(true);
  }catch(e){ erroGenerico(e); b.disabled=false; }
}

function telaManut(r){
  const v=r.veiculo; const ag=r.agendamentos||[];
  let h=`<h2 style="margin:4px 2px 10px">Manutenção</h2>`;
  if((r.agendadas||[]).length) h+=`<div class="card"><h3>📅 Já agendado</h3>${r.agendadas.map(a=>`<div class="list-i"><b>${fmtD(a.data)}</b>${a.obs?`<div class="muted sm">${esc(a.obs)}</div>`:''}</div>`).join('')}</div>`;
  h+=`<div class="card"><h3>Pedir uma manutenção</h3><p class="muted sm" style="margin:0 0 4px">A Carsz confirma a data pelo app e pelo WhatsApp.</p>
    <label for="ag_data">Data desejada</label><input id="ag_data" data-keep type="date" min="${hojeStr()}" value="${somaDias(2)}">
    <label for="ag_desc">O que precisa ser feito?</label><textarea id="ag_desc" data-keep placeholder="Ex.: barulho na suspensão, troca de óleo…"></textarea>
    <label for="ag_km">Km atual (opcional)</label><input id="ag_km" data-keep inputmode="numeric" placeholder="${v&&v.km?esc(String(v.km)):'Ex.: 45000'}">
    <button class="btn" style="margin-top:14px" id="ag_btn" onclick="enviarAgendamento()">Enviar pedido</button></div>`;
  if(ag.length){
    h+=`<div class="card"><h3>Meus pedidos</h3>${ag.map(a=>{ const [t,c]=STATUS_AGEND[a.status]||['—','neu']; return `<div class="list-i"><div class="row"><b>${fmtD(a.dataDesejada)}</b><span class="tag ${c}">${t}${a.status==='confirmado'&&a.dataConfirmada?' · '+fmtD(a.dataConfirmada):''}</span></div><div class="sm">${esc(a.descricao||'')}</div>${a.resposta?`<div class="muted sm">Resposta: ${esc(a.resposta)}</div>`:''}</div>`; }).join('')}</div>`;
  }
  return h;
}
async function enviarAgendamento(){
  const data=document.getElementById('ag_data').value, desc=document.getElementById('ag_desc').value, km=parseInt(String(document.getElementById('ag_km').value).replace(/\D/g,''))||null;
  const b=document.getElementById('ag_btn'); b.disabled=true;
  try{
    const d=await rpc('mot_agendar',{p_token:S.token,p_data:data,p_descricao:desc,p_km:km});
    if(d&&d.erro){ toast(d.erro); b.disabled=false; return; }
    toast('Pedido enviado! A Carsz vai confirmar.'); document.getElementById('ag_desc').value=''; document.getElementById('ag_km').value=''; await atualizar(true);
  }catch(e){ erroGenerico(e); b.disabled=false; }
}

// menu (⋯)
function menu(){
  sheet(`<h3>${esc(S.nome||'Minha conta')}</h3><p class="muted" style="margin:0 0 12px">Carsz Motorista</p>
    ${emApp?'':`<button class="btn sec" style="margin-bottom:8px" onclick="fecharSheet();instalar()">📲 Instalar o app</button>`}
    <button class="btn danger" style="margin-bottom:4px" onclick="fecharSheet();sair()">Sair</button>
    <button class="btn ghost" onclick="fecharSheet()">Fechar</button>`);
}
// ---- carro reserva (a placa principal segue pontuando; o motorista só escolhe entre placas vagas) ----
async function formTrocarPlaca(){
  sheet(`<h3>🚗 Carro reserva</h3><div class="muted">Carregando placas vagas…</div>`);
  try{
    const vagas=await rpc('mot_placas_vagas',{p_token:S.token});
    if(!document.getElementById('sheet_bg')) return;
    sheet(`<h3>🚗 Peguei um carro reserva</h3><p class="muted">Escolha a placa do carro que você pegou. Só aparecem placas <b>vagas</b>. Sua placa principal <b>${esc((S.resumo.principal||{}).placa||'')}</b> continua pontuando e fica guardada para você.</p>
      ${(vagas||[]).length?`<label for="tp_veic">Placa do carro reserva</label><select id="tp_veic">${vagas.map(v=>`<option value="${esc(v.id)}">${esc(v.placa)} · ${esc(v.modelo||'')}</option>`).join('')}</select>
      <div style="margin-top:14px"><button class="btn" id="tp_btn" onclick="trocarPlaca()">Confirmar troca</button><button class="btn ghost" onclick="fecharSheet()">Cancelar</button></div>`
      :`<div class="empty">Nenhuma placa vaga agora. Fale com a Carsz pelo chat.</div><button class="btn ghost" onclick="fecharSheet()">Fechar</button>`}`);
  }catch(e){ fecharSheet(); erroGenerico(e); }
}
async function trocarPlaca(){
  const sel=document.getElementById('tp_veic'); if(!sel||!sel.value) return; const b=document.getElementById('tp_btn'); b.disabled=true;
  try{
    const d=await rpc('mot_trocar_placa',{p_token:S.token,p_veiculo_id:sel.value});
    if(d&&d.erro){ toast(d.erro); b.disabled=false; if(/vaga/.test(d.erro)) formTrocarPlaca(); return; }
    fecharSheet(); toast('Carro reserva '+(d.placa||'')+' registrado'); ultimoMsgs=''; S.msgs=null; await atualizar(true);
  }catch(e){ erroGenerico(e); b.disabled=false; }
}
async function devolverReserva(){
  if(!confirm('Você devolveu o carro reserva e voltou para o seu carro?')) return;
  try{
    const d=await rpc('mot_devolver_reserva',{p_token:S.token});
    if(d&&d.erro){ toast(d.erro); return; }
    toast('Reserva devolvido. Você voltou para a sua placa.'); ultimoMsgs=''; S.msgs=null; await atualizar(true);
  }catch(e){ erroGenerico(e); }
}

// ---- boot ----
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('service worker não registrado:',e)); }); }
render();
if(S.token) atualizar(true);
</script>
